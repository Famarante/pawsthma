    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100vh; min-height: 100dvh;

    #root { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }

      display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr;

  <!-- Firebase ES-module bootstrap. Exposes window.__pawFB and dispatches `paw-fb-ready`. -->
  <script type="module">
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyC9G95r3-vYEvSF8SjQgYenfbSwexsoSHk",
      authDomain: "pawsthma.firebaseapp.com",
      projectId: "pawsthma",
      databaseURL: "https://pawsthma-default-rtdb.europe-west1.firebasedatabase.app/",
      storageBucket: "pawsthma.firebasestorage.app",
      messagingSenderId: "416458724436",
      appId: "1:416458724436:web:305b100e62429fbd7189c1"
    };
    const ready = (api) => {
      window.__pawFB = api;
      window.dispatchEvent(new Event('paw-fb-ready'));
    };
    try {
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
      const { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } =
        await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
      const { getDatabase, ref, get, set, update, onValue } =
        await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");
      const app = initializeApp(FIREBASE_CONFIG);
      const auth = getAuth(app);
      const db = getDatabase(app);
      const fb = {
        enabled: true,
        fbAuthObserve: (cb) => onAuthStateChanged(auth, (u) => cb(u)),
        fbSignIn: (email, pw) => signInWithEmailAndPassword(auth, email, pw),
        fbSignUp: (email, pw) => createUserWithEmailAndPassword(auth, email, pw),
        fbSignOut: () => signOut(auth),
        fbLoad: async (homeId) => {
          const snap = await get(ref(db, `pawsthma/households/${homeId}`));
          return snap.exists() ? snap.val() : null;
        },
        fbSave: async (homeId, home) => {
          if (!home) return false;
          await set(ref(db, `pawsthma/households/${homeId}`), home);
          return true;
        },
        fbSubscribe: (homeId, cb) => onValue(ref(db, `pawsthma/households/${homeId}`), (snap) => cb(snap.exists() ? snap.val() : null)),
        fbLoadUserMeta: async (uid) => {
          const snap = await get(ref(db, `pawsthma/users/${uid}`));
          return snap.exists() ? snap.val() : null;
        },
        fbSaveUserMeta: async (uid, meta) => { await update(ref(db, `pawsthma/users/${uid}`), meta); },
        fbCreateInvite: async ({ code, householdId, createdBy, createdAt, expiresAt }) => {
          await set(ref(db, `pawsthma/invites/${code}`), {
            code, householdId, createdBy,
            createdAt: createdAt ?? Date.now(),
            expiresAt: expiresAt ?? (Date.now() + 7*24*60*60*1000),
            usedBy: null, usedAt: null,
          });
          return true;
        },
        fbRedeemInvite: async ({ code, uid }) => {
          const r = ref(db, `pawsthma/invites/${code}`);
          const snap = await get(r);
          const invite = snap.val();
          if (!invite) return { ok:false, reason:'not-found' };
          if (invite.usedBy) return { ok:false, reason:'used' };
          if (invite.expiresAt && Date.now() > invite.expiresAt) return { ok:false, reason:'expired' };
          await update(r, { usedBy: uid, usedAt: Date.now() });
          return { ok:true, householdId: invite.householdId };
        },
      };
      ready(fb);
    } catch (err) {
      console.error('Firebase failed to load — falling back to local mode', err);
      ready({ enabled: false });
    }
  </script>

       and give useTweaks real session-only state for the few things it drives. -->
  <script>
    window.useTweaks = function(defaults) {
      const [v, setV] = React.useState(defaults);
      const setTweak = React.useCallback(function(keyOrEdits, val) {
        const edits = (typeof keyOrEdits === 'object' && keyOrEdits !== null) ? keyOrEdits : { [keyOrEdits]: val };
        setV(function(prev) { return Object.assign({}, prev, edits); });
      }, []);
      return [v, setTweak];
    };
    var _noop = function() { return null; };
    window.TweaksPanel = _noop; window.TweakSection = _noop; window.TweakRow = _noop;
    window.TweakSlider = _noop; window.TweakToggle = _noop; window.TweakRadio = _noop;

    window.TweakColor = _noop; window.TweakButton = _noop;
    window.AndroidStatusBar = _noop; window.AndroidNavBar = _noop;
    window.AndroidAppBar = _noop; window.AndroidListItem = _noop;
    window.AndroidKeyboard = _noop; window.AndroidDevice = _noop;

  <script type="text/babel" data-presets="react" data-type="module">
// components.jsx — Pawsthma design system primitives

// ─── Theme & tokens ───────────────────────────────────────────
const ACCENTS = {
  coral: { p: '#FF7E67', pDim: '#FFB8A8', pCont: '#FFE4DC', onPCont: '#5C1F12', tint: 'rgba(255,126,103,0.10)' },
  indigo:{ p: '#7C5CFF', pDim: '#B7A4FF', pCont: '#E7DEFF', onPCont: '#260C7B', tint: 'rgba(124,92,255,0.10)' },
  mint:  { p: '#1E9E94', pDim: '#7FD3CB', pCont: '#CDEBE7', onPCont: '#003733', tint: 'rgba(30,158,148,0.10)' },
  plum:  { p: '#A4407C', pDim: '#E5A8CD', pCont: '#FFD8EA', onPCont: '#3D0027', tint: 'rgba(164,64,124,0.10)' },
};

function buildTheme({ accent = 'coral', dark = false, density = 'cozy' }) {
  const a = ACCENTS[accent] || ACCENTS.coral;
  const compact = density === 'compact';
  if (dark) {
    return {
      a,
      bg: '#10171A',
      surface: '#10171A',
      surfaceDim: '#0B1114',
      surfaceContainer: '#1A2226',
      surfaceContainerHigh: '#222B30',
      surfaceContainerHighest: '#2A3338',
      onSurface: '#E2EAEC',
      onSurfaceVar: '#A2B1B5',
      outline: '#384247',
      outlineVar: '#22292D',
      // semantic
      sevMild:    '#34D9C9',
      sevModerate:'#F5B441',
      sevSevere:  '#FF7775',
      success:    '#34D9C9',
      warning:    '#F5B441',
      info:       '#7CB7FF',
      // type
      pad: compact ? 12 : 16,
      gap: compact ? 10 : 14,
      density,
      dark,
      accent,
    };
  }
  return {
    a,
    bg: '#F5F8F8',
    surface: '#FFFFFF',
    surfaceDim: '#EEF2F2',
    surfaceContainer: '#FFFFFF',
    surfaceContainerHigh: '#F5F8F8',
    surfaceContainerHighest: '#EAEEEE',
    onSurface: '#0F1A18',
    onSurfaceVar: '#56625F',
    outline: '#C8D0CE',
    outlineVar: '#E5EAE8',
    sevMild:    '#1E9E94',
    sevModerate:'#D48E1A',
    sevSevere:  '#E04545',
    success:    '#1E9E94',
    warning:    '#D48E1A',
    info:       '#3F6FBF',
    pad: compact ? 12 : 16,
    gap: compact ? 10 : 14,
    density,
    dark,
    accent,
  };
}
const ThemeCtx = React.createContext(buildTheme({}));
const useTheme = () => React.useContext(ThemeCtx);

// ─── Icon ─────────────────────────────────────────────────────
function Icon({ name, size = 24, fill = false, weight = 500, color, style }) {
  return (
    <span
      className={'material-symbols-rounded' + (fill ? ' ic-fill' : '')}
      style={{
        fontSize: size,
        color: color || 'inherit',
        fontVariationSettings: `'opsz' ${size}, 'GRAD' 0, 'wght' ${weight}, 'FILL' ${fill ? 1 : 0}`,
        ...style,
      }}
    >{name}</span>
  );
}

// ─── Surfaces ─────────────────────────────────────────────────
function Card({ children, style, padded = true, onClick, tone, ...rest }) {
  const t = useTheme();
  const bg = tone === 'tint' ? t.a.tint : tone === 'dim' ? t.surfaceDim : t.surfaceContainer;
  return (
    <div onClick={onClick} style={{
      background: bg,
      borderRadius: 24,
      border: `1px solid ${t.outlineVar}`,
      padding: padded ? t.pad + 4 : 0,
      transition: 'transform .15s ease, background .2s',
      cursor: onClick ? 'pointer' : 'default',
      ...style,
    }} {...rest}>
      {children}
    </div>
  );
}

function Chip({ children, selected, onClick, leadingIcon, color, style }) {
  const t = useTheme();
  const bg = selected ? (color || t.a.pCont) : 'transparent';
  const fg = selected ? (color ? '#0F1A18' : t.a.onPCont) : t.onSurfaceVar;
  const border = selected ? 'transparent' : t.outline;
  return (
    <button onClick={onClick} style={{
      height: 32, padding: '0 12px',
      display: 'inline-flex', alignItems: 'center', gap: 6,
      borderRadius: 8,
      border: `1px solid ${border}`,
      background: bg, color: fg,
      fontFamily: 'inherit', fontSize: 13, fontWeight: 600,
      cursor: 'pointer',
      ...style,
    }}>
      {leadingIcon && <Icon name={leadingIcon} size={16} fill={selected} />}

function Button({ children, variant = 'filled', onClick, leadingIcon, trailingIcon, color, style, full, disabled }) {
  const t = useTheme();
  const c = color || t.a.p;
  const filled = {
    background: disabled ? t.outlineVar : c,
    color: disabled ? t.onSurfaceVar : '#fff',
    border: 'none',
  };
  const tonal = {
    background: disabled ? t.outlineVar : t.a.pCont,
    color: disabled ? t.onSurfaceVar : t.a.onPCont,
    border: 'none',
  };
  const outlined = {
    background: 'transparent',
    color: c,
    border: `1px solid ${t.outline}`,
  };
  const text = {
    background: 'transparent',
    color: c,
    border: 'none',
    padding: '0 12px',
  };
  const s = variant === 'tonal' ? tonal : variant === 'outlined' ? outlined : variant === 'text' ? text : filled;
  return (
    <button onClick={disabled ? undefined : onClick} style={{
      height: 48, padding: '0 24px',
      borderRadius: 999,
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,
      fontFamily: 'inherit', fontSize: 15, fontWeight: 700,
      cursor: disabled ? 'default' : 'pointer',
      width: full ? '100%' : 'auto',
      transition: 'transform .12s ease, filter .12s',
      ...s,
      ...style,
    }}
    onMouseDown={e => !disabled && (e.currentTarget.style.transform = 'scale(0.98)')}
    onMouseUp={e => !disabled && (e.currentTarget.style.transform = 'scale(1)')}
    onMouseLeave={e => !disabled && (e.currentTarget.style.transform = 'scale(1)')}>
      {leadingIcon && <Icon name={leadingIcon} size={18} fill />}
      <span>{children}</span>
      {trailingIcon && <Icon name={trailingIcon} size={18} />}

function LineChart({ values, height = 140 }) {
  const t = useTheme();
  const w = 320;
  const max = Math.max(1, ...values);
  const stepX = w / (values.length - 1);
  const pts = values.map((v, i) => [i * stepX, height - 24 - (v / max) * (height - 32)]);
  const path = pts.reduce((acc, [x, y], i) => {
    if (i === 0) return `M ${x} ${y}`;
    const [px, py] = pts[i - 1];
    const cx1 = px + stepX * 0.4, cy1 = py;
    const cx2 = x - stepX * 0.4, cy2 = y;
    return `${acc} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x} ${y}`;
  }, '');
  const fill = `${path} L ${pts[pts.length-1][0]} ${height} L 0 ${height} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none" style={{ width: '100%', height, display: 'block' }}>
      <defs>
        <linearGradient id="lcg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={t.a.p} stopOpacity="0.25" />
          <stop offset="100%" stopColor={t.a.p} stopOpacity="0" />
        </linearGradient>
      </defs>
      {[0.25, 0.5, 0.75].map(g => (
        <line key={g} x1="0" y1={(height - 24) * g} x2={w} y2={(height - 24) * g}
              stroke={t.outlineVar} strokeWidth="1" strokeDasharray="3 4" />
      ))}
      <path d={fill} fill="url(#lcg)" />
      <path d={path} fill="none" stroke={t.a.p} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {pts.map(([x, y], i) => (
        <circle key={i} cx={x} cy={y} r="3" fill={t.surface} stroke={t.a.p} strokeWidth="2" />
      ))}
    </svg>
  );
}

function DonutChart({ segments, total, size = 132, stroke = 14 }) {
  const t = useTheme();
  const r = (size - stroke) / 2;
  const C = 2 * Math.PI * r;
  let offset = 0;
  return (
    <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} stroke={t.surfaceContainerHighest} strokeWidth={stroke} fill="none" />
        {segments.map((s, i) => {
          const len = (s.value / total) * C;
          const dash = `${len} ${C - len}`;
          const dashoff = -offset;
          offset += len;
          return (
            <circle key={i} cx={size/2} cy={size/2} r={r}
              stroke={s.color} strokeWidth={stroke} fill="none"
              strokeDasharray={dash} strokeDashoffset={dashoff}
              strokeLinecap="butt"
            />
          );
        })}
      </svg>
      <div style={{
        position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
        alignItems: 'center', justifyContent: 'center',
      }}>
        <div style={{ fontSize: 26, fontWeight: 800, color: t.onSurface, letterSpacing: -1 }}>{total}</div>
        <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 1, color: t.onSurfaceVar, textTransform: 'uppercase' }}>Total</div>
      </div>
    </div>
  );
}

const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
const isToday = (d) => {
  const a = new Date(d), b = new Date();
  return a.toDateString() === b.toDateString();
};

// ─── Attack History ───────────────────────────────────────────
function HistoryScreen({ state, openSheet, openDetail }) {
  const t = useTheme();
  const [filter, setFilter] = React.useState('all');
  const [scrolled, setScrolled] = React.useState(false);
  const filtered = state.attacks
    .filter(a => filter === 'all' || a.severity === filter)
    .sort((a,b) => new Date(b.time) - new Date(a.time));
  // group by day
  const groups = {};
  filtered.forEach(a => {
    const k = fmtDay(a.time);
    (groups[k] ||= []).push(a);
  });

  return (
    <div className="scroll screen-anim" style={{ flex: 1, overflow: 'auto', background: t.bg }}
      onScroll={e => setScrolled(e.target.scrollTop > 8)}>
      <TopBar
        title="Attack history"
        subtitle={`${filtered.length} logged`}
        large
        scrolled={scrolled}
        leading={<IconButton name="arrow_back" />}
        trailing={[
          <IconButton key="search" name="search" />,
          <IconButton key="filter" name="filter_list" />,
        ]}
      />
      <div style={{ padding: '0 16px 24px' }}>
        <div style={{ display: 'flex', gap: 8, padding: '4px 0 12px', overflowX: 'auto' }}>
          <Chip selected={filter === 'all'} onClick={() => setFilter('all')}>All</Chip>
          <Chip selected={filter === 'mild'} onClick={() => setFilter('mild')}
            color={t.dark ? 'rgba(30,158,148,0.18)' : '#CDEBE7'} leadingIcon="circle">Mild</Chip>
          <Chip selected={filter === 'moderate'} onClick={() => setFilter('moderate')}
            color={t.dark ? 'rgba(245,180,65,0.18)' : '#FEEAC9'} leadingIcon="circle">Moderate</Chip>
          <Chip selected={filter === 'severe'} onClick={() => setFilter('severe')}
            color={t.dark ? 'rgba(255,119,117,0.18)' : '#FFD8D2'} leadingIcon="circle">Severe</Chip>
        </div>

        {Object.keys(groups).length === 0 && (
          <Card style={{ padding: 32, textAlign: 'center' }}>
            <Icon name="check_circle" size={32} fill color={t.sevMild} />
            <div style={{ fontSize: 16, fontWeight: 800, color: t.onSurface, marginTop: 8 }}>No attacks</div>
            <div style={{ fontSize: 13, color: t.onSurfaceVar, marginTop: 4 }}>Nothing matches this filter.</div>
          </Card>
        )}

        {Object.entries(groups).map(([day, items]) => (
          <div key={day} style={{ marginTop: 8 }}>
            <div style={{
              display: 'inline-block', padding: '4px 12px',
              background: t.surfaceContainerHigh,
              borderRadius: 999, fontSize: 11, fontWeight: 800,
              color: t.onSurfaceVar, letterSpacing: 0.4, textTransform: 'uppercase',
              margin: '12px 0 8px',
            }}>{day}</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {items.map(a => <AttackRow key={a.id} attack={a} onClick={() => openDetail && openDetail('attack', a)} />)}
            </div>
          </div>
        ))}
        <div style={{ height: 16 }} />
      </div>
      <FAB onClick={() => openSheet('attack')} icon="add" label="Log attack" />
    </div>
  );
}

function AttackRow({ attack: a, onClick }) {
  const t = useTheme();
  const sevColor = a.severity === 'mild' ? t.sevMild : a.severity === 'moderate' ? t.sevModerate : t.sevSevere;
  return (
    <div onClick={onClick} style={{
      background: t.surfaceContainer, borderRadius: 20,
      border: `1px solid ${t.outlineVar}`,
      borderLeft: `4px solid ${sevColor}`,
      padding: 16,
      cursor: onClick ? 'pointer' : 'default',
      transition: 'transform .12s ease',
    }}
    onMouseDown={e => onClick && (e.currentTarget.style.transform = 'scale(0.99)')}
    onMouseUp={e => onClick && (e.currentTarget.style.transform = 'scale(1)')}
    onMouseLeave={e => onClick && (e.currentTarget.style.transform = 'scale(1)')}>
      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 12 }}>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 15, fontWeight: 800, color: t.onSurface }}>{a.title || `${cap(a.severity)} attack`}</div>
          <div style={{ fontSize: 12, color: t.onSurfaceVar, fontWeight: 600, marginTop: 2, fontVariantNumeric: 'tabular-nums' }}>
            {fmtTime(a.time)}
          </div>
        </div>
        <SeverityBadge level={a.severity} />
      </div>
      <div style={{ display: 'flex', gap: 16, marginTop: 10, fontSize: 12, color: t.onSurfaceVar, fontWeight: 600 }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>
          <Icon name="timer" size={14} /> {a.duration} min
        </span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>
          <Icon name={a.usedInhaler ? 'medication_liquid' : 'do_not_disturb_on'} size={14} />
          {a.usedInhaler ? 'Inhaler used' : 'No meds'}
        </span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>
          <Icon name="person" size={14} /> {a.who}

      </div>
      {a.note && (
        <div style={{
          marginTop: 10, padding: 12,
          background: t.surfaceContainerHigh, borderRadius: 14,
          fontSize: 13, color: t.onSurface, lineHeight: 1.45,
        }}>{a.note}</div>
      )}

  );
}

// ─── Insights ─────────────────────────────────────────────────
function InsightsScreen({ state }) {
  const t = useTheme();
  const [range, setRange] = React.useState('W');
  const [scrolled, setScrolled] = React.useState(false);
  // streak — days since last attack
  const lastAttack = state.attacks.length ? Math.max(...state.attacks.map(a => new Date(a.time).getTime())) : 0;
  const streakDays = lastAttack ? Math.floor((Date.now() - lastAttack) / (1000*60*60*24)) : 30;
  const totalAttacks = state.attacks.length;
  const sevCounts = ['mild','moderate','severe'].map(s => ({
    label: cap(s), value: state.attacks.filter(a => a.severity === s).length,
    color: s === 'mild' ? t.sevMild : s === 'moderate' ? t.sevModerate : t.sevSevere,
  }));
  const series = state.weeklyData.map(d => d.attacks);
  return (
    <div className="scroll screen-anim" style={{ flex: 1, overflow: 'auto', background: t.bg }}
      onScroll={e => setScrolled(e.target.scrollTop > 8)}>
      <TopBar
        title="Health insights"
        subtitle="Last 30 days"
        large
        scrolled={scrolled}
        trailing={[<IconButton key="cal" name="calendar_month" />]}
      />
      <div style={{ padding: '0 16px 32px' }}>
        {/* Stat cards */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10 }}>
          <StatCard icon="priority_high" tone="severe" value={totalAttacks} label="Attacks" />
          <StatCard icon="check_circle" tone="mild" value="98%" label="Adherence" />
          <StatCard icon="trending_down" tone="moderate" value="-15%" label="Trend" />
        </div>

        {/* Frequency line chart */}
        <Card style={{ marginTop: 14, padding: 18 }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
            <div>
              <div style={{ fontSize: 16, fontWeight: 800, color: t.onSurface }}>Attack frequency</div>
              <div style={{ fontSize: 12, color: t.onSurfaceVar, fontWeight: 500, marginTop: 2 }}>Down from last period</div>
            </div>
            <SegmentedControl
              options={[{value:'W',label:'W'},{value:'M',label:'M'},{value:'Y',label:'Y'}]}
              value={range} onChange={setRange}
            />
          </div>
          <LineChart values={series} height={140} />
          <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8, fontSize: 11, fontWeight: 600, color: t.onSurfaceVar }}>
            {state.weeklyData.map(d => <span key={d.day}>{d.day}</span>)}
          </div>
        </Card>

        {/* Severity breakdown */}
        <Card style={{ marginTop: 14, padding: 18 }}>
          <div style={{ fontSize: 16, fontWeight: 800, color: t.onSurface, marginBottom: 14 }}>Severity breakdown</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
            <DonutChart segments={sevCounts} total={totalAttacks || 1} />
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 12 }}>
              {sevCounts.map(s => {
                const pct = totalAttacks ? Math.round(s.value/totalAttacks*100) : 0;
                return (
                  <div key={s.label}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, fontSize: 13, fontWeight: 600, color: t.onSurface }}>
                        <span style={{ width: 10, height: 10, borderRadius: 3, background: s.color }} />
                        {s.label}
                      </span>
                      <span style={{ fontSize: 13, fontWeight: 800, color: t.onSurface }}>{pct}%</span>
                    </div>
                    <div style={{
                      marginTop: 4, height: 4, borderRadius: 2,
                      background: t.surfaceContainerHighest, overflow: 'hidden',
                    }}>
                      <div style={{ width: `${pct}%`, height: '100%', background: s.color }} />
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </Card>

        {/* Calendar heatmap */}
        <SectionTitle>Activity heatmap</SectionTitle>
        <Card style={{ padding: 18 }}>
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 14 }}>
            <div>
              <div style={{ fontSize: 16, fontWeight: 800, color: t.onSurface }}>Last 12 weeks</div>
              <div style={{ fontSize: 12, color: t.onSurfaceVar, fontWeight: 500, marginTop: 2 }}>
                <span style={{ color: t.sevMild, fontWeight: 800 }}>{streakDays}</span> days since last attack
              </div>
            </div>
          </div>
          <CalendarHeatmap attacks={state.attacks} />
        </Card>

        {/* Triggers */}
        <SectionTitle action={
          <button style={{ border: 'none', background: 'transparent', color: t.a.p, fontSize: 13, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit' }}>View all</button>
        }>Top triggers</SectionTitle>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {state.triggers.map(tr => (
            <Card key={tr.name} style={{ padding: 14 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <div style={{
                  width: 40, height: 40, borderRadius: 12,
                  background: tr.bg, color: tr.fg,
                  display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  <Icon name={tr.icon} size={20} fill />

                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 800, color: t.onSurface }}>{tr.name}</div>

                  {tr.level}
                </div>
              </div>
            </Card>
          ))}
        </div>
      </div>
    </div>
  );
}

function StatCard({ icon, value, label, tone }) {
  const t = useTheme();
  const map = {
    severe:   { bg: t.dark ? 'rgba(255,119,117,0.14)' : '#FFEEEC', fg: t.sevSevere },
    mild:     { bg: t.dark ? 'rgba(30,158,148,0.14)'  : '#E0F4F0', fg: t.sevMild },
    moderate: { bg: t.dark ? 'rgba(245,180,65,0.14)'  : '#FFF6E5', fg: t.sevModerate },
  };
  const m = map[tone];
  return (
    <div style={{
      background: m.bg, borderRadius: 20, padding: 14, minHeight: 110,
      display: 'flex', flexDirection: 'column', gap: 6,
    }}>
      <Icon name={icon} size={20} fill color={m.fg} />

      <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: 0.6, color: m.fg, textTransform: 'uppercase' }}>{label}</div>
    </div>
  );
}

// ─── Calendar Heatmap (12 weeks) ──────────────────────────────
function CalendarHeatmap({ attacks }) {
  const t = useTheme();
  // Build 12 weeks × 7 days grid ending today
  const today = new Date(); today.setHours(0,0,0,0);
  const days = [];
  // start at the Sunday of (today - 11 weeks)
  const start = new Date(today);
  start.setDate(start.getDate() - (11 * 7 + start.getDay()));
  for (let w = 0; w < 12; w++) {
    const col = [];
    for (let d = 0; d < 7; d++) {
      const date = new Date(start);
      date.setDate(start.getDate() + w * 7 + d);
      const key = date.toDateString();
      const count = attacks.filter(a => new Date(a.time).toDateString() === key).length;
      col.push({ date, count, future: date > today });
    }
    days.push(col);
  }
  const colorFor = (c) => {
    if (c === 0) return t.surfaceContainerHighest;
    const intensity = Math.min(1, c / 3);
    const opacity = 0.25 + intensity * 0.75;
    return t.a.p + Math.round(opacity * 255).toString(16).padStart(2, '0');
  };
  const monthLabels = [];
  let lastMonth = -1;
  days.forEach((col, i) => {
    const m = col[0].date.getMonth();
    if (m !== lastMonth) {
      monthLabels.push({ i, label: col[0].date.toLocaleDateString('en', { month: 'short' }) });
      lastMonth = m;
    }
  });

  return (
    <div>
      <div style={{ display: 'flex', gap: 4, paddingLeft: 18, marginBottom: 4, fontSize: 10, fontWeight: 700, color: t.onSurfaceVar }}>
        {days.map((_, i) => {
          const ml = monthLabels.find(m => m.i === i);
          return <div key={i} style={{ width: 18, textAlign: 'center' }}>{ml ? ml.label : ''}</div>;
        })}
      </div>
      <div style={{ display: 'flex', gap: 6 }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 4, fontSize: 9, fontWeight: 700, color: t.onSurfaceVar, paddingTop: 2 }}>
          {['M','W','F'].map((d, i) => (
            <div key={d} style={{ height: 18, lineHeight: '18px', marginTop: i === 0 ? 18 : 18 }}>{d}</div>
          ))}
        </div>
        <div style={{ display: 'flex', gap: 4, flex: 1 }}>
          {days.map((col, i) => (
            <div key={i} style={{ display: 'flex', flexDirection: 'column', gap: 4, flex: 1 }}>
              {col.map((cell, j) => (
                <div key={j} title={`${cell.date.toLocaleDateString()}: ${cell.count} attack${cell.count===1?'':'s'}`}
                  style={{
                    aspectRatio: '1', borderRadius: 4,
                    background: cell.future ? 'transparent' : colorFor(cell.count),
                    border: cell.future ? 'none' : `1px solid ${t.outlineVar}`,
                  }} />
              ))}
            </div>
          ))}
        </div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 10, justifyContent: 'flex-end', fontSize: 11, color: t.onSurfaceVar, fontWeight: 600 }}>

// ─── Onboarding flow ──────────────────────────────────────────
const PALETTE_EMOJIS = ['👨','👩','🧑','👧','👦','🧓','👴','👵'];
const PALETTE_COLORS = ['#FF7E67','#1E9E94','#7C5CFF','#A4407C','#D48E1A','#3F6FBF','#34AA48','#E04545'];

function OnboardingFlow({ onDone }) {
  const t = useTheme();
  const { lang, setLang } = useT();
  const [step, setStep] = React.useState(0);
  const [cat, setCat] = React.useState({ name: '', breed: 'Tabby Shorthair', weight: '', diagnosis: '' });
  const [profiles, setProfiles] = React.useState([
    { id: 1, name: '', emoji: '👨', color: PALETTE_COLORS[0] },
    { id: 2, name: '', emoji: '👩', color: PALETTE_COLORS[1] },
  ]);
  const total = 4;
  const next = () => setStep(s => Math.min(total - 1, s + 1));
  const back = () => setStep(s => Math.max(0, s - 1));
  const finish = () => onDone({ cat, profiles: profiles.filter(p => p.name.trim()) });
  const canNext =
    step === 0 ? true :
    step === 1 ? !!cat.name.trim() :
    step === 2 ? profiles.some(p => p.name.trim()) :
    true;

  return (
    <div className="screen-anim" style={{
      flex: 1, overflow: 'auto', background: t.bg,
      display: 'flex', flexDirection: 'column',
    }}>
      {/* Top bar with back + lang + progress */}
      <div style={{ padding: '8px 16px', display: 'flex', alignItems: 'center', gap: 8, height: 56 }}>
        {step > 0 ? <IconButton name="arrow_back" onClick={back} /> : <div style={{ width: 40 }} />}
        <div style={{ flex: 1, height: 6, borderRadius: 3, background: t.surfaceContainerHigh, overflow: 'hidden' }}>
          <div style={{ width: `${((step+1)/total)*100}%`, height: '100%', background: t.a.p, transition: 'width .3s' }} />
        </div>
        <button onClick={() => setLang(lang === 'en' ? 'pt' : 'en')} style={{
          height: 36, padding: '0 12px', borderRadius: 999,
          border: `1px solid ${t.outlineVar}`, background: t.surfaceContainer,
          fontFamily: 'inherit', fontSize: 12, fontWeight: 800,
          color: t.onSurface, cursor: 'pointer',
          display: 'inline-flex', alignItems: 'center', gap: 4,
        }}>
          <Icon name="translate" size={14} />
          {lang.toUpperCase()}
        </button>
      </div>

      <div style={{ flex: 1, padding: '0 24px 24px', display: 'flex', flexDirection: 'column' }}>
        {step === 0 && <OnbWelcome lang={lang} onSkip={onDone} />}
        {step === 1 && <OnbCat lang={lang} cat={cat} setCat={setCat} />}
        {step === 2 && <OnbProfiles lang={lang} profiles={profiles} setProfiles={setProfiles} catName={cat.name || 'Whiskers'} />}
        {step === 3 && <OnbDone lang={lang} catName={cat.name || 'Whiskers'} />}
      </div>

      <div style={{ padding: '16px 24px 24px' }}>
        <Button full disabled={!canNext}
          trailingIcon={step === total - 1 ? 'arrow_forward' : 'arrow_forward'}
          onClick={() => step === total - 1 ? finish() : next()}>
          {step === 0 ? tr(lang, 'getStarted') :
            step === total - 1 ? tr(lang, 'enterApp') :
            tr(lang, 'next')}
        </Button>
        {step === 0 && (
          <button onClick={onDone} style={{
            width: '100%', marginTop: 12, padding: '12px',
            border: 'none', background: 'transparent',
            color: t.onSurfaceVar, fontFamily: 'inherit',
            fontSize: 14, fontWeight: 700, cursor: 'pointer',
          }}>{tr(lang, 'iHaveAccount')}</button>
        )}
      </div>
    </div>
  );
}

function OnbProfiles({ lang, profiles, setProfiles, catName }) {
  const t = useTheme();
  const add = () => {
    if (profiles.length >= 8) return;
    setProfiles(ps => [...ps, {
      id: Date.now(), name: '',
      emoji: PALETTE_EMOJIS[ps.length % PALETTE_EMOJIS.length],
      color: PALETTE_COLORS[ps.length % PALETTE_COLORS.length],
    }]);
  };
  const upd = (id, key, value) => setProfiles(ps => ps.map(p => p.id === id ? { ...p, [key]: value } : p));
  const rem = (id) => setProfiles(ps => ps.filter(p => p.id !== id));
  return (
    <div style={{ flex: 1 }}>
      <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 0.6, color: t.a.p, textTransform: 'uppercase', marginTop: 8 }}>

              const idx = PALETTE_EMOJIS.indexOf(p.emoji);

const lsLoad = () => { try { const v = localStorage.getItem(LS_DATA); return v ? JSON.parse(v) : null; } catch { return null; } };

const getOrCreateDeviceId = () => {

};
const loadDeviceHomes = () => { try { return JSON.parse(localStorage.getItem(LS_HOMEMAP)||'{}'); } catch { return {}; } };
const getDeviceHome = (id) => loadDeviceHomes()[id] || null;
const setDeviceHome = (id, key) => { try { const m = loadDeviceHomes(); m[id]=key; localStorage.setItem(LS_HOMEMAP, JSON.stringify(m)); } catch {} };
const clearDeviceHome = (id) => { try { const m = loadDeviceHomes(); delete m[id]; localStorage.setItem(LS_HOMEMAP, JSON.stringify(m)); } catch {} };

const DEFAULT_INHALER = { dosage: '110mcg', lastCleaned: todayKey(), cleaningIntervalDays: 14 };
const DEFAULT_CAT_META = { breed: 'Cat', age: 4, weight: 4.5, sex: 'Female', birthday: 'May 12' };

// ─── Normalization (same shape as repo) ──────────────────────
const normProfiles = (profiles) => {
  if (!Array.isArray(profiles)) return null;
  return profiles.filter(Boolean).map((p, idx) => ({
    id: typeof p.id === 'string' && p.id ? p.id : mkId(),

};
const normMembers = (members) => {
  if (!Array.isArray(members)) return [];
  return [...new Set(members.map(m => typeof m === 'string' ? m : m?.uid).filter(uid => typeof uid === 'string' && uid.trim()))];
};
const normMemberKeys = (memberKeys, members = []) => {
  if (memberKeys && typeof memberKeys === 'object' && !Array.isArray(memberKeys)) {
    return Object.entries(memberKeys).reduce((acc,[uid,val])=>{ if (uid && val===true) acc[uid]=true; return acc; },{});
  }
  return members.reduce((acc,uid)=>{ acc[uid]=true; return acc; },{});
};
const mkCat = (idx, name, data = {}) => ({
  id: data.id || `c${idx+1}`,
  name: (name || data.name || `Cat ${idx+1}`).toString(),

});
const mkHousehold = (name, data = {}) => ({
  id: (data.id || mkHouseholdId()).toString(),
  name: (name || data.name || 'Home').toString(),
  inviteCode: (data.inviteCode || mkInviteCode()).toString().toUpperCase(),
  profiles: normProfiles(data.profiles),
  members: normMembers(data.members),
  memberKeys: normMemberKeys(data.memberKeys, normMembers(data.members)),
  cats: Array.isArray(data.cats) ? data.cats.map((c,idx)=>mkCat(idx,c?.name,c)) : [],
});
const normalizeData = (raw) => {
  const src = raw && typeof raw === 'object' ? raw : {};
  const homes = src.households && typeof src.households === 'object' ? src.households : {};
  return {
    households: Object.entries(homes).reduce((acc,[k,v])=>{ acc[k] = mkHousehold(v?.name||k, v||{}); return acc; },{}),
  };
};

// ─── Data bridges (repo ↔ redesign) ──────────────────────────
const dateToISO = (date) => {
  if (!date) return new Date().toISOString();
  if (date.length > 10) return date; // already an ISO timestamp
  return `${date}T12:00:00.000Z`;
};
const capitalize = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;

function repoToRedesignAttack(a, profilesByUid) {
  const who = a.addedBy && profilesByUid[a.addedBy] ? profilesByUid[a.addedBy].name : (a.who || '?');
  return {
    id: a.id != null ? `a${a.id}` : mkId(),
    _rawId: a.id,
    time: a.time || dateToISO(a.date),
    severity: a.severity || 'mild',
    duration: typeof a.duration === 'number' ? a.duration : Number(a.duration) || 0,
    usedInhaler: typeof a.usedInhaler === 'boolean' ? a.usedInhaler : false,

}
function redesignToRepoAttack(a, profilesByName, currentUid) {
  const time = a.time || new Date().toISOString();
  return {
    id: a._rawId || (typeof a.id === 'number' ? a.id : Date.now()),
    date: time.slice(0, 10),
    time,
    severity: a.severity,
    duration: a.duration,
    notes: a.note || '',
    usedInhaler: !!a.usedInhaler,
    addedBy: profilesByName[a.who]?.id || a._addedBy || currentUid,

}
function repoToRedesignInhaler(l, profilesByUid) {
  const who = l.addedBy && profilesByUid[l.addedBy] ? profilesByUid[l.addedBy].name : (l.who || '?');
  return {
    id: l.id != null ? `i${l.id}` : mkId(),
    _rawId: l.id,
    time: l.time || dateToISO(l.date),
    med: l.med || l.dosage || '',

    reason: l.reason || '',
    note: l.note || '',
    _addedBy: l.addedBy || null,

}
function redesignToRepoInhaler(l, profilesByName, currentUid) {
  const time = l.time || new Date().toISOString();

}

function buildWeeklyData(attacks, inhalers) {
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const rotated = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const out = rotated.map(d => ({ day: d, attacks: 0, inhalers: 0 }));
  const now = Date.now();
  const startOfWeek = (() => {
    const d = new Date();
    const dow = (d.getDay() + 6) % 7; // Mon=0..Sun=6
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() - dow);
    return d.getTime();
  })();
  attacks.forEach(a => {
    const t = new Date(a.time).getTime();
    if (t >= startOfWeek && t < startOfWeek + 7*86400000) {
      const dow = (new Date(t).getDay() + 6) % 7;
      out[dow].attacks++;
    }
  });
  inhalers.forEach(i => {
    if (i.skipped) return;
    const t = new Date(i.time).getTime();
    if (t >= startOfWeek && t < startOfWeek + 7*86400000) {
      const dow = (new Date(t).getDay() + 6) % 7;
      out[dow].inhalers++;
    }
  });
  return out;
}

// ─── Firebase bridge (waits for window.__pawFB) ──────────────
function useFirebase() {
  const [fb, setFb] = useState(window.__pawFB || null);
  useEffect(() => {
    if (window.__pawFB) { setFb(window.__pawFB); return; }
    const onReady = () => setFb(window.__pawFB || { enabled: false });
    window.addEventListener('paw-fb-ready', onReady);
    // Fallback: if module never resolves in 1.5s, fall back to demo mode
    const tid = setTimeout(() => setFb(window.__pawFB || { enabled: false }), 1500);
    return () => { window.removeEventListener('paw-fb-ready', onReady); clearTimeout(tid); };
  }, []);
  return fb;
}

          <IconButton name="close" tone="tonal" onClick={onClose} />
        </div>

        <div style={{ marginTop:18 }}>
          <div style={{ fontSize:12, fontWeight:800, color:t.onSurfaceVar, letterSpacing:0.3, textTransform:'uppercase', marginBottom:10 }}>
            {lang==='pt' ? 'Trocar gato' : 'Switch cat'}
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {cats.map(c => (
              <button key={c.id} onClick={() => { onSwitchCat(c.id); onClose(); }} style={{
                display:'flex', alignItems:'center', gap:12, padding:'12px 14px', borderRadius:14,
                border:`1.5px solid ${currentCat?.id===c.id ? t.a.p : t.outlineVar}`,
                background: currentCat?.id===c.id ? t.a.tint : t.surfaceContainer,
                color: t.onSurface, fontFamily:'inherit', cursor:'pointer', textAlign:'left',
              }}>
                <div style={{ fontSize:24 }}>🐱</div>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:15, fontWeight:700 }}>{c.name}</div>
                  <div style={{ fontSize:11, color:t.onSurfaceVar, fontWeight:500 }}>{(c.attacks||[]).length} {lang==='pt'?'crises':'attacks'}</div>
                </div>
                {currentCat?.id===c.id && <Icon name="check" />}
              </button>
            ))}
          </div>
        </div>

        <div style={{ marginTop:18 }}>
          <div style={{ fontSize:12, fontWeight:800, color:t.onSurfaceVar, letterSpacing:0.3, textTransform:'uppercase', marginBottom:10 }}>
            {lang==='pt' ? 'Adicionar gato' : 'Add cat'}
          </div>
          <div style={{ display:'flex', gap:8 }}>
            <div style={{ flex:1 }}>
              <TextField label={lang==='pt'?'Nome':'Name'} leadingIcon="pets" value={newCat} onChange={setNewCat} placeholder={lang==='pt'?'ex: Tigre':'e.g. Tigger'} />
            </div>
            <div style={{ alignSelf:'flex-end' }}>
              <Button onClick={() => { if (newCat.trim()) { onAddCat(newCat.trim()); setNewCat(''); } }} disabled={!newCat.trim()}>
                {lang==='pt'?'Adicionar':'Add'}
              </Button>
            </div>
          </div>
        </div>

        <div style={{ marginTop:24, display:'flex', flexDirection:'column', gap:10 }}>
          <Button full variant="outlined" leadingIcon="link" onClick={onCreateInvite}>
            {lang==='pt' ? 'Criar código de convite' : 'Create invite code'}
          </Button>
          <Button full variant="outlined" leadingIcon="swap_horiz" onClick={() => { onSwitchHome(); onClose(); }}>
            {lang==='pt' ? 'Trocar de casa' : 'Switch household'}
          </Button>
          <Button full variant="outlined" leadingIcon="logout" onClick={() => { onSignOut(); onClose(); }}>
            {lang==='pt' ? 'Terminar sessão' : 'Sign out'}
          </Button>
        </div>
      </div>
    </BottomSheet>
  );
}

// ─── Main App ────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "coral",
  "dark": false,
  "density": "cozy",
  "navStyle": "m3",
  "lang": "en"
}/*EDITMODE-END*/;

function App() {
  const fb = useFirebase();
  const fbReady = !!fb;
  const fbOn = !!(fb && fb.enabled);

  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const theme = useMemo(() => buildTheme({ accent: tw.accent, dark: tw.dark, density: tw.density }), [tw.accent, tw.dark, tw.density]);

  const [lang, setLang] = useState(tw.lang || 'en');
  useEffect(() => { setLang(tw.lang || 'en'); }, [tw.lang]);
  const setLangAll = (v) => { setLang(v); setTweak('lang', v); window.__lang = v; };

  // Auth + household state
  const [user, setUser] = useState(null);
  const [authReady, setAuthReady] = useState(!fbOn);
  const [data, setData] = useState(null);
  const [activeHome, setActiveHome] = useState(null);
  const [authed, setAuthed] = useState(false);
  const [userHomes, setUserHomes] = useState([]);
  const [homeNames, setHomeNames] = useState({});
  const [catId, setCatId] = useState(null);
  const [authError, setAuthError] = useState(null);
  const dataRef = useRef(null);
  const deviceId = useRef(getOrCreateDeviceId()).current;

  // UI state (redesign)
  const [tab, setTab] = useState('home');
  const [sheet, setSheet] = useState(null);
  const [detail, setDetail] = useState(null);
  const [snack, setSnack] = useState(null);
  const [showHHMenu, setShowHHMenu] = useState(false);

  // ─── Auth observer ─────────────────────────────────────────
  useEffect(() => {
    if (!fbReady) return;
    if (!fbOn) { setAuthReady(true); return; }
    const unsub = fb.fbAuthObserve(u => {
      setUser(u || null);
      setAuthReady(true);
      if (!u) { setAuthed(false); setCatId(null); setData(null); dataRef.current = null; }
    });
    return () => unsub && unsub();
  }, [fbReady]);

  // ─── Load user meta + active home selection ────────────────
  useEffect(() => {
    if (fbOn && !authReady) return;
    (async () => {
      if (fbOn && user) {
        try {
          const meta = await fb.fbLoadUserMeta(user.uid) || {};
          const linkedHomes = meta.households && typeof meta.households === 'object' ? Object.keys(meta.households) : [];
          setUserHomes(linkedHomes);
          if (linkedHomes.length) {
            Promise.all(linkedHomes.map(async (id) => {
              try { const h = await fb.fbLoad(id); return [id, (h?.name || id).toString()]; }
              catch { return [id, id]; }
            })).then(entries => setHomeNames(Object.fromEntries(entries)));
          } else { setHomeNames({}); }
          const remembered = getDeviceHome(deviceId);
          const initialHome = linkedHomes.includes(remembered) ? remembered : (linkedHomes[0] || null);
          setActiveHome(initialHome);
          setAuthed(!!initialHome);
          if (initialHome) setDeviceHome(deviceId, initialHome);
          if (!initialHome) {
            const empty = { households: {} };
            setData(empty); dataRef.current = empty;
          }
        } catch (e) { console.error(e); }
      } else if (!fbOn) {
        const saved = normalizeData(lsLoad() || { households: {} });
        setData(saved); dataRef.current = saved;
        // Auto-bootstrap a demo household if none exists
        const homes = Object.keys(saved.households || {});
        if (homes.length === 0) {
          const id = mkHouseholdId();
          const home = mkHousehold('Demo Home', { name: 'Demo Home' });
          const next = { households: { [id]: home } };
          setData(normalizeData(next)); dataRef.current = normalizeData(next);
          lsSave(dataRef.current);
          setActiveHome(id); setDeviceHome(deviceId, id); setAuthed(true);
          setUser({ uid: 'local-user', email: 'demo@local', displayName: 'Demo' });
        } else {
          const first = homes[0];
          setActiveHome(first); setAuthed(true);
          setUser({ uid: 'local-user', email: 'demo@local', displayName: 'Demo' });
        }
      }
    })();
  }, [user, authReady, fbOn]);

  // ─── Subscribe to active household ─────────────────────────
  useEffect(() => {
    if (!fbOn || !activeHome) return;
    let unsub = null;
    (async () => {
      try {
        let remoteHome = await fb.fbLoad(activeHome);
        if (!remoteHome) {
          const selfProfile = { id: user?.uid || mkId(), name: (user?.displayName || user?.email?.split('@')[0] || 'User'), emoji: EMOJIS[0], color: PCOLS[0] };
          remoteHome = { ...mkHousehold(activeHome, { name: activeHome, cats: [], profiles: null }), profiles: [selfProfile], memberKeys: { ...(user?.uid ? { [user.uid]: true } : {}) } };
          await fb.fbSave(activeHome, remoteHome);
        }
        const normalized = normalizeData({ households: { [activeHome]: remoteHome } });
        setData(normalized); dataRef.current = normalized;
        unsub = fb.fbSubscribe(activeHome, inc => {
          const n = normalizeData({ households: { [activeHome]: inc } });
          setData(n); dataRef.current = n;
        });
      } catch (e) { console.error(e); }
    })();
    return () => { if (unsub) unsub(); };
  }, [activeHome, fbOn]);

  // ─── Persist updates ───────────────────────────────────────
  const homes = data?.households || {};
  const homeKeys = Object.keys(homes);
  const homeKey = activeHome && homes[activeHome] ? activeHome : (homeKeys[0] || null);
  const currentHome = homeKey ? homes[homeKey] : null;

  const doSave = async (updater) => {
    const next = updater(dataRef.current || { households: {} });
    setData(next); dataRef.current = next;
    if (fbOn && user && homeKey) {
      const ok = await fb.fbSave(homeKey, next?.households?.[homeKey] || null).catch(() => false);
      if (!ok) console.warn('save failed');
    } else { lsSave(next); }
  };

  // ─── Auth actions ──────────────────────────────────────────
  const handleAuth = async (email, password, signup) => {
    if (!fbOn) return null;
    try {
      if (signup) await fb.fbSignUp(email, password);
      else await fb.fbSignIn(email, password);
      return null;
    } catch (err) {
      const msg = `${err?.code||''} ${err?.message||''}`;
      if (/CONFIGURATION_NOT_FOUND/i.test(msg)) return lang==='pt'?'Configuração em falta':'Auth not configured';
      if (/auth\/(invalid-credential|wrong-password|user-not-found)/i.test(msg)) return lang==='pt'?'Email ou password inválidos':'Invalid email or password';
      if (/auth\/email-already-in-use/i.test(msg)) return lang==='pt'?'Email já registado':'Email already in use';
      if (/auth\/weak-password/i.test(msg)) return lang==='pt'?'Password fraca (mín. 6 chars)':'Weak password (min 6 chars)';
      return lang==='pt'?'Erro de autenticação':'Authentication error';
    }
  };
  const signOut = async () => {
    if (fbOn && fb.fbSignOut) await fb.fbSignOut().catch(()=>null);
    clearDeviceHome(deviceId);
    setAuthed(false); setActiveHome(null); setCatId(null);
    setData(null); dataRef.current = null;
    if (!fbOn) setUser(null);
  };

  // ─── Household actions ─────────────────────────────────────
  const submitHousehold = async (payload) => {
    const profile = { id: user?.uid || mkId(), name: (user?.displayName || user?.email?.split('@')[0] || 'User'), emoji: EMOJIS[0], color: PCOLS[0] };
    const memberUid = user?.uid || profile.id;
    const linkUserHome = async (id) => {
      if (fbOn && fb.fbSaveUserMeta && user?.uid) {
        const next = Array.from(new Set([...(userHomes||[]), id]));
        const map = next.reduce((acc,h)=>{ acc[h]=true; return acc; },{});
        await fb.fbSaveUserMeta(user.uid, { households: map });
        setUserHomes(next);
        setHomeNames(prev => ({ ...prev, [id]: prev[id] || id }));
      } else {
        setUserHomes(Array.from(new Set([...(userHomes||[]), id])));
      }
    };
    const attachMember = (home) => {
      const profiles = Array.isArray(home.profiles) ? home.profiles : [];
      const members = Array.isArray(home.members) ? home.members : [];
      const memberKeys = home.memberKeys || {};
      return {
        ...home,
        profiles: profiles.some(p=>p.id===profile.id) ? profiles : [...profiles, profile],
        members: members.includes(memberUid) ? members : [...members, memberUid],
        memberKeys: { ...memberKeys, [memberUid]: true },
      };
    };

    try {
      if (payload.action === 'open') {
        const key = payload.householdId;
        if (fbOn) {
          const probe = await fb.fbLoad(key);
          if (!probe) return { ok:false, reason:'not-found' };
          setData(normalizeData({ households:{ [key]: probe } }));
          dataRef.current = normalizeData({ households:{ [key]: probe } });
        }
        setActiveHome(key); setDeviceHome(deviceId, key); setAuthed(true); setCatId(null);
        return { ok:true };
      }

      if (payload.action === 'create') {
        const id = mkHouseholdId();
        const base = attachMember(mkHousehold(payload.householdName, { name: payload.householdName, profiles: null, members: [memberUid] }));
        if (fbOn) {
          await linkUserHome(id);
          await fb.fbSave(id, base);
        } else {
          await doSave(d => ({ ...d, households: { ...(d?.households||{}), [id]: base } }));
          await linkUserHome(id);
        }
        setData(normalizeData({ households: { [id]: base } }));
        dataRef.current = normalizeData({ households: { [id]: base } });
        setActiveHome(id); setDeviceHome(deviceId, id); setAuthed(true); setCatId(null);
        return { ok:true };
      }

      if (payload.action === 'join') {
        const code = (payload.inviteCode||'').toUpperCase();
        if (!code) return { ok:false, reason:'invalid-invite' };
        let targetId = null;
        if (fbOn && user?.uid) {
          const red = await fb.fbRedeemInvite({ code, uid: user.uid });
          if (!red.ok) return red;
          targetId = red.householdId;
        } else {
          const homesLocal = dataRef.current?.households || {};
          targetId = Object.keys(homesLocal).find(h => homesLocal[h]?.inviteCode === code) || null;
          if (!targetId) return { ok:false, reason:'not-found' };
        }
        if (fbOn) await linkUserHome(targetId);
        let remoteHome = fbOn ? await fb.fbLoad(targetId) : (dataRef.current?.households?.[targetId] || null);
        if (!remoteHome) return { ok:false, reason:'not-found' };
        const home = normalizeData({ households:{ [targetId]: remoteHome } }).households[targetId];
        const updated = attachMember(home);
        if (fbOn) await fb.fbSave(targetId, updated);
        else { await doSave(d => ({ ...d, households: { ...d.households, [targetId]: updated } })); await linkUserHome(targetId); }
        setData(normalizeData({ households: { [targetId]: updated } }));
        dataRef.current = normalizeData({ households: { [targetId]: updated } });
        setActiveHome(targetId); setDeviceHome(deviceId, targetId); setAuthed(true); setCatId(null);
        return { ok:true };
      }

      return { ok:false, reason:'unknown' };
    } catch (e) {
      console.error(e);
      return { ok:false, reason: isPermissionErr(e) ? 'permission' : 'unknown' };
    }
  };

  const createInvite = async () => {
    if (!homeKey) return;
    const code = mkInviteCode();
    const expiresAt = Date.now() + 7*24*60*60*1000;
    if (fbOn && user?.uid) {
      try { await fb.fbCreateInvite({ code, householdId: homeKey, createdBy: user.uid, createdAt: Date.now(), expiresAt }); }
      catch (e) { console.error(e); setSnack(lang==='pt'?'Falha ao criar convite':'Could not create invite'); return; }
    } else {
      await doSave(d => ({ ...d, households: { ...d.households, [homeKey]: { ...d.households[homeKey], inviteCode: code } } }));
    }
    try { await navigator.clipboard.writeText(code); } catch {}
    setSnack(`${lang==='pt'?'Convite copiado':'Invite copied'}: ${code}`);
  };

  // ─── Auto-link the signed-in user to the household profiles ─
  useEffect(() => {
    if (!homeKey || !user?.uid || !currentHome) return;
    const existing = Array.isArray(currentHome.profiles) ? currentHome.profiles : [];
    const existingMembers = Array.isArray(currentHome.members) ? currentHome.members : [];
    const existingMemberKeys = currentHome.memberKeys || {};
    if (existing.some(p=>p.id===user.uid) && existingMembers.includes(user.uid) && existingMemberKeys[user.uid]===true) return;
    doSave(d => {
      const home = d.households?.[homeKey]; if (!home) return d;
      const latest = Array.isArray(home.profiles) ? home.profiles : [];
      const lm = Array.isArray(home.members) ? home.members : [];
      const lk = home.memberKeys || {};
      if (latest.some(p=>p.id===user.uid) && lm.includes(user.uid) && lk[user.uid]===true) return d;
      const nextProfile = { id: user.uid, name: (user.displayName || user.email?.split('@')[0] || 'User'), emoji: EMOJIS[0], color: PCOLS[latest.length % PCOLS.length] };
      return { ...d, households: { ...d.households, [homeKey]: {
        ...home,
        profiles: latest.some(p=>p.id===user.uid) ? latest : [...latest, nextProfile],
        members: lm.includes(user.uid) ? lm : [...lm, user.uid],
        memberKeys: { ...lk, [user.uid]: true },
      } } };
    });
  }, [homeKey, user?.uid, currentHome]);

  // ─── Pick active cat ───────────────────────────────────────
  const cats = currentHome?.cats || [];
  useEffect(() => {
    if (!currentHome) return;
    if (!catId || !cats.some(c => c.id === catId)) {
      const first = cats[0]?.id || null;
      if (first !== catId) setCatId(first);
    }
  }, [currentHome, catId]);
  const currentCat = cats.find(c => c.id === catId) || null;

  // ─── Mutations on the current cat ──────────────────────────
  const updateCat = (mut) => doSave(d => ({ ...d, households: { ...d.households, [homeKey]: { ...d.households[homeKey], cats: d.households[homeKey].cats.map(c => c.id === catId ? mut(c) : c) } } }));
  const profilesArr = currentHome?.profiles || [];
  const profilesByUid = useMemo(() => Object.fromEntries(profilesArr.map(p => [p.id, p])), [profilesArr]);
  const profilesByName = useMemo(() => Object.fromEntries(profilesArr.map(p => [p.name, p])), [profilesArr]);
  const currentUid = user?.uid || 'local-user';

  const saveAttack = (data) => {
    if (!currentCat) return;
    const repoEntry = redesignToRepoAttack({ ...data, time: new Date().toISOString(), id: Date.now() }, profilesByName, currentUid);
    updateCat(c => ({ ...c, attacks: [...(c.attacks||[]), repoEntry] }));
    setSheet(null);
    setSnack(lang==='pt'?'Crise registada':'Attack logged');
  };
  const saveInhaler = (data) => {
    if (!currentCat) return;
    const repoEntry = redesignToRepoInhaler({ ...data, time: new Date().toISOString(), id: Date.now() }, profilesByName, currentUid);
    updateCat(c => ({ ...c, inhalerLogs: [...(c.inhalerLogs||[]), repoEntry] }));
    setSheet(null);
    setSnack(lang==='pt'?'Dose registada':'Dose logged');
  };
  const updateAttack = (data) => {
    if (!currentCat) return;
    const rid = data._rawId;
    const updated = redesignToRepoAttack(data, profilesByName, currentUid);
    updateCat(c => ({ ...c, attacks: (c.attacks||[]).map(a => a.id === rid ? { ...a, ...updated } : a) }));
    setDetail(null);
    setSnack(lang==='pt'?'Crise atualizada':'Attack updated');
  };
  const deleteAttack = (id) => {
    if (!currentCat) return;
    const ridMatch = (a) => `a${a.id}` === id;
    updateCat(c => ({ ...c, attacks: (c.attacks||[]).filter(a => !ridMatch(a)) }));
    setDetail(null);
    setSnack(lang==='pt'?'Crise apagada':'Attack deleted');
  };
  const updateInhaler = (data) => {
    if (!currentCat) return;
    const rid = data._rawId;
    const updated = redesignToRepoInhaler(data, profilesByName, currentUid);
    updateCat(c => ({ ...c, inhalerLogs: (c.inhalerLogs||[]).map(l => l.id === rid ? { ...l, ...updated } : l) }));
    setDetail(null);
    setSnack(lang==='pt'?'Dose atualizada':'Dose updated');
  };
  const deleteInhaler = (id) => {
    if (!currentCat) return;
    const ridMatch = (l) => `i${l.id}` === id;
    updateCat(c => ({ ...c, inhalerLogs: (c.inhalerLogs||[]).filter(l => !ridMatch(l)) }));
    setDetail(null);
    setSnack(lang==='pt'?'Dose apagada':'Dose deleted');
  };

  // ─── Add cat ───────────────────────────────────────────────
  const addCat = async (info) => {
    const id = `c${Date.now().toString(36).slice(-5)}`;
    const newCat = mkCat(cats.length, info.name, { id, name: info.name, breed: info.breed });
    await doSave(d => ({ ...d, households: { ...d.households, [homeKey]: { ...d.households[homeKey], cats: [...(d.households[homeKey].cats||[]), newCat] } } }));
    setCatId(id);
  };

  // ─── Render gates ──────────────────────────────────────────
  const themedShell = (inner) => (
    <ThemeCtx.Provider value={theme}>
      <LangCtx.Provider value={{ lang, t: (k, v) => tr(lang, k, v), setLang: setLangAll }}>
        <div className="pw-app" style={{ background: theme.bg }}>
          {inner}
          <Snackbar message={snack} onClose={() => setSnack(null)} />
        </div>
      </LangCtx.Provider>
    </ThemeCtx.Provider>
  );

  if (fbOn && !authReady) return themedShell(<LoadingGate message={lang==='pt'?'A carregar conta…':'Loading account…'} />);
  if (fbOn && authReady && !user) return themedShell(<AuthGate onAuth={handleAuth} error={authError} />);
  if (!data) return themedShell(<LoadingGate />);
  if (!authed || !currentHome) {
    return themedShell(
      <HouseholdGate
        user={user}
        householdOptions={userHomes.map(id => ({ id, label: homeNames[id] || id }))}
        onSubmit={submitHousehold}
        onSignOut={signOut}
      />
    );
  }
  if (cats.length === 0) {
    return themedShell(
      <FirstCatGate
        onSave={async ({ name, breed }) => {
          const id = `c${Date.now().toString(36).slice(-5)}`;
          await doSave(d => ({ ...d, households: { ...d.households, [homeKey]: { ...d.households[homeKey], cats: [mkCat(0, name, { id, name, breed })] } } }));
          setCatId(id);
        }}
        onSignOut={signOut}
      />
    );
  }
  if (!currentCat) return themedShell(<LoadingGate />);

  // ─── Build redesign-shaped state ───────────────────────────
  const attacksRedesign = (currentCat.attacks || [])
    .map(a => repoToRedesignAttack(a, profilesByUid))
    .sort((x, y) => new Date(y.time) - new Date(x.time));
  const inhalersRedesign = (currentCat.inhalerLogs || [])
    .map(l => repoToRedesignInhaler(l, profilesByUid))
    .sort((x, y) => new Date(y.time) - new Date(x.time));
  const caregivers = profilesArr.length
    ? profilesArr.map(p => ({ name: p.name, color: p.color || PCOLS[0] }))
    : [{ name: user?.displayName || 'You', color: PCOLS[0] }];
  const catObj = {
    name: currentCat.name,
    breed: currentCat.breed || 'Cat',
    age: currentCat.age || 4,
    weight: currentCat.weight || 4.5,
    sex: currentCat.sex || '—',
    birthday: currentCat.birthday || '—',
  };
  const weeklyData = buildWeeklyData(attacksRedesign, inhalersRedesign);
  // Inhaler cleaning countdown
  const ii = currentCat.inhalerInfo || DEFAULT_INHALER;
  const lastCleaned = new Date(ii.lastCleaned || todayKey());
  const daysSinceClean = Math.floor((Date.now() - lastCleaned.getTime()) / 86400000);
  const interval = ii.cleaningIntervalDays || 14;
  const nextCleanDays = Math.max(0, interval - daysSinceClean);
  const nextCleanPct = Math.min(100, Math.max(0, (daysSinceClean / interval) * 100));
  const medications = [
    { name: `Inhaler · ${ii.dosage || '110mcg'}`, dose: '1 puff · twice daily', kind: 'Maintenance', color: '#1E9E94' },
    { name: 'Ventolin', dose: '1 puff · as needed', kind: 'rescue', color: '#FF7E67' },
  ];
  const triggers = [
    { name: 'Dust', icon: 'air', bg: 'rgba(63,111,191,0.12)', fg: '#3F6FBF', pct: 78, level: 'High' },
    { name: 'Pollen', icon: 'grass', bg: 'rgba(52,170,72,0.12)', fg: '#34AA48', pct: 52, level: 'Med' },
    { name: 'Smoke', icon: 'mode_heat', bg: 'rgba(212,142,26,0.12)', fg: '#D48E1A', pct: 30, level: 'Low' },
  ];
  const state = {
    cat: catObj,
    caregivers,
    attacks: attacksRedesign,
    inhalers: inhalersRedesign,
    weeklyData,
    triggers,
    medications,
    nextCleanDays,
    nextCleanPct,
  };

  const openDetail = (kind, item) => setDetail({ kind, item });
  const screen = (
    tab === 'home' ? <HomeScreen state={state} openSheet={setSheet} navigate={setTab} openDetail={openDetail} /> :
    tab === 'history' ? <HistoryScreen state={state} openSheet={setSheet} openDetail={openDetail} /> :
    tab === 'insights' ? <InsightsScreen state={state} /> :
    tab === 'inhaler' ? <InhalerScreen state={state} openSheet={setSheet} openDetail={openDetail} /> :
    tab === 'profile' ? <ProfileScreen state={state} /> :
    null
  );

  return themedShell(
    <Fragment>
      <div style={{ flex:1, overflow:'hidden', display:'flex', flexDirection:'column', position:'relative' }}>
        {/* Header bar with household / cat / menu */}
        <div style={{ position:'absolute', top:8, right:12, zIndex:30, display:'flex', gap:6 }}>
          <button onClick={() => setShowHHMenu(true)} title={lang==='pt'?'Casa & gatos':'Household & cats'} style={{
            display:'flex', alignItems:'center', gap:6, padding:'6px 10px', borderRadius:20,
            background: theme.surfaceContainer, border:`1px solid ${theme.outlineVar}`, color: theme.onSurface,
            fontSize:12, fontWeight:700, cursor:'pointer', fontFamily:'inherit',
          }}>
            <span>🐱</span><span>{currentCat.name}</span>
            <Icon name="expand_more" size={16} />
          </button>
        </div>
        {screen}
      </div>
      <BottomNav active={tab} onChange={setTab} navStyle={tw.navStyle} onFab={() => setSheet('chooser')} />

      {/* Sheets */}
      <AttackSheet open={sheet === 'attack'} onClose={() => setSheet(null)} onSave={saveAttack} cat={catObj} caregivers={caregivers} />
      <InhalerSheet open={sheet === 'inhaler'} onClose={() => setSheet(null)} onSave={saveInhaler} cat={catObj} caregivers={caregivers} medications={medications} />
      <ActionChooser open={sheet === 'chooser'} onClose={() => setSheet(null)} onPick={(k) => setSheet(k)} />

      <AttackDetailSheet open={detail && detail.kind === 'attack'}
        attack={detail && detail.kind === 'attack' ? detail.item : null}
        caregivers={caregivers}
        onClose={() => setDetail(null)}
        onSave={updateAttack} onDelete={deleteAttack} />
      <InhalerDetailSheet open={detail && detail.kind === 'inhaler'}
        dose={detail && detail.kind === 'inhaler' ? detail.item : null}
        caregivers={caregivers} medications={medications}
        onClose={() => setDetail(null)}
        onSave={updateInhaler} onDelete={deleteInhaler} />

      <HouseholdMenu open={showHHMenu} onClose={() => setShowHHMenu(false)}
        currentHome={currentHome} currentCat={currentCat} cats={cats}
        onSwitchCat={setCatId} onAddCat={(name) => addCat({ name, breed: 'Cat' })}
        onCreateInvite={createInvite}
        onSwitchHome={() => { clearDeviceHome(deviceId); setActiveHome(null); setAuthed(false); setCatId(null); }}
        onSignOut={signOut} />
    </Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>

</body>
</html>
