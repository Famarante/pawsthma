<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="theme-color" content="#F7F3EC" media="(prefers-color-scheme: light)"/>
  <meta name="theme-color" content="#141310" media="(prefers-color-scheme: dark)"/>
  <title>Pawsthma — Asthma &amp; Health Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet"/>
  <style>
/* ══════════════════════════════════════════════════════════════════
   PAWSTHMA DESIGN SYSTEM
   A warm, calm, paper-like health journal. Light-first, dark-aware.
   ══════════════════════════════════════════════════════════════════ */

/* ---------- 1. Tokens ---------- */
:root{
  color-scheme: light;

  /* Ground */
  --bg:#F7F3EC;
  --bg-2:#F1EBE1;
  --surface:#FFFFFF;
  --surface-2:#FBF8F3;
  --surface-3:#F2ECE3;
  --veil:rgba(34,26,16,.42);

  /* Ink */
  --ink:#221E1A;
  --ink-2:#5D554B;
  --ink-3:#8C8377;
  --ink-4:#A9A094;

  /* Lines */
  --line:#EAE2D6;
  --line-2:#DCD2C2;

  /* Brand — evergreen */
  --brand:#2F6152;
  --brand-2:#3B7563;
  --brand-ink:#FFFFFF;
  --brand-soft:#E3EDE8;
  --brand-soft-2:#CFE0D8;

  /* Accent — honey */
  --accent:#B9782B;
  --accent-soft:#F9EEDB;

  /* Severity */
  --sev-mild:#4E8C79;      --sev-mild-soft:#E1EFE9;      --sev-mild-ink:#2C594A;
  --sev-moderate:#B9822A;  --sev-moderate-soft:#F9EEDA;  --sev-moderate-ink:#7E571A;
  --sev-severe:#BC5340;    --sev-severe-soft:#F9E4DF;    --sev-severe-ink:#8A3626;

  /* Semantic */
  --ok:#4E8C79;   --ok-soft:#E1EFE9;
  --warn:#B9822A; --warn-soft:#F9EEDA;
  --danger:#BC5340; --danger-soft:#F9E4DF;

  /* Dose / inhaler identity */
  --dose:#3D7EA6; --dose-soft:#E2EDF4; --dose-ink:#255A78;

  /* Radii */
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:30px; --r-pill:999px;

  /* Elevation */
  --sh-1:0 1px 2px rgba(46,36,24,.05);
  --sh-2:0 1px 2px rgba(46,36,24,.04), 0 10px 24px -14px rgba(46,36,24,.22);
  --sh-3:0 2px 6px rgba(46,36,24,.06), 0 28px 60px -24px rgba(46,36,24,.34);
  --sh-pop:0 30px 70px -28px rgba(46,36,24,.42), 0 4px 12px rgba(46,36,24,.08);

  /* Type */
  --font-display:'Fraunces', ui-serif, Georgia, serif;
  --font-ui:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;

  /* Metrics */
  --rail-w:264px;
  --nav-h:calc(60px + env(safe-area-inset-bottom));
  --ease:cubic-bezier(.22,1,.36,1);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#141310;
    --bg-2:#1A1714;
    --surface:#1E1B17;
    --surface-2:#232019;
    --surface-3:#2B261F;
    --veil:rgba(0,0,0,.62);
    --ink:#F3EEE5;
    --ink-2:#B6AEA2;
    --ink-3:#8B8276;
    --ink-4:#736B60;
    --line:#302B23;
    --line-2:#3E372E;
    --brand:#6FBFA3;
    --brand-2:#84CCB2;
    --brand-ink:#0D1714;
    --brand-soft:#1C2A26;
    --brand-soft-2:#26372F;
    --accent:#E0A445;
    --accent-soft:#2C2417;
    --sev-mild:#6FBFA3;     --sev-mild-soft:#1C2A26;     --sev-mild-ink:#9CD8C2;
    --sev-moderate:#E0A445; --sev-moderate-soft:#2C2417; --sev-moderate-ink:#EFC57E;
    --sev-severe:#DE7358;   --sev-severe-soft:#321E19;   --sev-severe-ink:#EFA18B;
    --ok:#6FBFA3;   --ok-soft:#1C2A26;
    --warn:#E0A445; --warn-soft:#2C2417;
    --danger:#DE7358; --danger-soft:#321E19;
    --dose:#69AED6; --dose-soft:#182833; --dose-ink:#9BCDE8;
    --sh-1:0 1px 2px rgba(0,0,0,.4);
    --sh-2:0 1px 2px rgba(0,0,0,.35), 0 10px 24px -14px rgba(0,0,0,.8);
    --sh-3:0 2px 6px rgba(0,0,0,.4), 0 28px 60px -24px rgba(0,0,0,.85);
    --sh-pop:0 30px 70px -28px rgba(0,0,0,.9), 0 4px 12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#141310;
  --bg-2:#1A1714;
  --surface:#1E1B17;
  --surface-2:#232019;
  --surface-3:#2B261F;
  --veil:rgba(0,0,0,.62);
  --ink:#F3EEE5;
  --ink-2:#B6AEA2;
  --ink-3:#8B8276;
  --ink-4:#736B60;
  --line:#302B23;
  --line-2:#3E372E;
  --brand:#6FBFA3;
  --brand-2:#84CCB2;
  --brand-ink:#0D1714;
  --brand-soft:#1C2A26;
  --brand-soft-2:#26372F;
  --accent:#E0A445;
  --accent-soft:#2C2417;
  --sev-mild:#6FBFA3;     --sev-mild-soft:#1C2A26;     --sev-mild-ink:#9CD8C2;
  --sev-moderate:#E0A445; --sev-moderate-soft:#2C2417; --sev-moderate-ink:#EFC57E;
  --sev-severe:#DE7358;   --sev-severe-soft:#321E19;   --sev-severe-ink:#EFA18B;
  --ok:#6FBFA3;   --ok-soft:#1C2A26;
  --warn:#E0A445; --warn-soft:#2C2417;
  --danger:#DE7358; --danger-soft:#321E19;
  --dose:#69AED6; --dose-soft:#182833; --dose-ink:#9BCDE8;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 1px 2px rgba(0,0,0,.35), 0 10px 24px -14px rgba(0,0,0,.8);
  --sh-3:0 2px 6px rgba(0,0,0,.4), 0 28px 60px -24px rgba(0,0,0,.85);
  --sh-pop:0 30px 70px -28px rgba(0,0,0,.9), 0 4px 12px rgba(0,0,0,.5);
}

/* ---------- 2. Base ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
#root{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
::selection{background:var(--brand-soft-2);color:var(--ink)}

/* Scrollbars — thin, unobtrusive */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--ink-4);background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ---------- 3. Typography ---------- */
.display{font-family:var(--font-display);font-weight:600;letter-spacing:-.015em;line-height:1.12;font-variation-settings:"SOFT" 30,"opsz" 60}
.d-xl{font-size:clamp(30px,5vw,42px)}
.d-lg{font-size:clamp(24px,3.6vw,30px)}
.d-md{font-size:clamp(19px,2.4vw,23px)}
.d-sm{font-size:17px}
.num{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- 4. App shell ---------- */
.shell{display:flex;min-height:100vh;position:relative}
.shell::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 480px at 8% -8%, color-mix(in oklab, var(--brand) 12%, transparent), transparent 62%),
    radial-gradient(760px 420px at 102% 6%, color-mix(in oklab, var(--accent) 12%, transparent), transparent 60%);
  opacity:.5;
}

/* Sidebar rail (desktop) */
.rail{
  display:none;width:var(--rail-w);flex:0 0 var(--rail-w);
  position:sticky;top:0;height:100vh;z-index:20;
  padding:22px 16px 18px;
  border-right:1px solid var(--line);
  background:color-mix(in oklab, var(--bg) 82%, var(--surface));
  backdrop-filter:blur(12px);
  flex-direction:column;gap:18px;
}
.rail-brand{display:flex;align-items:center;gap:10px;padding:0 8px 2px}
.mark{
  width:34px;height:34px;flex:0 0 34px;border-radius:11px;
  background:linear-gradient(150deg,var(--brand-2),var(--brand));
  color:var(--brand-ink);display:grid;place-items:center;
  box-shadow:0 6px 16px -6px color-mix(in oklab, var(--brand) 70%, transparent);
}
.wordmark{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:-.01em}

.rail-nav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:9px 11px;border-radius:12px;
  color:var(--ink-2);font-size:14px;font-weight:500;
  transition:background .16s var(--ease), color .16s var(--ease);
  text-align:left;position:relative;
}
.nav-item:hover{background:var(--surface-3);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-item[aria-current="page"]::before{
  content:"";position:absolute;left:-16px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--brand);
}
.nav-item .ni-badge{margin-left:auto;font-size:11px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* Cat identity card in rail */
.cat-card{
  width:100%;text-align:left;display:flex;align-items:center;gap:11px;
  padding:11px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface);
  box-shadow:var(--sh-1);transition:box-shadow .18s var(--ease), border-color .18s var(--ease), transform .18s var(--ease);
}
.cat-card:hover{box-shadow:var(--sh-2);border-color:var(--line-2)}
.cat-card:active{transform:scale(.99)}
.cat-av{
  width:40px;height:40px;flex:0 0 40px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--accent-soft),var(--brand-soft));
  color:var(--brand);font-size:20px;border:1px solid var(--line);
}
.cat-av.lg{width:56px;height:56px;flex-basis:56px;border-radius:18px;font-size:27px}
.cat-name{font-family:var(--font-display);font-weight:600;font-size:15.5px;line-height:1.2;letter-spacing:-.01em}
.cat-sub{font-size:11px;color:var(--ink-3);letter-spacing:.02em}

.rail-foot{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}

/* Main column */
.main{flex:1;min-width:0;position:relative;z-index:1;display:flex;flex-direction:column}

/* Top bar */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;min-height:60px;
  background:color-mix(in oklab, var(--bg) 84%, transparent);
  backdrop-filter:saturate(1.4) blur(16px);
  border-bottom:1px solid transparent;
  transition:border-color .2s var(--ease), background .2s var(--ease);
  padding-top:max(10px, env(safe-area-inset-top));
}
.topbar.scrolled{border-bottom-color:var(--line);background:color-mix(in oklab, var(--bg) 94%, transparent)}
.topbar-title{font-family:var(--font-display);font-weight:600;font-size:19px;letter-spacing:-.01em}
.topbar-spacer{flex:0}
@media (min-width:1024px){ .topbar-spacer{flex:1} }

.page{
  flex:1;width:100%;max-width:1160px;margin:0 auto;
  padding:20px 16px calc(var(--nav-h) + 28px);
}

/* Bottom nav (mobile / tablet) */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  height:var(--nav-h);padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in oklab, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.5) blur(18px);
  border-top:1px solid var(--line);
}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:60px;color:var(--ink-3);font-size:10.5px;font-weight:500;letter-spacing:.01em;
  transition:color .16s var(--ease);position:relative;
}
.tab[aria-current="page"]{color:var(--brand);font-weight:600}
.tab .tab-ico{
  display:grid;place-items:center;width:38px;height:26px;border-radius:var(--r-pill);
  transition:background .18s var(--ease);
}
.tab[aria-current="page"] .tab-ico{background:var(--brand-soft)}
/* The centre slot must be a full-height containing block — if it collapses to
   0px the absolutely-positioned FAB resolves its static position at the bar's
   bottom edge and hangs off the screen. */
.tab-slot{position:relative;height:60px}

/* FAB — anchored from the bottom so it always sits above the safe-area inset.
   Transform is reserved for the X centring, so hover/active can't cancel it. */
.fab{
  position:absolute;left:50%;bottom:22px;
  transform:translateX(-50%);
  width:56px;height:56px;border-radius:20px;
  background:linear-gradient(150deg,var(--brand-2),var(--brand));
  color:var(--brand-ink);display:grid;place-items:center;
  box-shadow:0 12px 28px -10px color-mix(in oklab, var(--brand) 80%, transparent), 0 2px 6px rgba(0,0,0,.14);
  transition:transform .2s var(--ease), box-shadow .2s var(--ease);
}
.fab:hover{transform:translateX(-50%) translateY(-3px);box-shadow:0 16px 32px -10px color-mix(in oklab, var(--brand) 85%, transparent), 0 2px 6px rgba(0,0,0,.16)}
.fab:active{transform:translateX(-50%) scale(.95)}
.fab svg{transition:transform .28s var(--ease)}
.fab.open svg{transform:rotate(45deg)}

.quickmenu{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav-h) + 22px);z-index:45;
  width:min(340px, calc(100vw - 32px));
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-pop);padding:8px;
  display:flex;flex-direction:column;gap:2px;
  animation:popc .26s var(--ease) both;
}
@keyframes popc{
  from{opacity:0;transform:translateX(-50%) translateY(8px) scale(.97)}
  to{opacity:1;transform:translateX(-50%)}
}
.quickmenu-item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:12px;border-radius:var(--r-sm);transition:background .15s var(--ease);
}
.quickmenu-item:hover{background:var(--surface-3)}
.qm-ico{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center}
.qm-t{font-weight:600;font-size:14.5px;line-height:1.25}
.qm-s{font-size:12px;color:var(--ink-3);line-height:1.3}

/* ---------- 5. Cards & surfaces ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--sh-1);
  padding:18px;position:relative;
}
.card.pad-lg{padding:22px}
.card.pad-sm{padding:14px}
.card.flush{padding:0;overflow:hidden}
.card-hover{transition:box-shadow .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease)}
.card-hover:hover{box-shadow:var(--sh-2);border-color:var(--line-2)}

.card-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.card-head .ch-text{min-width:0;flex:1}
.card-title{font-family:var(--font-display);font-weight:600;font-size:16.5px;letter-spacing:-.01em;line-height:1.25}
.card-sub{font-size:12.5px;color:var(--ink-3);margin-top:2px;line-height:1.45}

.grid{display:grid;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}

/* ---------- 6. Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:0 15px;height:40px;border-radius:var(--r-sm);
  font-size:14px;font-weight:600;letter-spacing:-.005em;
  border:1px solid transparent;white-space:nowrap;
  transition:background .16s var(--ease), border-color .16s var(--ease), color .16s var(--ease), transform .12s var(--ease), box-shadow .16s var(--ease);
}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-primary{background:var(--brand);color:var(--brand-ink);box-shadow:0 6px 16px -10px color-mix(in oklab, var(--brand) 90%, transparent)}
.btn-primary:hover{background:var(--brand-2);box-shadow:0 10px 22px -12px color-mix(in oklab, var(--brand) 90%, transparent)}
.btn-soft{background:var(--surface-3);color:var(--ink);border-color:var(--line)}
.btn-soft:hover{background:var(--line);border-color:var(--line-2)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn-outline{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn-outline:hover{background:var(--surface-2);border-color:var(--ink-4)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(1.06)}
.btn-danger-soft{background:var(--danger-soft);color:var(--danger);border-color:color-mix(in oklab, var(--danger) 30%, transparent)}
.btn-danger-soft:hover{background:color-mix(in oklab, var(--danger) 18%, var(--danger-soft))}
.btn-lg{height:48px;padding:0 20px;font-size:15px;border-radius:var(--r-md)}
.btn-sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:10px;gap:6px}
.btn-block{width:100%}
.btn-icon{width:38px;height:38px;padding:0;border-radius:12px}
.btn-icon.sm{width:32px;height:32px;border-radius:10px}

/* Icon button in top bar */
.icon-btn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  color:var(--ink-2);border:1px solid transparent;
  transition:background .16s var(--ease), color .16s var(--ease), border-color .16s var(--ease);
}
.icon-btn:hover{background:var(--surface-3);color:var(--ink);border-color:var(--line)}

/* ---------- 7. Chips / badges / pills ---------- */
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:var(--r-pill);
  font-size:12.5px;font-weight:500;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  transition:all .15s var(--ease);white-space:nowrap;
}
button.chip:hover{border-color:var(--line-2);background:var(--surface-2);color:var(--ink)}
button.chip[aria-pressed="true"], .chip.on{
  background:var(--brand-soft);border-color:color-mix(in oklab, var(--brand) 34%, transparent);
  color:var(--brand);font-weight:600;
}
.chip-sm{padding:3px 9px;font-size:11.5px}

.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:var(--r-pill);
  font-size:11px;font-weight:600;letter-spacing:.02em;
  white-space:nowrap;
}
.badge-mild{background:var(--sev-mild-soft);color:var(--sev-mild-ink)}
.badge-moderate{background:var(--sev-moderate-soft);color:var(--sev-moderate-ink)}
.badge-severe{background:var(--sev-severe-soft);color:var(--sev-severe-ink)}
.badge-dose{background:var(--dose-soft);color:var(--dose-ink)}
.badge-neutral{background:var(--surface-3);color:var(--ink-2)}
.badge-ok{background:var(--ok-soft);color:var(--sev-mild-ink)}
.badge-warn{background:var(--warn-soft);color:var(--sev-moderate-ink)}
.badge-danger{background:var(--danger-soft);color:var(--sev-severe-ink)}

.who{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:600;padding:3px 8px;border-radius:var(--r-pill);
  background:var(--surface-3);color:var(--ink-2);white-space:nowrap;
}
.who .who-dot{width:6px;height:6px;border-radius:99px;flex:0 0 6px}

.dot{width:7px;height:7px;border-radius:99px;flex:0 0 7px}

/* ---------- 8. Forms ---------- */
.field{display:block;margin-bottom:16px}
.field:last-child{margin-bottom:0}
.label{
  display:block;font-size:12px;font-weight:600;color:var(--ink-2);
  letter-spacing:.01em;margin-bottom:7px;
}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.45}
.err{font-size:12.5px;color:var(--danger);margin-top:7px;display:flex;align-items:center;gap:6px}

.input, .textarea, .select{
  width:100%;padding:11px 13px;border-radius:var(--r-sm);
  border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink);font-size:15px;line-height:1.4;
  transition:border-color .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease);
}
.input::placeholder,.textarea::placeholder{color:var(--ink-4)}
.input:hover,.textarea:hover,.select:hover{border-color:var(--ink-4)}
.input:focus,.textarea:focus,.select:focus{
  border-color:var(--brand);
  box-shadow:0 0 0 3px color-mix(in oklab, var(--brand) 16%, transparent);
  outline:none;
}
.input[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in oklab, var(--danger) 14%, transparent)}
.textarea{resize:vertical;min-height:88px}
.input[type="date"]{min-height:44px}
input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.55}
:root[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.8)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.8)}}
.input-affix{position:relative;display:flex;align-items:center}
.input-affix .ia-ico{position:absolute;left:12px;color:var(--ink-3);pointer-events:none;display:grid;place-items:center}
.input-affix .input{padding-left:38px}

/* Segmented option cards */
.opts{display:grid;gap:8px}
.opts-3{grid-template-columns:repeat(3,1fr)}
.opt{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  padding:11px 12px;border-radius:var(--r-sm);
  border:1.5px solid var(--line);background:var(--surface);
  text-align:left;transition:all .16s var(--ease);min-height:44px;
}
.opt:hover{border-color:var(--line-2);background:var(--surface-2)}
.opt-t{font-size:13.5px;font-weight:600;line-height:1.2}
.opt-s{font-size:11px;color:var(--ink-3);line-height:1.3}
.opt[aria-pressed="true"]{border-color:currentColor}
.opt.sev-mild[aria-pressed="true"]{background:var(--sev-mild-soft);color:var(--sev-mild-ink);border-color:var(--sev-mild)}
.opt.sev-moderate[aria-pressed="true"]{background:var(--sev-moderate-soft);color:var(--sev-moderate-ink);border-color:var(--sev-moderate)}
.opt.sev-severe[aria-pressed="true"]{background:var(--sev-severe-soft);color:var(--sev-severe-ink);border-color:var(--sev-severe)}
.opt[aria-pressed="true"] .opt-s{color:inherit;opacity:.78}

/* Segmented control */
.seg{
  display:inline-flex;padding:3px;gap:2px;border-radius:var(--r-pill);
  background:var(--surface-3);border:1px solid var(--line);
}
.seg button{
  padding:5px 12px;border-radius:var(--r-pill);font-size:12.5px;font-weight:500;
  color:var(--ink-2);transition:all .16s var(--ease);white-space:nowrap;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--sh-1)}
.seg.full{display:flex;width:100%}
.seg.full button{flex:1;text-align:center}

/* Stepper */
.stepper{display:flex;align-items:center;gap:10px}
.stepper .step-btn{
  width:44px;height:44px;border-radius:14px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink);display:grid;place-items:center;
  transition:all .15s var(--ease);
}
.stepper .step-btn:hover{background:var(--surface-3);border-color:var(--ink-4)}
.stepper .step-btn:disabled{opacity:.35;pointer-events:none}
.stepper .step-val{
  flex:1;text-align:center;font-family:var(--font-display);font-weight:600;
  font-size:26px;font-variant-numeric:tabular-nums;line-height:1;
}
.stepper .step-unit{font-size:11.5px;color:var(--ink-3);font-family:var(--font-ui);font-weight:500;display:block;margin-top:4px;letter-spacing:.02em}

/* Switch */
.switch{
  width:44px;height:26px;border-radius:99px;background:var(--line-2);
  position:relative;transition:background .18s var(--ease);flex:0 0 44px;
}
.switch[aria-checked="true"]{background:var(--brand)}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s var(--ease);
}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* ---------- 9. Stat tiles ---------- */
.stats{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0;
  transition:border-color .18s var(--ease), box-shadow .18s var(--ease);
}
.stat:hover{border-color:var(--line-2);box-shadow:var(--sh-1)}
.stat-l{font-size:11.5px;color:var(--ink-3);font-weight:500;letter-spacing:.01em;display:flex;align-items:center;gap:6px}
.stat-v{font-family:var(--font-display);font-weight:600;font-size:27px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:4px}
.stat-v .unit{font-size:13px;font-weight:500;color:var(--ink-3);font-family:var(--font-ui);margin-left:3px;letter-spacing:0}
.stat-f{font-size:11.5px;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;row-gap:1px}
.stat-f .sf-note{white-space:nowrap}
@media (max-width:559px){ .stat-f .sf-note{display:none} }
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-size:11.5px}
.delta.up{color:var(--sev-severe-ink)}
.delta.down{color:var(--sev-mild-ink)}
.delta.flat{color:var(--ink-3)}

/* ---------- 10. Hero ---------- */
.hero{
  position:relative;overflow:hidden;
  border:1px solid var(--line);border-radius:var(--r-xl);
  background:
    linear-gradient(140deg, color-mix(in oklab, var(--brand-soft) 78%, var(--surface)), var(--surface) 58%),
    var(--surface);
  box-shadow:var(--sh-2);
  padding:22px;
}
.hero::after{
  content:"";position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle, color-mix(in oklab, var(--accent) 22%, transparent), transparent 66%);
  pointer-events:none;
}
.hero-grid{display:grid;gap:20px;position:relative;z-index:1}
.hero-metric{display:flex;align-items:baseline;gap:10px;margin-top:2px}
.hero-num{font-family:var(--font-display);font-weight:600;font-size:clamp(52px,12vw,72px);line-height:.9;letter-spacing:-.03em;color:var(--brand);font-variant-numeric:tabular-nums}
.hero-unit{font-size:15px;font-weight:500;color:var(--ink-2)}

/* ---------- 11. Timeline ---------- */
.tl{position:relative;display:flex;flex-direction:column}
.tl::before{
  content:"";position:absolute;left:19px;top:14px;bottom:14px;width:1.5px;
  background:linear-gradient(180deg,transparent,var(--line) 8%,var(--line) 92%,transparent);
}
.tl-item{
  display:flex;gap:14px;padding:10px 0;position:relative;
}
.tl-node{
  width:38px;height:38px;flex:0 0 38px;border-radius:13px;
  display:grid;place-items:center;position:relative;z-index:1;
  border:2px solid var(--surface);
}
.tl-body{flex:1;min-width:0;padding-top:1px}
.tl-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tl-t{font-size:14.5px;font-weight:600;letter-spacing:-.005em}
.tl-when{font-size:12px;color:var(--ink-3);margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.tl-meta{font-size:12.5px;color:var(--ink-2);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-note{
  font-size:13px;color:var(--ink-2);margin-top:7px;line-height:1.5;
  padding:9px 12px;border-radius:10px;background:var(--surface-2);
  border-left:2px solid var(--line-2);
}

/* Journal rows */
.jrow{
  display:flex;gap:13px;padding:13px 14px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface);
  transition:border-color .18s var(--ease), box-shadow .18s var(--ease), transform .18s var(--ease);
  position:relative;
}
.jrow:hover{border-color:var(--line-2);box-shadow:var(--sh-2)}
.jrow-ico{width:40px;height:40px;flex:0 0 40px;border-radius:13px;display:grid;place-items:center}
/* On narrow screens the full date in .tl-meta carries the day, so the
   right-aligned short date would only wrap onto its own line. */
@media (max-width:639px){ .jrow .tl-when{display:none} }
.jrow-actions{display:flex;gap:5px;opacity:0;transition:opacity .16s var(--ease)}
.jrow:hover .jrow-actions,.jrow:focus-within .jrow-actions{opacity:1}
@media (hover:none){.jrow-actions{opacity:1}}
.month-head{
  position:sticky;top:56px;z-index:5;
  display:flex;align-items:center;gap:12px;
  padding:10px 2px 8px;margin-top:6px;
  background:linear-gradient(180deg, var(--bg) 62%, transparent);
  backdrop-filter:blur(3px);
}
.month-head .mh-t{font-family:var(--font-display);font-weight:600;font-size:14.5px;letter-spacing:.01em}
.month-head .mh-line{flex:1;height:1px;background:var(--line)}

/* ---------- 12. Alerts ---------- */
.alert{
  display:flex;gap:13px;align-items:flex-start;
  padding:14px 16px;border-radius:var(--r-md);
  border:1px solid transparent;
}
.alert-ico{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center}
.alert-t{font-size:14px;font-weight:600;line-height:1.3}
.alert-s{font-size:12.5px;margin-top:2px;line-height:1.45;opacity:.86}
.alert-warn{background:var(--warn-soft);border-color:color-mix(in oklab, var(--warn) 26%, transparent);color:var(--sev-moderate-ink)}
.alert-warn .alert-ico{background:color-mix(in oklab, var(--warn) 20%, transparent);color:var(--sev-moderate-ink)}
.alert-danger{background:var(--danger-soft);border-color:color-mix(in oklab, var(--danger) 28%, transparent);color:var(--sev-severe-ink)}
.alert-danger .alert-ico{background:color-mix(in oklab, var(--danger) 20%, transparent);color:var(--sev-severe-ink)}
.alert-info{background:var(--brand-soft);border-color:color-mix(in oklab, var(--brand) 24%, transparent);color:var(--brand)}
.alert-info .alert-ico{background:color-mix(in oklab, var(--brand) 18%, transparent);color:var(--brand)}

/* ---------- 13. Empty states ---------- */
.empty{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:38px 22px;gap:5px;
}
.empty-art{
  width:76px;height:76px;border-radius:26px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--brand-soft),var(--accent-soft));
  color:var(--brand);margin-bottom:11px;border:1px solid var(--line);
}
.empty-t{font-family:var(--font-display);font-weight:600;font-size:16.5px}
.empty-s{font-size:13px;color:var(--ink-3);max-width:34ch;line-height:1.55}
.empty .btn{margin-top:14px}

/* ---------- 14. Modal / sheet ---------- */
.scrim{
  position:fixed;inset:0;z-index:200;background:var(--veil);
  backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .22s ease both;
}
.sheet{
  width:100%;max-width:520px;max-height:92vh;
  background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-bottom:none;
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:var(--sh-3);
  display:flex;flex-direction:column;
  animation:slideup .3s var(--ease) both;
}
.sheet-grip{width:38px;height:4px;border-radius:99px;background:var(--line-2);margin:10px auto 0;flex:0 0 auto}
.sheet-head{
  display:flex;align-items:center;gap:12px;
  padding:14px 20px 12px;flex:0 0 auto;
}
.sheet-title{font-family:var(--font-display);font-weight:600;font-size:19px;letter-spacing:-.01em;flex:1}
.sheet-body{padding:4px 20px 20px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet-foot{
  padding:14px 20px calc(18px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--surface-2);
  display:flex;gap:10px;flex:0 0 auto;
  border-radius:0 0 0 0;
}
.sheet-foot .btn{flex:1}

/* ---------- 15. Toasts ---------- */
.toasts{
  position:fixed;z-index:400;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav-h) + 14px);
  display:flex;flex-direction:column;gap:8px;align-items:center;
  width:min(420px,calc(100vw - 24px));pointer-events:none;
}
.toast{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:11px 14px;border-radius:var(--r-md);
  background:var(--ink);color:var(--bg);
  box-shadow:var(--sh-3);font-size:13.5px;font-weight:500;
  animation:toastin .3s var(--ease) both;pointer-events:auto;
}
.toast.out{animation:toastout .22s ease both}
.toast-ico{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;flex:0 0 22px}
.toast.ok .toast-ico{background:var(--ok);color:#fff}
.toast.warn .toast-ico{background:var(--warn);color:#fff}
.toast.err .toast-ico{background:var(--danger);color:#fff}

/* ---------- 16. Charts ---------- */
.chart-wrap{position:relative;width:100%}
.chart-tip{
  position:absolute;z-index:10;pointer-events:none;
  transform:translate(-50%,-112%);
  background:var(--ink);color:var(--bg);
  padding:8px 11px;border-radius:10px;font-size:12px;line-height:1.45;
  box-shadow:var(--sh-2);white-space:nowrap;font-weight:500;
}
.chart-tip .ct-h{font-size:11px;opacity:.65;margin-bottom:3px;letter-spacing:.02em}
.chart-tip .ct-r{display:flex;align-items:center;gap:6px}
.chart-legend{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:12px}
.chart-legend .cl{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.chart-legend .cl b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.axis-t{font-size:10.5px;fill:var(--ink-3);font-family:var(--font-ui)}
.grid-l{stroke:var(--line);stroke-width:1}

.heat-cell{transition:opacity .14s var(--ease)}
.heat-cell:hover{opacity:.72}

.ring-label{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;pointer-events:none;
}

/* ---------- 17. Lists / rows ---------- */
.list{display:flex;flex-direction:column}
.list-row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 16px;border-bottom:1px solid var(--line);
  transition:background .15s var(--ease);
}
.list-row:last-child{border-bottom:none}
button.list-row:hover{background:var(--surface-2)}
.lr-ico{width:36px;height:36px;flex:0 0 36px;border-radius:12px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2)}
.lr-t{font-size:14.5px;font-weight:500;line-height:1.3}
.lr-s{font-size:12px;color:var(--ink-3);line-height:1.35;margin-top:1px}
.lr-end{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:12.5px}

.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.kv-l{font-size:11.5px;color:var(--ink-3);font-weight:500;letter-spacing:.01em}
.kv-v{font-size:15px;font-weight:600;margin-top:2px;letter-spacing:-.005em}

/* ---------- 18. Auth / gate screens ---------- */
.gate{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom));position:relative;overflow:hidden;
}
.gate::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(700px 420px at 12% -6%, color-mix(in oklab, var(--brand) 16%, transparent), transparent 60%),
    radial-gradient(620px 380px at 92% 8%, color-mix(in oklab, var(--accent) 15%, transparent), transparent 58%);
}
.gate-card{
  width:100%;max-width:440px;position:relative;z-index:1;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-xl);box-shadow:var(--sh-3);
  padding:26px 22px;
  animation:rise .5s var(--ease) both;
}
.gate-card.wide{max-width:560px}
.gate-mark{
  width:52px;height:52px;border-radius:18px;margin:0 auto 14px;
  background:linear-gradient(150deg,var(--brand-2),var(--brand));
  color:var(--brand-ink);display:grid;place-items:center;
  box-shadow:0 12px 26px -12px color-mix(in oklab, var(--brand) 85%, transparent);
}
.gate-t{font-family:var(--font-display);font-weight:600;font-size:24px;text-align:center;letter-spacing:-.015em;line-height:1.2}
.gate-s{font-size:13.5px;color:var(--ink-3);text-align:center;margin-top:7px;line-height:1.55}
.gate-top{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;z-index:2}

/* Profile editor row */
.prow{
  display:flex;align-items:center;gap:11px;
  padding:12px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface-2);margin-bottom:10px;
}
.emoji-btn{
  width:48px;height:48px;flex:0 0 48px;border-radius:16px;font-size:24px;
  display:grid;place-items:center;border:1.5px solid var(--line-2);
  background:var(--surface);transition:all .16s var(--ease);
}
.emoji-btn:hover{border-color:var(--ink-4)}
.emoji-pop{
  position:absolute;top:56px;left:0;z-index:60;
  width:248px;padding:10px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-pop);
  display:flex;flex-wrap:wrap;gap:3px;
  animation:pop .2s var(--ease) both;
}
.emoji-pop button{width:34px;height:34px;border-radius:9px;font-size:19px;display:grid;place-items:center;transition:background .12s var(--ease)}
.emoji-pop button:hover{background:var(--surface-3)}
.emoji-pop button[aria-pressed="true"]{background:var(--brand-soft);box-shadow:inset 0 0 0 1.5px var(--brand)}
.swatches{display:flex;gap:4px;flex-wrap:wrap;width:52px;flex:0 0 52px}
.swatch{width:14px;height:14px;border-radius:99px;box-shadow:0 0 0 1.5px var(--surface), 0 0 0 2px transparent;transition:box-shadow .14s var(--ease)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--surface), 0 0 0 3px var(--ink)}

/* ---------- 19. Skeletons ---------- */
.sk{
  background:linear-gradient(90deg,var(--surface-3) 25%,var(--line) 50%,var(--surface-3) 75%);
  background-size:220% 100%;animation:shimmer 1.5s infinite linear;
  border-radius:8px;
}
.sk-line{height:12px;margin-bottom:9px}
.sk-card{height:110px;border-radius:var(--r-lg)}

/* ---------- 20. Animation ---------- */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
@keyframes slideup{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastin{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes shimmer{to{background-position:-220% 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}

.rise{animation:rise .46s var(--ease) both;animation-delay:var(--d,0ms)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.bar-grow{transform-origin:bottom;animation:growY .6s var(--ease) both;animation-delay:var(--d,0ms)}
.line-draw{stroke-dasharray:var(--len);animation:draw .9s var(--ease) both}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important;
  }
}

/* ---------- 21. Responsive ---------- */
@media (min-width:560px){
  .stats{grid-template-columns:repeat(4,1fr)}
  .opts-3{gap:10px}
  .sheet{border-radius:var(--r-xl);max-width:520px;margin-bottom:0}
}
@media (min-width:720px){
  .scrim{align-items:center;padding:24px}
  .sheet{border-radius:var(--r-xl);border-bottom:1px solid var(--line);max-height:88vh}
  .sheet-grip{display:none}
  .sheet-head{padding-top:20px}
  .sheet-foot{border-radius:0 0 var(--r-xl) var(--r-xl);padding-bottom:18px}
  .page{padding:24px 24px calc(var(--nav-h) + 32px)}
  .hero{padding:28px}
  .hero-grid{grid-template-columns:1.15fr 1fr;align-items:center;gap:28px}
  .grid-2{grid-template-columns:repeat(2,1fr)}
}
@media (min-width:1024px){
  .rail{display:flex}

import React, { useState, useEffect, useRef, useMemo, useCallback } from "https://esm.sh/react@18";

const FB_ON = FIREBASE_CONFIG.apiKey !== "PASTE_YOUR_API_KEY_HERE";
let fbLoad = null, fbSave = null, fbSubscribe = null, fbLoadUserMeta = null, fbSaveUserMeta = null;
let fbCreateInvite = null, fbRedeemInvite = null;
let fbAuthObserve = null, fbSignIn = null, fbSignUp = null, fbSignOut = null;

if (FB_ON) {
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const { getDatabase, ref, get, set, onValue, update } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");
    const { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
    const app = initializeApp(FIREBASE_CONFIG);
    const db  = getDatabase(app);
    const auth = getAuth(app);
    const userRef = (uid) => ref(db, `pawsthma/users/${uid}`);
    const homeRef = (key) => ref(db, `pawsthma/households/${key}`);
    const inviteRef = (code) => ref(db, `pawsthma/invites/${code}`);
    fbLoadUserMeta = async (uid) => { const s = await get(userRef(uid)); return s.val(); };
    fbSaveUserMeta = async (uid, meta) => { await update(userRef(uid), meta); return true; };
    fbLoad      = async (key) => { const s = await get(homeRef(key)); return s.val(); };
    fbSave      = async (key,d) => { await set(homeRef(key), d); return true; };
    fbSubscribe = (key,cb) => onValue(homeRef(key), s => { const v = s.val(); if (v) cb(v); });
    fbCreateInvite = async ({code, householdId, createdBy, createdAt, expiresAt}) => {
      await set(inviteRef(code), { code, householdId, createdBy, createdAt, expiresAt, usedBy:null, usedAt:null });
      return true;
    };
    fbRedeemInvite = async ({code, uid}) => {
      const snap = await get(inviteRef(code));
      const invite = snap.val();
      if(!invite) return { ok:false, reason:"not-found" };
      if(invite.usedBy) return { ok:false, reason:"used" };
      if(invite.expiresAt && Date.now() > invite.expiresAt) return { ok:false, reason:"expired" };
      await update(inviteRef(code), { usedBy:uid, usedAt:Date.now() });
      return { ok:true, householdId:invite.householdId };
    };
    fbAuthObserve = (cb) => onAuthStateChanged(auth, cb);
    fbSignIn = async (email,password) => signInWithEmailAndPassword(auth, email, password);
    fbSignUp = async (email,password) => createUserWithEmailAndPassword(auth, email, password);
    fbSignOut = async () => signOut(auth);
    console.log("Firebase connected");
  } catch (err) { console.error("Firebase error:", err); }
}

const lsLoad = () => { try { const v = localStorage.getItem(LS); return v ? JSON.parse(v) : null; } catch { return null; } };
const lsSave = (d) => { try { localStorage.setItem(LS, JSON.stringify(d)); } catch {} };
const DEV_ID_KEY = "pawsthma_device_id";
const DEV_HOME_MAP = "pawsthma_device_households";
const getOrCreateDeviceId = () => {
  try {
    let id = localStorage.getItem(DEV_ID_KEY);
    if (!id) {
      id = (globalThis.crypto?.randomUUID?.() || `dev_${Math.random().toString(36).slice(2,12)}`);
      localStorage.setItem(DEV_ID_KEY, id);
    }
    return id;
  } catch { return "device_fallback"; }
};
const loadDeviceHomes = () => { try { return JSON.parse(localStorage.getItem(DEV_HOME_MAP) || "{}"); } catch { return {}; } };
const getDeviceHome = (deviceId) => loadDeviceHomes()[deviceId] || null;
const setDeviceHome = (deviceId, homeKey) => {
  try { const map = loadDeviceHomes(); map[deviceId] = homeKey; localStorage.setItem(DEV_HOME_MAP, JSON.stringify(map)); } catch {}
};
const clearDeviceHome = (deviceId) => {
  try { const map = loadDeviceHomes(); delete map[deviceId]; localStorage.setItem(DEV_HOME_MAP, JSON.stringify(map)); } catch {}
};

/* ─────────────── Date & data helpers ─────────────── */
const e = React.createElement;
const today = () => new Date().toISOString().split("T")[0];
const parseLocalDate = (value) => {
  if (value instanceof Date) return new Date(value.getFullYear(), value.getMonth(), value.getDate());
  if (typeof value !== "string") return new Date(value);
  const m = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return new Date(value);
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
};
const fmtLocalDateKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const loc = (lang) => lang==="pt" ? "pt-PT" : "en-GB";
const fmt = (d,lang) => parseLocalDate(d).toLocaleDateString(loc(lang),{day:"numeric",month:"short"});
const fmtLong = (d,lang) => parseLocalDate(d).toLocaleDateString(loc(lang),{weekday:"short",day:"numeric",month:"long",year:"numeric"});
const fmtMonth = (d,lang) => parseLocalDate(d).toLocaleDateString(loc(lang),{month:"long",year:"numeric"});
const fmtWeekRange = (startKey,lang) => {
  const start = parseLocalDate(startKey);
  const end = new Date(start); end.setDate(end.getDate()+6);
  return `${fmt(start,lang)} – ${fmt(end,lang)}`;
};
const fmtDuration = (minutes) => {
  const totalSec = Math.max(0, Math.round(Number(minutes||0)*60));
  const mins = Math.floor(totalSec/60), secs = totalSec%60;
  if (!mins) return `${secs}s`;
  if (!secs) return `${mins} min`;
  return `${mins}m ${secs}s`;
};
const daysBetween = (a,b) => Math.round((parseLocalDate(b)-parseLocalDate(a))/86400000);
const shiftDays = (dateKey, n) => { const d = parseLocalDate(dateKey); d.setDate(d.getDate()+n); return fmtLocalDateKey(d); };
const relDay = (dateKey, t) => t.daysAgo(Math.max(0, daysBetween(dateKey, today())));
const nextId = (arr) => arr.length ? Math.max(...arr.map(x=>Number(x.id)||0))+1 : 1;
const mkId = () => "p"+Math.random().toString(36).slice(2,7);
const mkHouseholdId = () => (globalThis.crypto?.randomUUID?.() || `h_${Math.random().toString(36).slice(2,12)}${Math.random().toString(36).slice(2,6)}`).replace(/-/g,"").slice(0,16);
const mkInviteCode = () => Math.random().toString(36).slice(2,6).toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
const clamp = (n,lo,hi) => Math.min(hi, Math.max(lo, n));

const normProfiles = (profiles) => {
  if (!Array.isArray(profiles)) return null;
  return profiles.filter(Boolean).map((p,idx)=>({

    name: (p.name||"").toString(),
    emoji: p.emoji || EMOJIS[idx%EMOJIS.length],
    color: p.color || PCOLS[idx%PCOLS.length],
  }));
};
const normMembers = (members) => {
  if (!Array.isArray(members)) return [];
  return [...new Set(members.map((m)=>typeof m === "string" ? m : m?.uid).filter((uid)=>typeof uid === "string" && uid.trim()))];
};
const normMemberKeys = (memberKeys, members=[]) => {
  if (memberKeys && typeof memberKeys === "object" && !Array.isArray(memberKeys)) {
    return Object.entries(memberKeys).reduce((acc,[uid,val])=>{ if (uid && val===true) acc[uid]=true; return acc; },{});
  }
  return members.reduce((acc,uid)=>{ acc[uid]=true; return acc; },{});
};
const mkCat = (idx,name,data={}) => ({
  id: data.id || `c${idx+1}`,

  inviteCode: (data.inviteCode || mkInviteCode()).toString().toUpperCase(),

  memberKeys: normMemberKeys(data.memberKeys, normMembers(data.members)),
  cats: Array.isArray(data.cats) ? data.cats.map((c,idx)=>mkCat(idx,c?.name,c)) : [],
});
const normalizeData = (raw) => {
  const src = raw && typeof raw === "object" ? raw : {};
  const homes = src.households && typeof src.households === "object" ? src.households : {};
  return {
    households: Object.entries(homes).reduce((acc,[k,v])=>{ acc[k] = mkHousehold(v?.name || k, v || {}); return acc; },{}),
  };
};

   ════════════════════════════════════════════════════════════ */
function useMeasure(){
  const ref = useRef(null);
  const [w,setW] = useState(0);
  useEffect(()=>{
    const el = ref.current; if(!el) return;
    const set = () => setW(el.getBoundingClientRect().width);
    set();
    if(typeof ResizeObserver === "undefined"){ window.addEventListener("resize",set); return ()=>window.removeEventListener("resize",set); }
    const ro = new ResizeObserver(set); ro.observe(el);
    return ()=>ro.disconnect();
  },[]);
  return [ref,w];
}
function useMedia(query){
  const [m,setM] = useState(()=> typeof matchMedia!=="undefined" && matchMedia(query).matches);
  useEffect(()=>{
    if(typeof matchMedia==="undefined") return;
    const mq = matchMedia(query);
    const fn = ev=>setM(ev.matches);
    mq.addEventListener ? mq.addEventListener("change",fn) : mq.addListener(fn);
    setM(mq.matches);
    return ()=> mq.removeEventListener ? mq.removeEventListener("change",fn) : mq.removeListener(fn);
  },[query]);
  return m;
}
function useEscape(active, onClose){
  useEffect(()=>{
    if(!active) return;
    const fn = ev => { if(ev.key==="Escape"){ ev.stopPropagation(); onClose(); } };
    window.addEventListener("keydown",fn);
    return ()=>window.removeEventListener("keydown",fn);
  },[active,onClose]);
}
function useScrolled(){
  const [s,setS] = useState(false);
  useEffect(()=>{
    const fn = ()=>setS(window.scrollY > 6);
    fn(); window.addEventListener("scroll",fn,{passive:true});
    return ()=>window.removeEventListener("scroll",fn);
  },[]);
  return s;
}

/* Stacked severity bars, week or month buckets */

  const [ref,w] = useMeasure();
  const [tip,setTip] = useState(null);
  if(!data.length) return onEmpty || null;
  const padL = 26, padR = 6, padT = 12, padB = 26;
  const iw = Math.max(60, w - padL - padR), ih = height - padT - padB;
  const max = Math.max(1, ...data.map(d=>d.total));
  const ticks = max<=4 ? Array.from({length:max+1},(_,i)=>i) : [0, Math.round(max/2), max];
  const slot = iw / data.length;
  const bw = Math.min(30, Math.max(7, slot*0.55));
  const labelEvery = Math.ceil(data.length / Math.max(2, Math.floor(iw/62)));

  return e("div",{className:"chart-wrap",ref},
    w>0 && e("svg",{width:"100%",height,role:"img","aria-label":t.weeklyActivity},
      ticks.map(tk=>{
        const y = padT + ih - (tk/max)*ih;
        return e("g",{key:tk},
          e("line",{x1:padL,x2:padL+iw,y1:y,y2:y,className:"grid-l",strokeDasharray:tk===0?"":"3 4",opacity:tk===0?1:.75}),
          e("text",{x:padL-7,y:y+3.5,textAnchor:"end",className:"axis-t"},tk));
      }),
      data.map((d,i)=>{
        const cx = padL + slot*i + slot/2;

        return e("g",{key:d.key,
          onMouseEnter:()=>setTip({x:cx,y:padT+ih-(d.total/max)*ih,header:d.label,
            rows:[...SEVS.filter(s=>d[s]>0).map(s=>({color:SEV_VAR[s],text:`${t.sevLabels[s]}: ${d[s]}`})),
                  ...(d.total?[{text:`${t.total}: ${d.total}`}]:[{text:"—"}])]}),
          onMouseLeave:()=>setTip(null)},
          e("rect",{x:cx-slot/2,y:padT,width:slot,height:ih,fill:"transparent"}),

/* Duration trend: gradient area + line + interactive crosshair */
function TrendArea({points, height=200, t, unitLabel}){
  const [ref,w] = useMeasure();
  const [hi,setHi] = useState(null);
  if(!points.length) return null;
  const padL = 30, padR = 10, padT = 14, padB = 26;
  const iw = Math.max(60, w - padL - padR), ih = height - padT - padB;
  const max = Math.max(...points.map(p=>p.y), 1);
  const niceMax = max<=2 ? Math.ceil(max*2)/2 : Math.ceil(max);
  const single = points.length === 1;
  const X = i => single ? padL + iw/2 : padL + (i/(points.length-1))*iw;
  const Y = v => padT + ih - (v/niceMax)*ih;
  const line = points.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  const area = `${line} L${X(points.length-1).toFixed(1)},${(padT+ih).toFixed(1)} L${X(0).toFixed(1)},${(padT+ih).toFixed(1)} Z`;
  const ticks = [0, niceMax/2, niceMax];
  const labelEvery = Math.ceil(points.length / Math.max(2, Math.floor(iw/66)));
  const nearest = (evt) => {
    const box = evt.currentTarget.getBoundingClientRect();
    const x = evt.clientX - box.left;
    let best = 0, bd = Infinity;
    points.forEach((_,i)=>{ const d = Math.abs(X(i)-x); if(d<bd){bd=d;best=i;} });
    setHi(best);
  };
  return e("div",{className:"chart-wrap",ref},
    w>0 && e("svg",{width:"100%",height,onMouseMove:nearest,onMouseLeave:()=>setHi(null),role:"img","aria-label":t.durationTrend},
      e("defs",null,
        e("linearGradient",{id:"pa-area",x1:"0",y1:"0",x2:"0",y2:"1"},
          e("stop",{offset:"0%",stopColor:"var(--brand)",stopOpacity:.26}),
          e("stop",{offset:"100%",stopColor:"var(--brand)",stopOpacity:0}))),
      ticks.map((tk,i)=>{
        const y = Y(tk);
        return e("g",{key:i},
          e("line",{x1:padL,x2:padL+iw,y1:y,y2:y,className:"grid-l",strokeDasharray:tk===0?"":"3 4",opacity:tk===0?1:.75}),
          e("text",{x:padL-7,y:y+3.5,textAnchor:"end",className:"axis-t"}, tk % 1 ? tk.toFixed(1) : tk));
      }),
      !single && e("path",{d:area,fill:"url(#pa-area)"}),
      !single && e("path",{d:line,fill:"none",stroke:"var(--brand)",strokeWidth:2.4,strokeLinecap:"round",strokeLinejoin:"round"}),
      hi!=null && e("line",{x1:X(hi),x2:X(hi),y1:padT,y2:padT+ih,stroke:"var(--line-2)",strokeWidth:1,strokeDasharray:"3 3"}),
      points.map((p,i)=>e("circle",{key:i,cx:X(i),cy:Y(p.y),r:hi===i?5:(points.length>34?0:3.2),
        fill:"var(--surface)",stroke:p.color||"var(--brand)",strokeWidth:2.2,style:{transition:"r .12s ease"}})),
      points.map((p,i)=> i%labelEvery===0 && e("text",{key:`x${i}`,x:X(i),y:height-8,textAnchor:"middle",className:"axis-t"},p.label))),
    hi!=null && e(ChartTip,{tip:{x:X(hi),y:Y(points[hi].y),header:points[hi].full||points[hi].label,
      rows:[{color:points[hi].color||"var(--brand)",text:`${points[hi].display||points[hi].y} ${unitLabel||""}`.trim()},
            ...(points[hi].note?[{text:points[hi].note}]:[])]}}));
}

/* Donut with centred total */
function Donut({segments, total, centerLabel, size=168, t}){
  const [hi,setHi] = useState(null);
  const sum = segments.reduce((s,x)=>s+x.value,0) || 1;
  const R = size/2, r0 = R*0.62, r1 = R*0.92, gap = 0.022;
  let a = -Math.PI/2;
  const arcs = segments.map(sgm=>{
    const frac = sgm.value/sum;
    const a0 = a + gap/2, a1 = a + frac*Math.PI*2 - gap/2;
    a += frac*Math.PI*2;
    const large = (a1-a0) > Math.PI ? 1 : 0;
    const p = (rad,ang)=>`${(R+rad*Math.cos(ang)).toFixed(2)},${(R+rad*Math.sin(ang)).toFixed(2)}`;
    const d = a1>a0
      ? `M${p(r1,a0)}A${r1},${r1} 0 ${large} 1 ${p(r1,a1)}L${p(r0,a1)}A${r0},${r0} 0 ${large} 0 ${p(r0,a0)}Z`
      : "";
    return {...sgm, d, frac};
  });
  return e("div",{style:{position:"relative",width:size,height:size,margin:"0 auto",flexShrink:0}},
    e("svg",{width:size,height:size,role:"img","aria-label":t.severityMix},
      arcs.map((x,i)=>e("path",{key:x.name,d:x.d,fill:x.color,
        opacity:hi==null||hi===i?1:.32,
        style:{transition:"opacity .16s ease",cursor:"default"},
        onMouseEnter:()=>setHi(i),onMouseLeave:()=>setHi(null)}))),
    e("div",{className:"ring-label"},
      e("div",{className:"num",style:{fontSize:30,color:hi==null?"var(--ink)":arcs[hi].color}},
        hi==null ? total : arcs[hi].value),
      e("div",{style:{fontSize:11,color:"var(--ink-3)",marginTop:5,fontWeight:500,maxWidth:size*0.62,lineHeight:1.3}},
        hi==null ? centerLabel : arcs[hi].label)));
}

/* Daily calendar heat strip */
function CalendarHeat({days, weeks, t, lang}){
  const [ref,w] = useMeasure();
  const [tip,setTip] = useState(null);
  const gap = 3, target = 15;
  // Fill the available width: derive the number of week columns from the container.
  const cols = weeks || (w>0 ? clamp(Math.floor((w+gap)/(target+gap)), 10, 53) : 16);
  const cell = w>0 ? clamp((w - (cols-1)*gap)/cols, 7, 18) : 12;
  const height = 7*(cell+gap) - gap + 18;
  const end = parseLocalDate(today());
  const endMonday = new Date(end); endMonday.setDate(endMonday.getDate() - ((endMonday.getDay()+6)%7));
  const start = new Date(endMonday); start.setDate(start.getDate() - (cols-1)*7);
  const monthMarks = [];
  let lastMonth = -1;
  return e("div",{className:"chart-wrap",ref},
    w>0 && e("svg",{width:"100%",height,role:"img","aria-label":t.calendarTitle},
      Array.from({length:cols}).flatMap((_,c)=>{
        const colDate = new Date(start); colDate.setDate(colDate.getDate()+c*7);
        if(colDate.getMonth()!==lastMonth){ lastMonth = colDate.getMonth(); monthMarks.push({c, label:colDate.toLocaleDateString(loc(lang),{month:"short"})}); }
        return Array.from({length:7}).map((__,r)=>{
          const d = new Date(colDate); d.setDate(d.getDate()+r);
          const key = fmtLocalDateKey(d);
          const future = d > end;
          const hit = days[key];
          const fill = future ? "transparent" : hit ? SEV_VAR[hit.worst] : "var(--surface-3)";
          return e("rect",{key:`${c}-${r}`,x:c*(cell+gap),y:r*(cell+gap)+16,width:cell,height:cell,rx:Math.min(4,cell/3),
            fill, className:"heat-cell",
            stroke:future?"var(--line)":"none",strokeDasharray:future?"2 2":undefined,
            onMouseEnter:future?undefined:()=>setTip({x:c*(cell+gap)+cell/2,y:r*(cell+gap)+16,
              header:fmtLong(key,lang),
              rows: hit ? [{color:SEV_VAR[hit.worst],text:`${hit.count} ${hit.count===1?t.attackEntry:t.filterAttacks.toLowerCase()} · ${t.sevLabels[hit.worst]}`}] : [{text:"—"}]}),
            onMouseLeave:()=>setTip(null)});
        });
      }),
      /* drop a month label that would be clipped by the right edge */
      monthMarks.filter(m=>m.c*(cell+gap) < w-26)
        .map(m=>e("text",{key:m.c,x:m.c*(cell+gap),y:9,className:"axis-t"},m.label))),
    e(ChartTip,{tip}));
}

/* ════════════════════════════════════════════════════════════
   DERIVED DATA
   ════════════════════════════════════════════════════════════ */
const inRange = (dateKey, days) => days === 0 ? true : daysBetween(dateKey, today()) < days && daysBetween(dateKey, today()) >= 0;
const worstOf = (list) => list.reduce((w,a)=> SEVS.indexOf(a.severity) > SEVS.indexOf(w) ? a.severity : w, "mild");

function weekBuckets(attacks, count, lang){
  const end = parseLocalDate(today());
  const monday = new Date(end); monday.setDate(monday.getDate() - ((monday.getDay()+6)%7));
  const out = [];
  for(let i=count-1;i>=0;i--){
    const ws = new Date(monday); ws.setDate(ws.getDate()-i*7);
    const key = fmtLocalDateKey(ws);
    out.push({key, label:fmtWeekRange(key,lang), short:fmt(key,lang), mild:0, moderate:0, severe:0, total:0});
  }
  const idx = Object.fromEntries(out.map((b,i)=>[b.key,i]));
  attacks.forEach(a=>{
    const d = parseLocalDate(a.date);
    const ws = new Date(d); ws.setDate(ws.getDate() - ((ws.getDay()+6)%7));
    const b = out[idx[fmtLocalDateKey(ws)]];
    if(b && SEVS.includes(a.severity)){ b[a.severity]++; b.total++; }
  });
  return out;
}

function dayMap(attacks){
  const m = {};
  attacks.forEach(a=>{
    const k = a.date;
    if(!m[k]) m[k] = {count:0, worst:"mild", items:[]};
    m[k].count++; m[k].items.push(a);
    if(SEVS.indexOf(a.severity) > SEVS.indexOf(m[k].worst)) m[k].worst = a.severity;
  });
  return m;
}

function buildEvents(attacks, doses){
  const evs = [
    ...attacks.map(a=>({kind:"attack", id:a.id, date:a.date, raw:a})),
    ...doses.map(l=>({kind:"dose", id:l.id, date:l.date, raw:l})),
  ];
  return evs.sort((a,b)=> b.date.localeCompare(a.date) || (a.kind===b.kind ? Number(b.id)-Number(a.id) : a.kind==="attack" ? -1 : 1));
}

function deltaOf(cur, prev, t){
  if(prev === 0 && cur === 0) return {dir:"flat", text:t.same};
  const diff = cur - prev;
  if(diff === 0) return {dir:"flat", text:t.same};
  return {dir: diff>0 ? "up" : "down", text: `${Math.abs(diff)} ${diff>0?t.more:t.fewer}`};
}

function LoginGate({lang, setLang, onSubmit, account, householdOptions=[], onSignOut}){
  const t = T[lang];
  const options = householdOptions
    .map((h)=>typeof h === "string" ? { id:h, label:h } : { id:h?.id||"", label:h?.label||h?.name||h?.id||"" })
    .filter((o)=>o.id);
  const hasSaved = options.length > 0;
  const [mode,setMode] = useState(hasSaved?"open":"create");
  const [household,setHousehold] = useState("");
  const [selected,setSelected] = useState(options[0]?.id || "");
  const [inviteCode,setInviteCode] = useState("");
  const [err,setErr] = useState(null);
  const [busy,setBusy] = useState(false);
  useEffect(()=>{ if(!hasSaved && mode==="open") setMode("create"); },[hasSaved,mode]);
  useEffect(()=>{ if(!options.some(o=>o.id===selected)) setSelected(options[0]?.id||""); },[options,selected]);

  const submit = async(ev)=>{
    ev?.preventDefault?.();
    let payload = null;
    if(mode==="open"){ if(!selected){ setErr(t.loginNeedHousehold); return; } payload = {action:"open", householdId:selected}; }
    else if(mode==="create"){ if(!household.trim()){ setErr(t.loginNeedHousehold); return; } payload = {action:"create", householdName:household.trim()}; }
    else { if(!inviteCode.trim()){ setErr(t.loginNeedInvite); return; } payload = {action:"join", inviteCode:inviteCode.trim().toUpperCase()}; }
    setBusy(true);
    const msg = await onSubmit(payload);
    setBusy(false);
    if(msg) setErr(msg);
  };

  const modes = [
    hasSaved && {id:"open", label:t.chooseHousehold},
    {id:"create", label:t.createHousehold},
    {id:"join", label:t.joinWithInvite},
  ].filter(Boolean);

  return e(GateShell,{lang,setLang},
    e(BrandHead,{title:t.loginEnter, sub:t.loginSub}),
    account && e("div",{style:{textAlign:"center",marginTop:10}},
      e("span",{className:"chip chip-sm"}, e(Icon,{name:"users",size:12}), t.signedInAs(account))),
    e("form",{onSubmit:submit,style:{marginTop:20}},
      e("div",{style:{display:"flex",justifyContent:"center",marginBottom:16}},
        e(Segmented,{options:modes.map(m=>({value:m.id,label:m.label})),value:mode,
          onChange:m=>{setMode(m);setErr(null);}})),

      mode==="open" && e("div",{style:{display:"flex",flexDirection:"column",gap:8,marginBottom:14}},
        options.map(h=>e("button",{key:h.id,type:"button",
          onClick:()=>{setSelected(h.id);setErr(null);},
          className:"cat-card",
          style:selected===h.id?{borderColor:"var(--brand)",background:"var(--brand-soft)",boxShadow:"var(--sh-2)"}:undefined},
          e("span",{className:"cat-av",style:{background:"var(--surface-3)",color:"var(--ink-2)"}}, e(Icon,{name:"house",size:19})),
          e("span",{style:{flex:1,minWidth:0}},
            e("span",{className:"cat-name",style:{display:"block"}},h.label)),
          selected===h.id && e(Icon,{name:"check",size:17,style:{color:"var(--brand)"}})))),

      mode==="create" && e(Field,{label:t.householdName,id:"pa-home",hint:t.loginSub},
        e("input",{id:"pa-home",className:"input",value:household,placeholder:"Casa dos Gatos",
          onChange:ev=>{setHousehold(ev.target.value);setErr(null);}})),

      mode==="join" && e(Field,{label:t.inviteCode,id:"pa-inv",hint:t.inviteCodeHelp},
        e("input",{id:"pa-inv",className:"input",value:inviteCode,placeholder:t.inviteHint,autoCapitalize:"characters",
          style:{letterSpacing:".12em",fontWeight:600},
          onChange:ev=>{setInviteCode(ev.target.value.toUpperCase());setErr(null);}})),

      err && e("div",{className:"err",style:{marginBottom:12}}, e(Icon,{name:"alert",size:13,stroke:2}), err),

      e("button",{type:"submit",className:"btn btn-primary btn-lg btn-block",disabled:busy},
        busy ? "…" : mode==="join" ? t.joinWithInvite : mode==="create" ? t.loginCreate : t.login),
      onSignOut && e("button",{type:"button",className:"btn btn-ghost btn-block",style:{marginTop:8},onClick:onSignOut},
        e(Icon,{name:"logout",size:15}), t.signOut)));
}

/* ════════════════════════════════════════════════════════════
   PAGE — JOURNAL
   ════════════════════════════════════════════════════════════ */
function JournalPage(c){
  const {t, lang, attacks, doses, profiles} = c;
  const [filter,setFilter] = useState("all");
  const [q,setQ] = useState("");
  const all = useMemo(()=>buildEvents(attacks,doses),[attacks,doses]);
  const filtered = useMemo(()=>{
    const needle = q.trim().toLowerCase();
    return all.filter(ev=>{
      if(filter==="attacks" && ev.kind!=="attack") return false;
      if(filter==="doses" && ev.kind!=="dose") return false;
      if(!needle) return true;
      const r = ev.raw;
      const hay = [ev.date, r.notes||"", r.dosage||"",
        ev.kind==="attack" ? `${t.sevLabels[r.severity]} ${t.attackEntry}` : `${t.doseEntry} ${r.breaths}`,
        profiles.find(p=>p.id===r.addedBy)?.name||""].join(" ").toLowerCase();
      return hay.includes(needle);
    });
  },[all,filter,q,profiles,t]);

  const groups = useMemo(()=>{
    const m = [];
    filtered.forEach(ev=>{
      const key = ev.date.slice(0,7);
      const last = m[m.length-1];
      if(last && last.key===key) last.items.push(ev);
      else m.push({key, label:fmtMonth(`${key}-01`,lang), items:[ev]});
    });
    return m;
  },[filtered,lang]);

  const dirty = filter!=="all" || q.trim();

  return e("div",{className:"stack",style:{gap:14,maxWidth:900}},
    e("div",{className:"card rise",style:{padding:14}},
      e("div",{className:"input-affix",style:{marginBottom:10}},
        e("span",{className:"ia-ico"}, e(Icon,{name:"search",size:16})),
        e("input",{className:"input",value:q,placeholder:t.searchPlaceholder,type:"search",
          "aria-label":t.searchPlaceholder,onChange:ev=>setQ(ev.target.value)})),
      e("div",{className:"row",style:{gap:10,justifyContent:"space-between",flexWrap:"wrap"}},
        e(Segmented,{value:filter,onChange:setFilter,options:[
          {value:"all",label:t.filterAll},{value:"attacks",label:t.filterAttacks},{value:"doses",label:t.filterDoses}]}),
        e("span",{className:"dim",style:{fontSize:12.5}}, t.entries(filtered.length)))),

    groups.length===0
      ? e("div",{className:"card"},
          e(Empty,{icon: dirty?"search":"journal",
            title: dirty ? t.noResults : t.emptyJournal,
            body: dirty ? t.noResultsSub : t.emptyJournalSub,
            action: dirty
              ? e("button",{className:"btn btn-soft",onClick:()=>{setFilter("all");setQ("");}}, t.clearFilters)
              : e("button",{className:"btn btn-primary",onClick:c.onLogAttack}, e(Icon,{name:"plus",size:16}), t.logAttack)}))
      : groups.map((g,gi)=>e("div",{key:g.key},
          e("div",{className:"month-head"},
            e("span",{className:"mh-t"},g.label),
            e("span",{className:"mh-line"}),
            e("span",{className:"dim",style:{fontSize:11.5}}, g.items.length)),
          e("div",{className:"stack",style:{gap:8}},
            g.items.map((ev,i)=>e("div",{key:`${ev.kind}-${ev.id}`,className:"rise",
              style:{"--d":`${Math.min(280, (gi*3+i)*26)}ms`}},
              e(EventRow,{ev,profiles,lang,t,onEdit:c.onEditEvent,onDelete:c.onDeleteEvent}))))))
  );
}

/* ════════════════════════════════════════════════════════════
   PAGE — TRENDS
   ════════════════════════════════════════════════════════════ */
function TrendsPage(c){
  const {t, lang, attacks, doses} = c;
  const [range,setRange] = useState(90);
  const rangeLabels = {30:t.range30, 90:t.range90, 180:t.range180, 0:t.rangeAll};

  const inA = useMemo(()=>attacks.filter(a=>inRange(a.date,range)).sort((a,b)=>a.date.localeCompare(b.date)),[attacks,range]);
  const prevA = useMemo(()=>range===0?[]:attacks.filter(a=>{
    const d = daysBetween(a.date,today()); return d>=range && d<range*2;
  }),[attacks,range]);
  const inD = useMemo(()=>doses.filter(l=>inRange(l.date,range)),[doses,range]);

  const weeksCount = range===0 ? 16 : clamp(Math.ceil(range/7),4,26);
  const buckets = useMemo(()=>weekBuckets(attacks,weeksCount,lang),[attacks,weeksCount,lang]);
  const heat = useMemo(()=>dayMap(attacks),[attacks]);

  const points = useMemo(()=>inA.map(a=>({
    y:Number(a.duration||0), label:fmt(a.date,lang), full:fmtLong(a.date,lang),
    display:fmtDuration(a.duration), color:SEV_VAR[a.severity],
    note:`${t.sevLabels[a.severity]}${a.notes?` · ${a.notes}`:""}`,
  })),[inA,lang,t]);

  const dist = useMemo(()=>SEVS.map(s=>({
    name:s, label:t.sevLabels[s], color:SEV_VAR[s], value:inA.filter(a=>a.severity===s).length,
  })).filter(x=>x.value>0),[inA,t]);

  const avgD = inA.length ? (inA.reduce((s,a)=>s+Number(a.duration||0),0)/inA.length) : 0;
  const sevN = inA.filter(a=>a.severity==="severe").length;
  const avgB = inD.length ? (inD.reduce((s,l)=>s+Number(l.breaths||0),0)/inD.length) : 0;

  const diff = inA.length - prevA.length;
  const compareText = range===0 ? null
    : diff===0 ? t.compareSame
    : diff<0 ? t.compareLess(Math.abs(diff))
    : t.compareMore(diff);

  const allSortedA = useMemo(()=>[...attacks].sort((a,b)=>a.date.localeCompare(b.date)),[attacks]);
  const lastA = allSortedA[allSortedA.length-1];
  const avgAll = attacks.length ? (attacks.reduce((s,a)=>s+Number(a.duration||0),0)/attacks.length).toFixed(1) : 0;
  const sevAll = attacks.filter(a=>a.severity==="severe").length;

  const observations = [
    lastA && {icon:"calendar", text:t.obs1(Math.max(0,daysBetween(lastA.date,today())), t.sevLabels[lastA.severity].toLowerCase())},
    attacks.length>0 && {icon:"trends", text:t.obs2(avgAll)},
    sevAll>0 && {icon:"alert", text:t.obs3(sevAll)},
    {icon:"wind", text:t.obs4(doses.length)},
  ].filter(Boolean);

  return e("div",{className:"stack",style:{gap:16}},
    e("div",{className:"row rise",style:{justifyContent:"space-between",flexWrap:"wrap",gap:10}},
      e("div",{className:"scroll-x"},
        e(Segmented,{value:range,onChange:setRange,
          options:RANGES.map(r=>({value:r,label:rangeLabels[r]}))}))),

    e("div",{className:"card rise",style:{"--d":"40ms"}},
      e("div",{style:{fontSize:15,lineHeight:1.6,color:"var(--ink-2)"}},
        e("span",{style:{color:"var(--ink)",fontWeight:600}},
          range===0 ? t.inRangeAll(inA.length) : t.inRange(inA.length, rangeLabels[range])),
        compareText && e("span",null, " ", compareText))),

    e("div",{className:"stats rise",style:{"--d":"60ms"}},
      e(StatTile,{label:t.avgDur,value:inA.length?avgD.toFixed(1):"—",unit:inA.length?t.min:"",icon:"clock"}),
      e(StatTile,{label:t.sevEps,value:sevN,icon:"spark",tone:sevN?"var(--sev-severe-ink)":undefined}),
      e(StatTile,{label:t.avgBr,value:inD.length?avgB.toFixed(1):"—",icon:"wind"}),
      e(StatTile,{label:t.totalDoses,value:inD.length,icon:"droplet"})),

    e("div",{className:"card rise",style:{"--d":"100ms"}},
      e(SectionHead,{title:t.weeklyActivity, sub:t.weeklyActivitySub}),
      e(StackedBars,{data:buckets,t,
        onEmpty:e(Empty,{icon:"trends",title:t.notEnoughData,body:t.notEnoughDataSub})}),
      e("div",{className:"chart-legend"},
        SEVS.map(s=>e("span",{key:s,className:"cl"},
          e("span",{className:"dot",style:{background:SEV_VAR[s]}}),
          t.sevLabels[s], e("b",null, buckets.reduce((n,b)=>n+b[s],0)))))),

    e("div",{className:"grid grid-2 rise",style:{"--d":"140ms"}},
      e("div",{className:"card"},
        e(SectionHead,{title:t.durationTrend, sub:rangeLabels[range]}),
        points.length
          ? e(TrendArea,{points,t,unitLabel:""})
          : e(Empty,{icon:"trends",title:t.notEnoughData,body:t.notEnoughDataSub})),

      e("div",{className:"card"},
        e(SectionHead,{title:t.severityMix, sub:rangeLabels[range]}),
        dist.length
          ? e(React.Fragment,null,
              e(Donut,{segments:dist,total:inA.length,centerLabel:t.filterAttacks.toLowerCase(),t}),
              e("div",{className:"chart-legend"},
                dist.map(s=>e("span",{key:s.name,className:"cl"},
                  e("span",{className:"dot",style:{background:s.color}}),
                  s.label, e("b",null, s.value)))))
          : e(Empty,{icon:"trends",title:t.notEnoughData,body:t.notEnoughDataSub}))),

    e("div",{className:"card rise",style:{"--d":"180ms"}},
      e(SectionHead,{title:t.calendarTitle, sub:t.calendarSub}),
      e(CalendarHeat,{days:heat,t,lang})),

    e("div",{className:"rise",style:{"--d":"220ms"}},
      e("div",{className:"eyebrow",style:{marginBottom:10}},t.observations),
      e("div",{className:"card flush"},
        e("div",{className:"list"},
          observations.map((o,i)=>e("div",{key:i,className:"list-row"},
            e("span",{className:"lr-ico"}, e(Icon,{name:o.icon,size:16})),
            e("span",{style:{fontSize:13.5,color:"var(--ink-2)",lineHeight:1.5}}, o.text)))))));
}
