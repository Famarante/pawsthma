/* ════════════════════════════════════════════════════════════
   APP
   ════════════════════════════════════════════════════════════ */
function App(){
  /* ── preferences ── */
  const [lang,setLangState] = useState(()=>{
    try { const v = localStorage.getItem(LANG_KEY); if(v==="en"||v==="pt") return v; } catch {}
    return (navigator.language||"").toLowerCase().startsWith("pt") ? "pt" : "en";
  });
  const setLang = useCallback(l=>{ setLangState(l); try{ localStorage.setItem(LANG_KEY,l); }catch{} },[]);
  const t = T[lang];
  useEffect(()=>{ document.documentElement.lang = lang; },[lang]);

  const [theme,setThemeState] = useState(()=>{ try{ return localStorage.getItem(THEME_KEY) || "auto"; }catch{ return "auto"; } });
  const setTheme = useCallback(v=>{ setThemeState(v); try{ localStorage.setItem(THEME_KEY,v); }catch{} },[]);
  useEffect(()=>{
    const root = document.documentElement;
    if(theme==="auto") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme",theme);
  },[theme]);

  /* ── data / auth state (preserved) ── */
  const [data,setData] = useState(null);
  const [uid,setUid]   = useState(null);
  const [catId,setCatId] = useState(null);
  const [authed,setAuthed] = useState(false);
  const [user,setUser] = useState(null);
  const [userHomes,setUserHomes] = useState([]);
  const [homeNames,setHomeNames] = useState({});
  const [authReady,setAuthReady] = useState(!FB_ON);
  const [activeHome,setActiveHome] = useState(null);
  const [sync,setSync] = useState("loading");
  const [secs,setSecs] = useState(0);
  const [lastSt,setLastSt] = useState(null);
  const [iif,setIif]   = useState(DEFAULT.inhalerInfo);
  const dr = useRef(null);
  const deviceId = useRef(getOrCreateDeviceId()).current;

  /* ── UI state ── */
  const [view,setView] = useState("today");
  const [modal,setModal] = useState(null);       // attack | editAttack | dose | editDose | profiles | invite | cats
  const [quickOpen,setQuickOpen] = useState(false);
  const [confirmState,setConfirmState] = useState(null);
  const [toasts,setToasts] = useState([]);
  const [inviteCode,setInviteCode] = useState(null);
  const [inviteBusy,setInviteBusy] = useState(false);
  const scrolled = useScrolled();

  const [af,setAf] = useState({date:today(),severity:"mild",durationMin:"",durationSec:"0",notes:""});
  const [inf,setInf] = useState({date:today(),breaths:2,dosage:"110mcg"});
  const [editAttackId,setEditAttackId] = useState(null);
  const [editInhalerId,setEditInhalerId] = useState(null);

  const toast = useCallback((msg,tone="ok")=>{
    const id = Math.random().toString(36).slice(2);
    setToasts(ts=>[...ts,{id,msg,tone}]);
    setTimeout(()=>setToasts(ts=>ts.filter(x=>x.id!==id)), 3400);
  },[]);

  /* ── auth observer (preserved) ── */
  useEffect(()=>{
    if(!FB_ON || !fbAuthObserve) return;
    const unsub = fbAuthObserve(u=>{ setUser(u||null); setAuthReady(true); if(!u){ setAuthed(false); setUid(null); setCatId(null); } });
    return ()=>unsub && unsub();
  },[]);

  useEffect(()=>{ if(user?.uid) setUid(user.uid); },[user]);

  useEffect(()=>{
    if(FB_ON && !authReady) return;
    (async()=>{
      if(fbLoadUserMeta && user){
        try{
          const meta = await fbLoadUserMeta(user.uid) || {};
          const linkedHomes = meta.households && typeof meta.households === "object" ? Object.keys(meta.households) : [];
          setUid(user.uid);
          setUserHomes(linkedHomes);
          if (fbLoad && linkedHomes.length){
            Promise.all(linkedHomes.map(async(id)=>{
              try{ const h = await fbLoad(id); return [id, (h?.name||id).toString()]; }
              catch{ return [id, id]; }
            })).then(entries=>setHomeNames(Object.fromEntries(entries)));
          } else setHomeNames({});
          const remembered = getDeviceHome(deviceId);
          const initialHome = linkedHomes.includes(remembered) ? remembered : (linkedHomes[0] || null);
          setActiveHome(initialHome);
          setAuthed(!!initialHome);
          if(initialHome) setDeviceHome(deviceId, initialHome);
          if(!initialHome){
            const empty = { households:{} };
            setData(empty); dr.current=empty;
            setSync("live"); setLastSt(Date.now());
          }
        }catch(err){ console.error(err); }
      }else{
        const saved = normalizeData(lsLoad()||{...DEFAULT});
        setData(saved); dr.current=saved;
        setSync("demo");
      }
    })();
  },[user,authReady,deviceId]);

  useEffect(()=>{
    if(!FB_ON || !fbLoad || !activeHome) return;
    let unsub = null;
    (async()=>{
      try{
        let remoteHome = await fbLoad(activeHome);
        if(!remoteHome){
          const selfProfile = { id:user?.uid||mkId(), name:(user?.displayName||user?.email?.split("@")[0]||"User"), emoji:"🧑", color:PCOLS[0] };
          remoteHome = { ...mkHousehold(activeHome,{name:activeHome,cats:[],profiles:null}), profiles:[selfProfile], memberKeys:{ ...(user?.uid ? { [user.uid]: true } : {}) } };
          await fbSave(activeHome, remoteHome);
        }
        const normalized = normalizeData({ households:{ [activeHome]: remoteHome } });
        setData(normalized); dr.current=normalized;
        setSync("live"); setLastSt(Date.now());
        unsub = fbSubscribe(activeHome, inc=>{
          const n = normalizeData({ households:{ [activeHome]: inc } });
          setData(n); dr.current=n;
          setSync("updated"); setLastSt(Date.now());
          setTimeout(()=>setSync("live"),2500);
        });
      } catch(err){ console.error(err); setSync("error"); }
    })();
    return ()=>{ if(unsub) unsub(); };
  },[activeHome]);

  useEffect(()=>{
    const id=setInterval(()=>{
      if(lastSt&&sync==="live"){
        const s=Math.floor((Date.now()-lastSt)/1000);
        setSecs(s); if(s>8)setSync("synced");
      }
    },1000);
    return()=>clearInterval(id);
  },[lastSt,sync]);

  /* ── derived household/cat (preserved) ── */
  const homes = data?.households || {};
  const homeKeys = Object.keys(homes);
  const homeKey = activeHome && homes[activeHome] ? activeHome : (homeKeys[0] || null);
  const currentHome = homeKey ? homes[homeKey] : null;

  const doSave = async(updater)=>{
    const next=updater(dr.current);
    setData(next); dr.current=next;
    if(fbSave && user){
      setSync("loading");
      const ok=await fbSave(homeKey, next?.households?.[homeKey] || null).catch(()=>false);
      setSync(ok?"live":"error");
      if(ok){setLastSt(Date.now());setSecs(0);}
      else toast(t.syncError,"err");
    }else{ lsSave(next); }
  };

  const handleUserAuth = async(email,password,signup)=>{
    if(!fbSignIn||!fbSignUp) return t.authConfigMissing;
    try{
      if(signup) await fbSignUp(email,password);
      else await fbSignIn(email,password);
      return null;
    }catch(err){
      console.error(err);
      const msg = `${err?.code||""} ${err?.message||""}`;
      if(/CONFIGURATION_NOT_FOUND/i.test(msg)) return t.authConfigMissing;
      if(/auth\/(invalid-credential|wrong-password|user-not-found)/i.test(msg)) return t.authInvalidCreds;
      if(/auth\/weak-password/i.test(msg)) return t.authWeakPassword;
      if(/auth\/operation-not-allowed/i.test(msg)) return t.authConfigMissing;
      return t.authError;
    }
  };
  const logoutUser = async()=>{
    if(fbSignOut) await fbSignOut().catch(()=>null);
    setAuthed(false); setUid(null); setCatId(null); setView("today");
  };

  useEffect(()=>{
    if(!data) return;
    const remembered = getDeviceHome(deviceId);
    if(!authed && remembered && homes[remembered]){ setActiveHome(remembered); setAuthed(true); }
    if(remembered && !homes[remembered]) clearDeviceHome(deviceId);
  },[data,homes,authed,deviceId]);

  useEffect(()=>{
    if(currentHome){
      const chosen = currentHome.cats.find(c=>c.id===catId) || currentHome.cats[0] || null;
      if(chosen){
        setIif(chosen.inhalerInfo);
        if(!catId || !currentHome.cats.some(c=>c.id===catId)) setCatId(chosen.id);
      } else setCatId(null);
    }
  },[currentHome,catId]);

  /* ── household actions (preserved) ── */
  const saveAuth = async(payload) => {
    const profile = { id:user?.uid||mkId(), name:(user?.displayName||user?.email?.split("@")[0]||"User"), emoji:"🧑", color:PCOLS[0] };
    const memberUid = user?.uid || profile.id;
    const linkUserHome = async(id)=>{
      if(!fbSaveUserMeta || !user?.uid){
        setUserHomes(Array.from(new Set([...(userHomes||[]), id])));
        setHomeNames(prev=>({ ...prev, [id]: prev[id] || id }));
        return;
      }
      const nextHomes = Array.from(new Set([...(userHomes||[]), id]));
      const householdsByKey = nextHomes.reduce((acc,h)=>{ acc[h]=true; return acc; }, {});
      await fbSaveUserMeta(user.uid, { households: householdsByKey });
      setUserHomes(nextHomes);
      setHomeNames(prev=>({ ...prev, [id]: prev[id] || id }));
    };
    const attachMember = (home)=>{
      const profiles = Array.isArray(home.profiles) ? home.profiles : [];
      const members = Array.isArray(home.members) ? home.members : [];
      const memberKeys = home.memberKeys && typeof home.memberKeys === "object" ? home.memberKeys : {};
      const nextMembers = members.includes(memberUid)?members:[...members, memberUid];
      return {
        ...home,
        profiles: profiles.some(p=>p.id===profile.id)?profiles:[...profiles, profile],
        members: nextMembers,
        memberKeys: { ...memberKeys, [memberUid]: true }
      };
    };

    if(payload.action==="open"){
      const key = payload.householdId;
      if(FB_ON && fbLoad){
        try{
          const probe = await fbLoad(key);
          if(!probe) return { ok:false, reason:"not-found" };
          const normalized = normalizeData({ households:{ [key]: probe } });
          setData(normalized); dr.current=normalized;
        }catch(err){
          console.error(err);
          return { ok:false, reason:isPermissionErr(err)?"permission":"unknown" };
        }
      }
      setActiveHome(key); setDeviceHome(deviceId,key); setAuthed(true); setCatId(null);
      return { ok:true };
    }

    if(payload.action==="create"){
      const householdId = mkHouseholdId();
      const householdName = payload.householdName || "Home";
      const base = attachMember(mkHousehold(householdName,{name:householdName,cats:[],profiles:null,members:[memberUid]}));
      const nextHome = base;
      const nextData = { households:{ [householdId]: nextHome } };
      if(FB_ON){
        try{ await linkUserHome(householdId); }
        catch(err){ console.error(err); return { ok:false, reason:isPermissionErr(err)?"permission":"unknown" }; }
      }
      if(FB_ON && fbSave){
        try{ await fbSave(householdId, nextHome); }
        catch(err){ console.error(err); return { ok:false, reason:isPermissionErr(err)?"permission":"unknown" }; }
      } else await doSave(d=>({ ...d, households:{...(d?.households||{}), [householdId]: base }}));
      if(!FB_ON){
        try{ await linkUserHome(householdId); }
        catch(err){ console.error(err); return { ok:false, reason:isPermissionErr(err)?"permission":"unknown" }; }
      }
      setData(normalizeData(nextData)); dr.current=normalizeData(nextData);
      setActiveHome(householdId); setDeviceHome(deviceId, householdId); setAuthed(true); setCatId(null);
      return { ok:true };
    }

    if(payload.action==="join"){
      const code = (payload.inviteCode||"").toUpperCase();
      if(!code) return { ok:false, reason:"invalid-invite" };
      let targetId = null;
      if(FB_ON && fbRedeemInvite && user?.uid){
        let red = null;
        try{ red = await fbRedeemInvite({ code, uid:user.uid }); }
        catch(err){ console.error(err); return { ok:false, reason:isPermissionErr(err)?"permission":"unknown" }; }
        if(!red.ok) return { ok:false, reason:red.reason };
        targetId = red.householdId;
      } else {
        const homesLocal = dr.current?.households || {};
        targetId = Object.keys(homesLocal).find(h=>homesLocal[h]?.inviteCode===code) || null;
        if(!targetId) return { ok:false, reason:"not-found" };
      }
      if(!targetId) return { ok:false, reason:"not-found" };
      if(FB_ON){
        try{ await linkUserHome(targetId); }
        catch(err){ console.error(err); return { ok:false, reason:isPermissionErr(err)?"permission":"unknown" }; }
      }
      let remoteHome = dr.current?.households?.[targetId] || null;
      if(FB_ON && fbLoad){
        try{ remoteHome = await fbLoad(targetId); }
        catch(err){ console.error(err); return { ok:false, reason:isPermissionErr(err)?"permission":"unknown" }; }
      }
      if(!remoteHome) return { ok:false, reason:"not-found" };
      const normalized = normalizeData({ households:{ [targetId]: remoteHome } });
      const home = normalized.households?.[targetId];
      if(!home) return { ok:false, reason:"not-found" };
      const updatedHome = attachMember(home);
      const payloadData = { households:{ [targetId]: updatedHome } };
      if(FB_ON && fbSave){
        try{ await fbSave(targetId, updatedHome); }
        catch(err){ console.error(err); return { ok:false, reason:isPermissionErr(err)?"permission":"unknown" }; }
      }
      else await doSave(d=>({ ...d, households:{...d.households,[targetId]:updatedHome} }));
      if(!FB_ON){
        try{ await linkUserHome(targetId); }
        catch(err){ console.error(err); return { ok:false, reason:isPermissionErr(err)?"permission":"unknown" }; }
      }
      setData(normalizeData(payloadData)); dr.current=normalizeData(payloadData);
      setActiveHome(targetId); setDeviceHome(deviceId, targetId); setAuthed(true); setCatId(null);
      return { ok:true };
    }

    return { ok:false, reason:"unknown" };
  };

  const gateSubmit = async(payload)=>{
    const res = await saveAuth(payload);
    if(res.ok) return null;
    if(res.reason==="not-found"||res.reason==="invalid-invite") return t.inviteInvalid;
    if(res.reason==="used") return t.inviteUsed;
    if(res.reason==="expired") return t.inviteExpired;
    return res.reason==="permission" ? t.householdAccessDenied : t.authError;
  };

  const createInvite = async()=>{
    if(!homeKey) return;
    setInviteBusy(true);
    const code = mkInviteCode();
    const expiresAt = Date.now() + 7*24*60*60*1000;
    try{
      if(FB_ON && fbCreateInvite && user?.uid) await fbCreateInvite({ code, householdId:homeKey, createdBy:user.uid, createdAt:Date.now(), expiresAt });
      else await doSave(d=>({...d,households:{...d.households,[homeKey]:{...d.households[homeKey],inviteCode:code}}}));
      setInviteCode(code);
      toast(t.inviteCreated);
    }catch(err){
      console.error(err);
      toast(t.inviteCreateFailed,"err");
    }
    setInviteBusy(false);
  };
  const copyInvite = async()=>{
    if(!inviteCode) return;
    try{ await navigator.clipboard.writeText(inviteCode); toast(t.inviteCopied); }
    catch{ toast(inviteCode,"warn"); }
  };
  const openInvite = async()=>{
    setModal("invite");
    setInviteCode(currentHome?.inviteCode || null);
    if(FB_ON) await createInvite();
  };

  /* ── mutations (preserved) ── */
  const mutateCat = (fn) => doSave(d=>({...d,households:{...d.households,[homeKey]:{
    ...d.households[homeKey],
    cats:d.households[homeKey].cats.map(c=>c.id===catId?fn(c):c)}}}));

  const addAttack=async()=>{
    const mins=Math.max(0,Number(af.durationMin||0));
    const s=clamp(Number(af.durationSec||0),0,59);
    const duration=(mins*60+s)/60;
    if(duration<=0 || !catId || !homeKey) return;
    await mutateCat(c=>({...c,attacks:[...c.attacks,{id:nextId(c.attacks),date:af.date,severity:af.severity,duration,notes:af.notes,addedBy:uid}]}));
    setModal(null); setAf({date:today(),severity:"mild",durationMin:"",durationSec:"0",notes:""});
    toast(t.attackSaved);
  };
  const saveEditedAttack=async()=>{
    const mins=Math.max(0,Number(af.durationMin||0));
    const s=clamp(Number(af.durationSec||0),0,59);
    const duration=(mins*60+s)/60;
    if(duration<=0 || !catId || !homeKey || editAttackId==null) return;
    await mutateCat(c=>({...c,attacks:c.attacks.map(a=>a.id===editAttackId?{...a,date:af.date,severity:af.severity,duration,notes:af.notes}:a)}));
    setModal(null); setEditAttackId(null);
    setAf({date:today(),severity:"mild",durationMin:"",durationSec:"0",notes:""});
    toast(t.attackUpdated);
  };
  const deleteAttack=async(id)=>{
    if(!catId || !homeKey) return;
    await mutateCat(c=>({...c,attacks:c.attacks.filter(a=>a.id!==id)}));
    toast(t.attackDeleted);
  };
  const addInhaler=async()=>{
    if(!catId || !homeKey) return;
    await mutateCat(c=>({...c,inhalerLogs:[...c.inhalerLogs,{...inf,id:nextId(c.inhalerLogs),breaths:Math.max(1,Number(inf.breaths)||1),addedBy:uid}]}));
    setModal(null);
    toast(t.doseSaved);
  };
  const saveEditedInhaler=async()=>{
    if(!catId || !homeKey || editInhalerId==null) return;
    await mutateCat(c=>({...c,inhalerLogs:c.inhalerLogs.map(l=>l.id===editInhalerId?{...l,date:inf.date,breaths:Math.max(1,Number(inf.breaths)||1),dosage:inf.dosage}:l)}));
    setModal(null); setEditInhalerId(null);
    setInf({date:today(),breaths:2,dosage:currentCat?.inhalerInfo?.dosage||"110mcg"});
    toast(t.doseUpdated);
  };
  const deleteInhaler=async(id)=>{
    if(!catId || !homeKey) return;
    await mutateCat(c=>({...c,inhalerLogs:c.inhalerLogs.filter(l=>l.id!==id)}));
    toast(t.doseDeleted);
  };
  const saveII=async()=>{
    if(!homeKey || !catId) return;
    await mutateCat(c=>({...c,inhalerInfo:{...iif, cleaningIntervalDays:Math.max(1,Number(iif.cleaningIntervalDays)||1)}}));
    toast(t.settingsSaved);
  };
  const markCleaned=async()=>{
    if(!homeKey || !catId) return;
    const next = {...iif, lastCleaned:today()};
    setIif(next);
    await mutateCat(c=>({...c,inhalerInfo:{...c.inhalerInfo, lastCleaned:today()}}));
    toast(t.cleanedToast);
  };
  const saveProfiles=async(ps)=>{
    if(!homeKey) return;
    await doSave(d=>({...d,households:{...d.households,[homeKey]:{...d.households[homeKey],profiles:ps}}}));
    setModal(null); toast(t.profilesSaved);
  };
  const addCat=async(name)=>{
    if(!homeKey) return;
    const id = `c${Date.now().toString(36).slice(-5)}`;
    await doSave(d=>({...d,households:{...d.households,[homeKey]:{...d.households[homeKey],
      cats:[...d.households[homeKey].cats, mkCat(d.households[homeKey].cats.length,name,{id,name})]}}}));
    setCatId(id); toast(t.catAdded);
  };

  /* ── profile linking (preserved) ── */
  const authProfile = { id:user?.uid||mkId(), name:(user?.displayName||user?.email?.split("@")[0]||"User"), emoji:"🧑", color:PCOLS[0] };
  const profilesRaw=currentHome?.profiles;
  const profiles=Array.isArray(profilesRaw) ? profilesRaw : (user?.uid ? [authProfile] : null);
  const cats=currentHome?.cats||[];
  const currentCat=cats.find(c=>c.id===catId)||null;

  useEffect(()=>{
    if(!homeKey || !user?.uid || !currentHome) return;
    const existing = Array.isArray(currentHome.profiles) ? currentHome.profiles : [];
    const existingMembers = Array.isArray(currentHome.members) ? currentHome.members : [];
    const existingMemberKeys = currentHome.memberKeys && typeof currentHome.memberKeys === "object" ? currentHome.memberKeys : {};
    if(existing.some(p=>p.id===user.uid) && existingMembers.includes(user.uid) && existingMemberKeys[user.uid]===true) return;
    doSave(d=>{
      const latest = Array.isArray(d.households?.[homeKey]?.profiles) ? d.households[homeKey].profiles : [];
      const latestMembers = Array.isArray(d.households?.[homeKey]?.members) ? d.households[homeKey].members : [];
      const latestMemberKeys = d.households?.[homeKey]?.memberKeys && typeof d.households[homeKey].memberKeys === "object" ? d.households[homeKey].memberKeys : {};
      if(latest.some(p=>p.id===user.uid) && latestMembers.includes(user.uid) && latestMemberKeys[user.uid]===true) return d;
      return ({
        ...d,
        households:{
          ...d.households,
          [homeKey]:{
            ...d.households[homeKey],
            profiles: latest.some(p=>p.id===user.uid) ? latest : [...latest,{ id:user.uid, name:(user?.displayName||user?.email?.split("@")[0]||"User"), emoji:"🧑", color:PCOLS[0] }],
            members: latestMembers.includes(user.uid) ? latestMembers : [...latestMembers, user.uid],
            memberKeys: { ...latestMemberKeys, [user.uid]: true }
          }
        }
      });
    });
  },[homeKey,user?.uid,currentHome]);

  /* Without Firebase Auth there is no signed-in identity, so entries would be
     logged with no author. Fall back to the first household profile. */
  useEffect(()=>{
    if(FB_ON || uid) return;
    const first = Array.isArray(currentHome?.profiles) ? currentHome.profiles[0] : null;
    if(first?.id) setUid(first.id);
  },[currentHome,uid]);

  /* ── event handlers shared by pages ── */
  const openAttack = useCallback(()=>{
    setAf({date:today(),severity:"mild",durationMin:"",durationSec:"0",notes:""});
    setEditAttackId(null); setModal("attack");
  },[]);
  const openDose = useCallback(()=>{
    setInf({date:today(),breaths:2,dosage:currentCat?.inhalerInfo?.dosage||"110mcg"});
    setEditInhalerId(null); setModal("dose");
  },[currentCat]);

  const onEditEvent = useCallback((ev)=>{
    if(ev.kind==="attack"){
      const a = ev.raw;
      const totalSec = Math.max(0,Math.round(Number(a.duration||0)*60));
      setAf({
        date:a.date||today(),
        severity:SEVS.includes(a.severity)?a.severity:"mild",
        durationMin:String(Math.floor(totalSec/60)),
        durationSec:String(totalSec%60),
        notes:a.notes||"",
      });
      setEditAttackId(a.id); setModal("editAttack");
    } else {
      const l = ev.raw;
      setInf({date:l.date||today(),breaths:Math.max(1,Number(l.breaths)||1),dosage:l.dosage||""});
      setEditInhalerId(l.id); setModal("editDose");
    }
  },[]);

  const onDeleteEvent = useCallback((ev)=>{
    const isAttack = ev.kind==="attack";
    setConfirmState({
      title: isAttack ? t.confirmDeleteAttackT : t.confirmDeleteDoseT,
      body: isAttack ? t.confirmDeleteAttackB : t.confirmDeleteDoseB,
      confirmLabel: t.del, tone:"danger",
      onConfirm: async()=>{ setConfirmState(null); isAttack ? await deleteAttack(ev.id) : await deleteInhaler(ev.id); },
    });
  },[t,catId,homeKey]);

  const switchHousehold = useCallback(()=>{
    clearDeviceHome(deviceId);
    setAuthed(false); setUid(null); setCatId(null); setActiveHome(null); setView("today");
  },[deviceId]);

  /* ═══════════ render gates ═══════════ */
  if(FB_ON && !authReady) return e(LoadingScreen,{label:null});
  if(FB_ON && authReady && !user) return e(AuthGate,{lang,setLang,onAuth:handleUserAuth});
  if(!data) return e(LoadingScreen,{label:null});

  if(!authed || !currentHome) return e(LoginGate,{lang,setLang,
    account:user?.email||user?.displayName||"",
    householdOptions:userHomes.map(id=>({id,label:homeNames[id]||id})),
    onSubmit:gateSubmit,
    onSignOut:FB_ON?logoutUser:null});

  if(cats.length===0) return e(CatSetupScreen,{lang,setLang,onSave:async(name)=>{
    if(!homeKey) return;
    const id = `c${Date.now().toString(36).slice(-5)}`;
    await doSave(d=>({...d,households:{...d.households,[homeKey]:{...d.households[homeKey],cats:[mkCat(0,name,{id,name})]}}}));
    setCatId(id);
  }});

  if(!currentCat) return e(CatPicker,{lang,setLang,cats,onChoose:setCatId,onAdd:addCat});

  if((!profiles || profiles.length===0) && FB_ON && user?.uid) return e(LoadingScreen,{label:t.profileLinking});
  if(!profiles || profiles.length===0) return e(SetupScreen,{lang,setLang,
    onSave:ps=>homeKey&&doSave(d=>({...d,households:{...d.households,[homeKey]:{...d.households[homeKey],profiles:ps}}}))});

  /* ═══════════ main app ═══════════ */
  const attacks = Array.isArray(currentCat.attacks) ? currentCat.attacks : [];
  const doses = Array.isArray(currentCat.inhalerLogs) ? currentCat.inhalerLogs : [];
  const me = profiles.find(p=>p.id===uid) || {id:uid,name:(user?.displayName||user?.email?.split("@")[0]||"User"),emoji:"🧑",color:PCOLS[0]};
  const others = profiles.filter(p=>p.id!==uid);
  const interval = Math.max(1, Number(currentCat.inhalerInfo.cleaningIntervalDays)||1);
  const ds = Math.max(0, daysBetween(currentCat.inhalerInfo.lastCleaned, today()));
  const overdue = ds >= interval;
  const soon = !overdue && ds >= interval - 3;
  const recentDosages = [...new Set(doses.map(l=>l.dosage).filter(Boolean))].slice(-4).reverse();

  const ctx = {
    t, lang, setLang, theme, setTheme,
    cat:currentCat, attacks, doses, profiles, others, me, uid,
    home:currentHome, cats, sync, secs, account:user?.email||user?.displayName||"",
    ds, interval, overdue, soon, iif, setIif,
    go:setView, setCatId,
    onLogAttack:openAttack, onLogDose:openDose, onClean:markCleaned,
    onEditEvent, onDeleteEvent, onSaveSettings:saveII,
    onManageProfiles:()=>setModal("profiles"),
    onOpenCats:()=>setModal("cats"),
    onInvite:openInvite,
    onSwitchHousehold:switchHousehold,
    onSignOut:logoutUser,
  };

  const PAGES = {today:TodayPage, journal:JournalPage, trends:TrendsPage, care:CarePage, settings:SettingsPage};
  const Page = PAGES[view] || TodayPage;
  const pageTitle = view==="today" ? currentCat.name : t.nav[view];
  const pageSub = {today:t.tagline, journal:t.journalSub, trends:t.trendsSub, care:t.careSub, settings:null}[view];
  const counts = {journal:attacks.length+doses.length, care:doses.length};

  return e("div",{className:"shell"},
    e(Rail,{t,view,go:setView,cat:currentCat,home:currentHome,me,sync,secs,counts,
      onOpenCats:()=>setModal("cats"),
      onManageProfiles:()=>setModal("profiles"),
      onSettings:()=>setView("settings")}),

    e("div",{className:"main"},
      e("header",{className:`topbar${scrolled?" scrolled":""}`},
        e("button",{className:"cat-card hide-desktop",style:{width:"auto",flex:1,minWidth:0,border:"none",background:"transparent",boxShadow:"none",padding:"2px 0"},
          onClick:()=>setModal("cats")},
          e("span",{className:"cat-av",style:{width:36,height:36,flexBasis:36,borderRadius:12}}, e(CatGlyph,{size:19})),
          e("span",{style:{flex:1,minWidth:0,textAlign:"left"}},
            e("span",{className:"cat-name trunc",style:{display:"block"}}, currentCat.name),
            e("span",{className:"cat-sub trunc",style:{display:"block"}}, view==="today" ? t.tagline : t.nav[view])),
          e(Icon,{name:"chevD",size:15,style:{color:"var(--ink-3)"}})),

        e("div",{className:"hide-mobile",style:{minWidth:0}},
          e("div",{className:"topbar-title trunc"}, pageTitle),
          pageSub && e("div",{className:"cat-sub trunc"}, pageSub)),
        e("div",{className:"topbar-spacer"}),

        e("div",{className:"row hide-mobile",style:{gap:8}},
          e("button",{className:"btn btn-soft btn-sm",onClick:openDose},
            e(Icon,{name:"wind",size:15}), t.logDose),
          e("button",{className:"btn btn-primary btn-sm",onClick:openAttack},
            e(Icon,{name:"plus",size:15}), t.logAttack)),

        e("button",{className:"icon-btn hide-desktop",onClick:()=>setView("settings"),"aria-label":t.nav.settings},
          e(Icon,{name:"settings",size:19}))),

      e("main",{className:"page",key:view},
        e("div",{className:"hide-desktop",style:{marginBottom:14}},
          view!=="today" && e("div",null,
            e("h1",{className:"display d-md"}, t.nav[view]),
            pageSub && e("div",{className:"card-sub",style:{marginTop:3}}, pageSub))),
        e(Page,ctx))),

    e(TabBar,{t,view,go:setView,quickOpen,setQuickOpen}),
    quickOpen && e(QuickMenu,{t,onAttack:openAttack,onDose:openDose,onClean:markCleaned,
      onClose:()=>setQuickOpen(false)}),

    (modal==="attack"||modal==="editAttack") && e(AttackSheet,{lang,form:af,setForm:setAf,
      editing:modal==="editAttack",
      onSave:modal==="editAttack"?saveEditedAttack:addAttack,
      onClose:()=>{setModal(null);setEditAttackId(null);}}),

    (modal==="dose"||modal==="editDose") && e(DoseSheet,{lang,form:inf,setForm:setInf,
      editing:modal==="editDose",recentDosages,
      onSave:modal==="editDose"?saveEditedInhaler:addInhaler,
      onClose:()=>{setModal(null);setEditInhalerId(null);}}),

    modal==="profiles" && e(ProfilesSheet,{lang,profiles,onSave:saveProfiles,onClose:()=>setModal(null)}),

    modal==="cats" && e(CatSheet,{lang,cats,catId,onChoose:setCatId,onAdd:addCat,onClose:()=>setModal(null)}),

    modal==="invite" && e(InviteSheet,{lang,code:inviteCode,busy:inviteBusy,
      onRegenerate:createInvite,onCopy:copyInvite,onClose:()=>setModal(null)}),

    confirmState && e(ConfirmDialog,{...confirmState,cancelLabel:t.cancel,onCancel:()=>setConfirmState(null)}),

    e(Toasts,{items:toasts}));
}

createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
