  <style>
    :root{
      --bg:#070b16; --bg2:#0b1120;
      --surface:rgba(255,255,255,.045); --surface2:rgba(255,255,255,.08);
      --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.18);
      --amber:#f5a623; --amber2:#e8890c; --coral:#ff6b6b; --mint:#4ecdc4;
      --text:#f0ece4; --sub:rgba(240,236,228,.65); --muted:rgba(240,236,228,.45);
      --r-lg:20px; --r-md:14px; --r-sm:10px;
      --shadow:0 14px 40px rgba(0,0,0,.4);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    html,body{min-height:100%;color:var(--text);font-family:'DM Sans',sans-serif}
    body{
      background:
        radial-gradient(1100px 620px at 88% -12%, rgba(245,166,35,.08), transparent 62%),
        radial-gradient(900px 600px at -12% 112%, rgba(78,205,196,.07), transparent 62%),
        linear-gradient(180deg,var(--bg2),var(--bg) 60%);
      background-color:var(--bg);
      background-attachment:fixed;
    }
    #root{min-height:100vh}
    ::selection{background:rgba(245,166,35,.35)}
    ::-webkit-scrollbar{width:0;height:0}

    button{font-family:inherit}
    input,textarea,select{
      width:100%;padding:12px 14px;border-radius:var(--r-md);
      border:1px solid var(--border);background:rgba(255,255,255,.05);
      color:var(--text);font-size:15px;font-family:inherit;outline:none;
      transition:border-color .18s,box-shadow .18s,background .18s;
    }
    input::placeholder,textarea::placeholder{color:var(--muted)}
    input:focus,textarea:focus{border-color:rgba(245,166,35,.55);box-shadow:0 0 0 3px rgba(245,166,35,.14);background:rgba(255,255,255,.07)}
    input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.7)}
    button:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}

    .shell{width:100%;max-width:520px;margin:0 auto;padding-left:16px;padding-right:16px}
    .content{padding-top:20px;padding-bottom:calc(108px + env(safe-area-inset-bottom))}

    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
    .label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:600}
    .sec{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:12px}
    .empty{text-align:center;padding:42px 18px;color:var(--muted);font-size:13px;line-height:1.7;border:1.5px dashed var(--border);border-radius:var(--r-lg)}
    .empty .big{font-size:34px;display:block;margin-bottom:10px}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--r-md);padding:13px 18px;font-weight:700;font-size:15px;cursor:pointer;transition:transform .15s,box-shadow .2s,filter .2s,background .2s,color .2s}
    .btn:active{transform:scale(.97)}
    .btn.block{width:100%}
    .btn-amber{background:linear-gradient(135deg,var(--amber),var(--amber2));color:#0a0f1e;box-shadow:0 6px 22px rgba(245,166,35,.3)}
    .btn-mint{background:linear-gradient(135deg,var(--mint),#3ab0a8);color:#062420;box-shadow:0 6px 22px rgba(78,205,196,.22)}
    .btn-coral{background:linear-gradient(135deg,var(--coral),#e85555);color:#fff;box-shadow:0 6px 22px rgba(255,107,107,.28)}
    .btn-amber:hover,.btn-mint:hover,.btn-coral:hover{filter:brightness(1.08)}
    .btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--sub)}
    .btn-ghost:hover{background:rgba(255,255,255,.1);color:var(--text)}

    .hdr{position:sticky;top:0;z-index:90;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);background:rgba(8,12,23,.84);border-bottom:1px solid var(--border)}

    .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:100;display:flex;justify-content:center;gap:4px;background:rgba(8,12,23,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
    .tab{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border:none;background:none;color:var(--muted);border-radius:12px;cursor:pointer;transition:color .2s,background .2s}
    .tab .ti{font-size:18px;line-height:1}
    .tab .tl{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
    .tab.active{color:var(--amber);background:rgba(245,166,35,.1)}

    .dash{display:grid;gap:16px;grid-template-columns:1fr}
    .log-list{display:grid;gap:10px;grid-template-columns:1fr}
    .stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

    .overlay{position:fixed;inset:0;background:rgba(4,7,15,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;justify-content:center}
    .sheet{background:linear-gradient(180deg,#131a2b,#0d1322);border:1px solid var(--border);border-bottom:none;border-radius:26px 26px 0 0;width:100%;max-width:540px;max-height:88vh;overflow-y:auto;padding:26px 20px calc(40px + env(safe-area-inset-bottom));animation:slideUp .38s cubic-bezier(.22,1,.36,1) both}

    @media(min-width:640px){
      .overlay{align-items:center;padding:24px}
      .sheet{border-radius:24px;border-bottom:1px solid var(--border);padding-bottom:30px;box-shadow:var(--shadow);animation:popIn .3s cubic-bezier(.22,1,.36,1) both}
    }
    @media(min-width:768px){
      .shell{max-width:1024px;padding-left:24px;padding-right:24px}
      .content{padding-top:28px;padding-bottom:56px}
      .tabbar{position:static;background:transparent;border-top:none;backdrop-filter:none;padding:20px 0 0}
      .tab{flex:0 0 auto;flex-direction:row;gap:8px;padding:9px 20px;border-radius:999px;border:1.5px solid transparent}
      .tab .ti{font-size:15px}
      .tab .tl{font-size:12px}
      .tab.active{border-color:rgba(245,166,35,.35);background:rgba(245,166,35,.12)}
      .qa{max-width:560px;margin-left:auto;margin-right:auto}
      .dash{grid-template-columns:1fr 1fr;gap:20px}
      .dash .span2{grid-column:1/-1}
      .log-list{grid-template-columns:1fr 1fr;gap:14px}
    }

    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes popIn{from{transform:scale(.95) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .fu{animation:fadeUp .4s cubic-bezier(.22,1,.36,1) both}
    .su{animation:slideUp .38s cubic-bezier(.22,1,.36,1) both}
    .blink{animation:blink 1.4s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }

const FB_ON = FIREBASE_CONFIG.apiKey !== "PASTE_YOUR_API_KEY_HERE";
let fbLoad = null, fbSave = null, fbSubscribe = null, fbLoadUserMeta = null, fbSaveUserMeta = null;
let fbCreateInvite = null, fbRedeemInvite = null;
let fbAuthObserve = null, fbSignIn = null, fbSignUp = null, fbSignOut = null;

if (FB_ON) {
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const { getDatabase, ref, get, set, onValue, update } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");
    const { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
    const app = initializeApp(FIREBASE_CONFIG);
    const db  = getDatabase(app);
    const auth = getAuth(app);
    const userRef = (uid) => ref(db, `pawsthma/users/${uid}`);
    const homeRef = (key) => ref(db, `pawsthma/households/${key}`);
    const inviteRef = (code) => ref(db, `pawsthma/invites/${code}`);
    fbLoadUserMeta = async (uid) => { const s = await get(userRef(uid)); return s.val(); };
    fbSaveUserMeta = async (uid, meta) => { await update(userRef(uid), meta); return true; };
    fbLoad      = async (key) => { const s = await get(homeRef(key)); return s.val(); };
    fbSave      = async (key,d) => { await set(homeRef(key), d); return true; };
    fbSubscribe = (key,cb) => onValue(homeRef(key), s => { const v = s.val(); if (v) cb(v); });
    fbCreateInvite = async ({code, householdId, createdBy, createdAt, expiresAt}) => {
      await set(inviteRef(code), { code, householdId, createdBy, createdAt, expiresAt, usedBy:null, usedAt:null });
      return true;
    };
    fbRedeemInvite = async ({code, uid}) => {
      const snap = await get(inviteRef(code));
      const invite = snap.val();
      if(!invite) return { ok:false, reason:"not-found" };
      if(invite.usedBy) return { ok:false, reason:"used" };
      if(invite.expiresAt && Date.now() > invite.expiresAt) return { ok:false, reason:"expired" };
      await update(inviteRef(code), { usedBy:uid, usedAt:Date.now() });
      return { ok:true, householdId:invite.householdId };
    };
    fbAuthObserve = (cb) => onAuthStateChanged(auth, cb);
    fbSignIn = async (email,password) => signInWithEmailAndPassword(auth, email, password);
    fbSignUp = async (email,password) => createUserWithEmailAndPassword(auth, email, password);
    fbSignOut = async () => signOut(auth);
    console.log("Firebase connected");
  } catch (e) { console.error("Firebase error:", e); }
}

const LS = "pawsthma_v3";
const isPermissionErr = (err) => /permission|denied|auth\/unauthorized|PERMISSION_DENIED/i.test(`${err?.code||""} ${err?.message||""}`);
const lsLoad = () => { try { const v = localStorage.getItem(LS); return v ? JSON.parse(v) : null; } catch { return null; } };
const lsSave = (d) => { try { localStorage.setItem(LS, JSON.stringify(d)); } catch {} };
const DEV_ID_KEY = "pawsthma_device_id";
const DEV_HOME_MAP = "pawsthma_device_households";
const getOrCreateDeviceId = () => {
  try {
    let id = localStorage.getItem(DEV_ID_KEY);
    if (!id) {
      id = (globalThis.crypto?.randomUUID?.() || `dev_${Math.random().toString(36).slice(2,12)}`);
      localStorage.setItem(DEV_ID_KEY, id);
    }
    return id;
  } catch {
    return "device_fallback";
  }
};
const loadDeviceHomes = () => {
  try { return JSON.parse(localStorage.getItem(DEV_HOME_MAP) || "{}"); } catch { return {}; }
};
const getDeviceHome = (deviceId) => loadDeviceHomes()[deviceId] || null;
const setDeviceHome = (deviceId, homeKey) => {
  try {
    const map = loadDeviceHomes();
    map[deviceId] = homeKey;
    localStorage.setItem(DEV_HOME_MAP, JSON.stringify(map));
  } catch {}
};
const clearDeviceHome = (deviceId) => {
  try {
    const map = loadDeviceHomes();
    delete map[deviceId];
    localStorage.setItem(DEV_HOME_MAP, JSON.stringify(map));
  } catch {}
};

const e = React.createElement;
const today = () => new Date().toISOString().split("T")[0];
const parseLocalDate = (value) => {
  if (value instanceof Date) return new Date(value.getFullYear(), value.getMonth(), value.getDate());
  if (typeof value !== "string") return new Date(value);
  const m = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return new Date(value);
  const year = Number(m[1]);
  const month = Number(m[2]);
  const day = Number(m[3]);
  return new Date(year, month - 1, day);
};
const fmtLocalDateKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmt = (d,lang) => parseLocalDate(d).toLocaleDateString(lang==="pt"?"pt-PT":"en-GB",{day:"numeric",month:"short"});
const fmtWeekRange = (startKey,lang) => {
  const start = parseLocalDate(startKey);
  const end = new Date(start);
  end.setDate(end.getDate()+6);
  return `${fmt(start,lang)}–${fmt(end,lang)}`;
};
const fmtDuration = (minutes,lang) => {
  const totalSec = Math.max(0, Math.round(Number(minutes||0)*60));
  const mins = Math.floor(totalSec/60);
  const secs = totalSec%60;
  if (!secs) return lang==="pt" ? `${mins} min` : `${mins} min`;
  return `${mins}m ${secs}s`;
};
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
const nextId = (arr) => arr.length ? Math.max(...arr.map(x=>x.id))+1 : 1;
const mkId = () => "p"+Math.random().toString(36).slice(2,7);
const mkHouseholdId = () => (globalThis.crypto?.randomUUID?.() || `h_${Math.random().toString(36).slice(2,12)}${Math.random().toString(36).slice(2,6)}`).replace(/-/g,"").slice(0,16);
const mkInviteCode = () => Math.random().toString(36).slice(2,6).toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
const normProfiles = (profiles) => {
  if (!Array.isArray(profiles)) return null;
  return profiles
    .filter(Boolean)
    .map((p,idx)=>({
      id: typeof p.id === "string" && p.id ? p.id : mkId(),
      name: (p.name||"").toString(),
      emoji: p.emoji || EMOJIS[idx%EMOJIS.length],
      color: p.color || PCOLS[idx%PCOLS.length],
    }));
};
const normMembers = (members) => {
  if (!Array.isArray(members)) return [];
  return [...new Set(
    members
      .map((m)=>typeof m === "string" ? m : m?.uid)
      .filter((uid)=>typeof uid === "string" && uid.trim())
  )];
};
const normMemberKeys = (memberKeys, members=[]) => {
  if (memberKeys && typeof memberKeys === "object" && !Array.isArray(memberKeys)) {
    return Object.entries(memberKeys).reduce((acc,[uid,val])=>{
      if (uid && val===true) acc[uid]=true;
      return acc;
    },{});
  }
  return members.reduce((acc,uid)=>{ acc[uid]=true; return acc; },{});
};
const mkCat = (idx,name,data={}) => ({
  id: data.id || `c${idx+1}`,
  name: (name || data.name || `Cat ${idx+1}`).toString(),
  attacks: Array.isArray(data.attacks) ? data.attacks : [],
  inhalerLogs: Array.isArray(data.inhalerLogs) ? data.inhalerLogs : [],
  inhalerInfo: { ...DEFAULT.inhalerInfo, ...(data.inhalerInfo || {}) },
});
const mkHousehold = (name,data={}) => ({
  id: (data.id || mkHouseholdId()).toString(),
  name: (name || data.name || "Home").toString(),
  inviteCode: (data.inviteCode || mkInviteCode()).toString().toUpperCase(),
  profiles: normProfiles(data.profiles),
  members: normMembers(data.members),
  memberKeys: normMemberKeys(data.memberKeys, normMembers(data.members)),
  cats: Array.isArray(data.cats) ? data.cats.map((c,idx)=>mkCat(idx,c?.name,c)) : [],
});
const normalizeData = (raw) => {
  const src = raw && typeof raw === "object" ? raw : {};
  const homes = src.households && typeof src.households === "object" ? src.households : {};
  return {
    households: Object.entries(homes).reduce((acc,[k,v])=>{
      acc[k] = mkHousehold(v?.name || k, v || {});
      return acc;
    },{}),
  };
};

        e("span",{style:{display:"flex",alignItems:"center",gap:8}}, e("span",{style:{fontSize:22}},"🐱"), e("span",{style:{fontWeight:600}},c.name||`Cat ${idx+1}`)),
        e("span",{style:{fontSize:12,color:G.muted}},t.catCount((c.attacks||[]).length))
      )),
      e("div",{style:{marginTop:14,padding:12,border:`1px solid ${G.border}`,borderRadius:16,background:G.surface}},
        e("div",{style:{fontSize:12,color:G.muted,marginBottom:8}},t.addNewCat),
        e("div",{style:{display:"flex",gap:8}},
          e("input",{value:name,onChange:ev=>setName(ev.target.value),placeholder:t.catName,style:IS({flex:1})}),
          e("button",{onClick:()=>{ if(name.trim()){ onAdd(name.trim()); setName(""); } },className:"btn btn-mint",style:{padding:"0 16px"}},t.add)
        )
      )
    )
  );
}

function CatSetupScreen({lang,setLang,onSave}){
  const t = T[lang];
  const [name,setName] = useState("");
  const [err,setErr] = useState(null);
  const save = ()=>{
    if(!name.trim()){ setErr(t.firstCatRequired); return; }
    onSave(name.trim());
  };
  return e("div",{style:{background:G.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:16,position:"relative"}},
    setLang && e(LangToggle,{lang,setLang}),
    e("div",{style:{width:"100%",maxWidth:420,background:G.surface,border:`1px solid ${G.border}`,borderRadius:20,padding:20}},
      e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:25,fontWeight:700,textAlign:"center",marginBottom:8}},t.firstCatTitle),
      e("div",{style:{fontSize:13,color:G.muted,textAlign:"center",marginBottom:14}},t.firstCatSub),
      e("input",{value:name,onChange:ev=>{setName(ev.target.value);setErr(null);},placeholder:t.catName,style:IS({marginBottom:12})}),
      err && e("div",{style:{fontSize:12,color:G.coral,marginBottom:10}},err),
      e("button",{onClick:save,className:"btn btn-mint block"},t.saveCat)
    )
  );
}

function WhoBadge({addedBy,profiles}){
  const p = profiles?.find(x=>x.id===addedBy);
  if(!p) return null;
  return e("span",{style:{fontSize:9,fontWeight:700,color:p.color,background:`${p.color}18`,padding:"3px 8px",borderRadius:10,display:"inline-flex",alignItems:"center",gap:3,flexShrink:0}},`${p.emoji} ${p.name}`);
}

const CTip = ({active,payload,label}) => {
  if(!active||!payload?.length) return null;
  return e("div",{style:{background:"rgba(10,15,30,0.95)",border:`1px solid ${G.border}`,borderRadius:12,padding:"10px 14px",fontSize:12,color:G.text}},
    e("div",{style:{color:G.muted,marginBottom:4}},label),
    payload.map(p=>e("div",{key:p.dataKey,style:{color:p.color||G.amber,fontWeight:600}},`${p.name||p.dataKey}: ${p.value}`))
  );
};

function App(){
  const [lang,setLang] = useState("en");
  const t = T[lang];
  const [data,setData] = useState(null);
  const [uid,setUid]   = useState(null);
  const [catId,setCatId] = useState(null);
  const [authed,setAuthed] = useState(false);
  const [user,setUser] = useState(null);
  const [userHomes,setUserHomes] = useState([]);
  const [homeNames,setHomeNames] = useState({});
  const [authReady,setAuthReady] = useState(!FB_ON);
  const [activeHome,setActiveHome] = useState(null);
  const [sync,setSync] = useState("loading");
  const [secs,setSecs] = useState(0);
  const [lastSt,setLastSt] = useState(null);
  const [showMgr,setShowMgr] = useState(false);
  const [tab,setTab]   = useState("dashboard");
  const [modal,setModal] = useState(null);
  const [aKey,setAKey] = useState(0);
  const [af,setAf]     = useState({date:today(),severity:"mild",durationMin:"",durationSec:"0",notes:""});
  const [inf,setInf]   = useState({date:today(),breaths:2,dosage:"110mcg"});
  const [editAttackId,setEditAttackId] = useState(null);
  const [editInhalerId,setEditInhalerId] = useState(null);
  const [iif,setIif]   = useState(DEFAULT.inhalerInfo);
  const dr = useRef(null);
  const deviceId = useRef(getOrCreateDeviceId()).current;

  useEffect(()=>{
    if(!FB_ON || !fbAuthObserve) return;
    const unsub = fbAuthObserve(u=>{ setUser(u||null); setAuthReady(true); if(!u){ setAuthed(false); setUid(null); setCatId(null); } });
    return ()=>unsub && unsub();
  },[]);

  useEffect(()=>{ if(user?.uid) setUid(user.uid); },[user]);

  useEffect(()=>{
    if(FB_ON && !authReady) return;
    (async()=>{
      if(fbLoadUserMeta && user){
        try{
          const meta = await fbLoadUserMeta(user.uid) || {};
          const linkedHomes = meta.households && typeof meta.households === "object" ? Object.keys(meta.households) : [];
          setUid(user.uid);
          setUserHomes(linkedHomes);
          if (fbLoad && linkedHomes.length){
            Promise.all(linkedHomes.map(async(id)=>{
              try{ const h = await fbLoad(id); return [id, (h?.name||id).toString()]; }
              catch{ return [id, id]; }
            })).then(entries=>setHomeNames(Object.fromEntries(entries)));
          } else {
            setHomeNames({});
          }
          const remembered = getDeviceHome(deviceId);
          const initialHome = linkedHomes.includes(remembered) ? remembered : (linkedHomes[0] || null);
          setActiveHome(initialHome);
          setAuthed(!!initialHome);
          if(initialHome) setDeviceHome(deviceId, initialHome);
          if(!initialHome){
            const empty = { households:{} };
            setData(empty); dr.current=empty;
            setSync("live"); setLastSt(Date.now());
          }
        }catch(err){
          console.error(err);
        }
      }else{
        const saved = normalizeData(lsLoad()||{...DEFAULT});
        setData(saved); dr.current=saved;
        setSync("demo");
      }
    })();
  },[user,authReady,deviceId]);

  useEffect(()=>{
    if(!FB_ON || !fbLoad || !activeHome) return;
    let unsub = null;
    (async()=>{
      try{
        let remoteHome = await fbLoad(activeHome);
        if(!remoteHome){
          const selfProfile = { id:user?.uid||mkId(), name:(user?.displayName||user?.email?.split("@")[0]||"User"), emoji:"🧑", color:PCOLS[0] };
          remoteHome = { ...mkHousehold(activeHome,{name:activeHome,cats:[],profiles:null}), profiles:[selfProfile], memberKeys:{ ...(user?.uid ? { [user.uid]: true } : {}) } };
          await fbSave(activeHome, remoteHome);
        }
        const normalized = normalizeData({ households:{ [activeHome]: remoteHome } });
        setData(normalized); dr.current=normalized;
        setSync("live"); setLastSt(Date.now());
        unsub = fbSubscribe(activeHome, inc=>{
          const n = normalizeData({ households:{ [activeHome]: inc } });
          setData(n); dr.current=n;
          setSync("updated"); setLastSt(Date.now());
          setTimeout(()=>setSync("live"),2500);
        });
      } catch(err){
        console.error(err);
        setSync("error");
      }
    })();
    return ()=>{ if(unsub) unsub(); };
  },[activeHome]);

  useEffect(()=>{
    const id=setInterval(()=>{
      if(lastSt&&sync==="live"){
        const s=Math.floor((Date.now()-lastSt)/1000);
        setSecs(s); if(s>8)setSync("synced");
      }
    },1000);
    return()=>clearInterval(id);
  },[lastSt,sync]);

  const doSave = async(updater)=>{
    const next=updater(dr.current);
    setData(next); dr.current=next;
    if(fbSave && user){
      setSync("loading");
      const ok=await fbSave(homeKey, next?.households?.[homeKey] || null).catch(()=>false);
      setSync(ok?"live":"error");
      if(ok){setLastSt(Date.now());setSecs(0);}
    }else{ lsSave(next); }
  };

  const handleUserAuth = async(email,password,signup)=>{
    if(!fbSignIn||!fbSignUp) return t.authConfigMissing;
    try{
      if(signup) await fbSignUp(email,password);
      else await fbSignIn(email,password);
      return null;
    }catch(err){
      console.error(err);
      const msg = `${err?.code||""} ${err?.message||""}`;
      if(/CONFIGURATION_NOT_FOUND/i.test(msg)) return t.authConfigMissing;
      if(/auth\/(invalid-credential|wrong-password|user-not-found)/i.test(msg)) return t.authInvalidCreds;
      if(/auth\/weak-password/i.test(msg)) return t.authWeakPassword;
      if(/auth\/operation-not-allowed/i.test(msg)) return t.authConfigMissing;
      return t.authError;
    }
  };
  const logoutUser = async()=>{
    if(fbSignOut) await fbSignOut().catch(()=>null);
    setAuthed(false); setUid(null); setCatId(null);
  };

  const homes = data?.households || {};
  const homeKeys = Object.keys(homes);
  const homeKey = activeHome && homes[activeHome] ? activeHome : (homeKeys[0] || null);
  const currentHome = homeKey ? homes[homeKey] : null;

  useEffect(()=>{
    if(!data) return;
    const remembered = getDeviceHome(deviceId);
    if(!authed && remembered && homes[remembered]){
      setActiveHome(remembered);
      setAuthed(true);
    }
    if(remembered && !homes[remembered]) clearDeviceHome(deviceId);
  },[data,homes,authed,deviceId]);

  useEffect(()=>{
    if(currentHome){
      const chosen = currentHome.cats.find(c=>c.id===catId) || currentHome.cats[0] || null;
      if(chosen){
        setIif(chosen.inhalerInfo);
        if(!catId || !currentHome.cats.some(c=>c.id===catId)) setCatId(chosen.id);
      } else {
        setCatId(null);
      }
    }
  },[currentHome,catId]);

  const saveAuth = async(payload) => {
    const profile = { id:user?.uid||mkId(), name:(user?.displayName||user?.email?.split("@")[0]||"User"), emoji:"🧑", color:PCOLS[0] };
    const memberUid = user?.uid || profile.id;
    const linkUserHome = async(id)=>{
      if(!fbSaveUserMeta || !user?.uid){
        setUserHomes(Array.from(new Set([...(userHomes||[]), id])));
        setHomeNames(prev=>({ ...prev, [id]: prev[id] || id }));
        return;
      }
      const nextHomes = Array.from(new Set([...(userHomes||[]), id]));
      const householdsByKey = nextHomes.reduce((acc,h)=>{ acc[h]=true; return acc; }, {});
      await fbSaveUserMeta(user.uid, { households: householdsByKey });
      setUserHomes(nextHomes);
      setHomeNames(prev=>({ ...prev, [id]: prev[id] || id }));
    };
    const attachMember = (home)=>{
      const profiles = Array.isArray(home.profiles) ? home.profiles : [];
      const members = Array.isArray(home.members) ? home.members : [];
      const memberKeys = home.memberKeys && typeof home.memberKeys === "object" ? home.memberKeys : {};
      const nextMembers = members.includes(memberUid)?members:[...members, memberUid];
      return {
        ...home,
        profiles: profiles.some(p=>p.id===profile.id)?profiles:[...profiles, profile],
        members: nextMembers,
        memberKeys: { ...memberKeys, [memberUid]: true }
      };
    };

    if(payload.action==="open"){
      const key = payload.householdId;
      if(FB_ON && fbLoad){
        try{
          const probe = await fbLoad(key);
          if(!probe) return { ok:false, reason:"not-found" };
          const normalized = normalizeData({ households:{ [key]: probe } });
          setData(normalized); dr.current=normalized;
        }catch(err){
          console.error(err);
          return { ok:false, reason:isPermissionErr(err)?"permission":"unknown" };
        }
      }
      setActiveHome(key); setDeviceHome(deviceId,key); setAuthed(true); setCatId(null);
      return { ok:true };
    }

    if(payload.action==="create"){
      const householdId = mkHouseholdId();
      const householdName = payload.householdName || "Home";
      const base = attachMember(mkHousehold(householdName,{name:householdName,cats:[],profiles:null,members:[memberUid]}));
      const nextHome = base;
      const nextData = { households:{ [householdId]: nextHome } };
      if(FB_ON){
        try{ await linkUserHome(householdId); }
        catch(err){
          console.error(err);
          return { ok:false, reason:isPermissionErr(err)?"permission":"unknown" };
        }
      }
      if(FB_ON && fbSave){
        try{ await fbSave(householdId, nextHome); }
        catch(err){
          console.error(err);
          return { ok:false, reason:isPermissionErr(err)?"permission":"unknown" };
        }
      } else await doSave(d=>({ ...d, households:{...(d?.households||{}), [householdId]: base }}));
      if(!FB_ON){
        try{ await linkUserHome(householdId); }
        catch(err){
          console.error(err);
          return { ok:false, reason:isPermissionErr(err)?"permission":"unknown" };
        }
      }
      setData(normalizeData(nextData)); dr.current=normalizeData(nextData);
      setActiveHome(householdId); setDeviceHome(deviceId, householdId); setAuthed(true); setCatId(null);
      return { ok:true };
    }

    if(payload.action==="join"){
      const code = (payload.inviteCode||"").toUpperCase();
      if(!code) return { ok:false, reason:"invalid-invite" };
      let targetId = null;
      if(FB_ON && fbRedeemInvite && user?.uid){
        let red = null;
        try{ red = await fbRedeemInvite({ code, uid:user.uid }); }
        catch(err){
          console.error(err);
          return { ok:false, reason:isPermissionErr(err)?"permission":"unknown" };
        }
        if(!red.ok) return { ok:false, reason:red.reason };
        targetId = red.householdId;
      } else {
        const homesLocal = dr.current?.households || {};
        targetId = Object.keys(homesLocal).find(h=>homesLocal[h]?.inviteCode===code) || null;
        if(!targetId) return { ok:false, reason:"not-found" };
      }
      if(!targetId) return { ok:false, reason:"not-found" };
      if(FB_ON){
        try{ await linkUserHome(targetId); }
        catch(err){
          console.error(err);
          return { ok:false, reason:isPermissionErr(err)?"permission":"unknown" };
        }
      }
      let remoteHome = dr.current?.households?.[targetId] || null;
      if(FB_ON && fbLoad){
        try{ remoteHome = await fbLoad(targetId); }
        catch(err){
          console.error(err);
          return { ok:false, reason:isPermissionErr(err)?"permission":"unknown" };
        }
      }
      if(!remoteHome) return { ok:false, reason:"not-found" };
      const normalized = normalizeData({ households:{ [targetId]: remoteHome } });
      const home = normalized.households?.[targetId];
      if(!home) return { ok:false, reason:"not-found" };
      const updatedHome = attachMember(home);
      const payloadData = { households:{ [targetId]: updatedHome } };
      const payloadHome = updatedHome;
      if(FB_ON && fbSave){
        try{ await fbSave(targetId, payloadHome); }
        catch(err){
          console.error(err);
          return { ok:false, reason:isPermissionErr(err)?"permission":"unknown" };
        }
      }
      else await doSave(d=>({ ...d, households:{...d.households,[targetId]:updatedHome} }));
      if(!FB_ON){
        try{ await linkUserHome(targetId); }
        catch(err){
          console.error(err);
          return { ok:false, reason:isPermissionErr(err)?"permission":"unknown" };
        }
      }
      setData(normalizeData(payloadData)); dr.current=normalizeData(payloadData);
      setActiveHome(targetId); setDeviceHome(deviceId, targetId); setAuthed(true); setCatId(null);
      return { ok:true };
    }

    return { ok:false, reason:"unknown" };
  };

  const createInvite = async()=>{
    if(!homeKey) return;
    const code = mkInviteCode();
    const expiresAt = Date.now() + 7*24*60*60*1000;
    if(FB_ON && fbCreateInvite && user?.uid) await fbCreateInvite({ code, householdId:homeKey, createdBy:user.uid, createdAt:Date.now(), expiresAt });
    else await doSave(d=>({...d,households:{...d.households,[homeKey]:{...d.households[homeKey],inviteCode:code}}}));
    try{ await navigator.clipboard.writeText(code); }catch{}
    alert(`${t.inviteCreated}: ${code}`);
  };

  const addAttack=async()=>{
    const mins=Math.max(0,Number(af.durationMin||0));
    const secs=Math.min(59,Math.max(0,Number(af.durationSec||0)));
    const duration=(mins*60+secs)/60;
    if(duration<=0 || !catId || !homeKey) return;
    await doSave(d=>({...d,households:{...d.households,[homeKey]:{...d.households[homeKey],cats:d.households[homeKey].cats.map(c=>c.id===catId?{...c,attacks:[...c.attacks,{id:nextId(c.attacks),date:af.date,severity:af.severity,duration,notes:af.notes,addedBy:uid}]}:c)}}}));
    setModal(null); setAf({date:today(),severity:"mild",durationMin:"",durationSec:"0",notes:""});
  };
  const addInhaler=async()=>{
    if(!catId || !homeKey) return;
    await doSave(d=>({...d,households:{...d.households,[homeKey]:{...d.households[homeKey],cats:d.households[homeKey].cats.map(c=>c.id===catId?{...c,inhalerLogs:[...c.inhalerLogs,{...inf,id:nextId(c.inhalerLogs),breaths:Number(inf.breaths),addedBy:uid}]}:c)}}}));
    setModal(null);
  };
  const deleteAttack=async(id)=>{
    if(!catId || !homeKey || !confirm(lang==="pt"?"Apagar esta crise?":"Delete this attack?")) return;
    await doSave(d=>({...d,households:{...d.households,[homeKey]:{...d.households[homeKey],cats:d.households[homeKey].cats.map(c=>c.id===catId?{...c,attacks:c.attacks.filter(a=>a.id!==id)}:c)}}}));
  };
  const editAttack=(attack)=>{
    const totalSec = Math.max(0,Math.round(Number(attack.duration||0)*60));
    setAf({
      date:attack.date||today(),
      severity:["mild","moderate","severe"].includes(attack.severity)?attack.severity:"mild",
      durationMin:String(Math.floor(totalSec/60)),
      durationSec:String(totalSec%60),
      notes:attack.notes||""
    });
    setEditAttackId(attack.id);
    setModal("editAttack");
  };
  const saveEditedAttack=async()=>{
    const mins=Math.max(0,Number(af.durationMin||0));
    const secs=Math.min(59,Math.max(0,Number(af.durationSec||0)));
    const duration=(mins*60+secs)/60;
    if(duration<=0 || !catId || !homeKey || !editAttackId) return;
    await doSave(d=>({...d,households:{...d.households,[homeKey]:{...d.households[homeKey],cats:d.households[homeKey].cats.map(c=>c.id===catId?{...c,attacks:c.attacks.map(a=>a.id===editAttackId?{...a,date:af.date,severity:af.severity,duration,notes:af.notes}:a)}:c)}}}));
    setModal(null);
    setEditAttackId(null);
    setAf({date:today(),severity:"mild",durationMin:"",durationSec:"0",notes:""});
  };
  const deleteInhaler=async(id)=>{
    if(!catId || !homeKey || !confirm(lang==="pt"?"Apagar este registo de inalador?":"Delete this inhaler record?")) return;
    await doSave(d=>({...d,households:{...d.households,[homeKey]:{...d.households[homeKey],cats:d.households[homeKey].cats.map(c=>c.id===catId?{...c,inhalerLogs:c.inhalerLogs.filter(l=>l.id!==id)}:c)}}}));
  };
  const editInhaler=(log)=>{
    setInf({date:log.date||today(),breaths:Math.max(1,Number(log.breaths)||1),dosage:log.dosage||""});
    setEditInhalerId(log.id);
    setModal("editInhaler");
  };
  const saveEditedInhaler=async()=>{
    if(!catId || !homeKey || !editInhalerId) return;
    await doSave(d=>({...d,households:{...d.households,[homeKey]:{...d.households[homeKey],cats:d.households[homeKey].cats.map(c=>c.id===catId?{...c,inhalerLogs:c.inhalerLogs.map(l=>l.id===editInhalerId?{...l,date:inf.date,breaths:Math.max(1,Number(inf.breaths)||1),dosage:inf.dosage}:l)}:c)}}}));
    setModal(null);
    setEditInhalerId(null);
    setInf({date:today(),breaths:2,dosage:"110mcg"});
  };
  const saveII=()=> homeKey && catId && doSave(d=>({...d,households:{...d.households,[homeKey]:{...d.households[homeKey],cats:d.households[homeKey].cats.map(c=>c.id===catId?{...c,inhalerInfo:{...iif}}:c)}}}));
  const saveProfiles=async(ps)=>{ if(!homeKey) return; await doSave(d=>({...d,households:{...d.households,[homeKey]:{...d.households[homeKey],profiles:ps}}})); setShowMgr(false); };

  const authProfile = { id:user?.uid||mkId(), name:(user?.displayName||user?.email?.split("@")[0]||"User"), emoji:"🧑", color:PCOLS[0] };
  const profilesRaw=currentHome?.profiles;
  const profiles=Array.isArray(profilesRaw) ? profilesRaw : (user?.uid ? [authProfile] : null);
  const cats=currentHome?.cats||[];
  const currentCat=cats.find(c=>c.id===catId)||null;

  useEffect(()=>{
    if(!homeKey || !user?.uid || !currentHome) return;
    const existing = Array.isArray(currentHome.profiles) ? currentHome.profiles : [];
    const existingMembers = Array.isArray(currentHome.members) ? currentHome.members : [];
    const existingMemberKeys = currentHome.memberKeys && typeof currentHome.memberKeys === "object" ? currentHome.memberKeys : {};
    if(existing.some(p=>p.id===user.uid) && existingMembers.includes(user.uid) && existingMemberKeys[user.uid]===true) return;
    doSave(d=>{
      const latest = Array.isArray(d.households?.[homeKey]?.profiles) ? d.households[homeKey].profiles : [];
      const latestMembers = Array.isArray(d.households?.[homeKey]?.members) ? d.households[homeKey].members : [];
      const latestMemberKeys = d.households?.[homeKey]?.memberKeys && typeof d.households[homeKey].memberKeys === "object" ? d.households[homeKey].memberKeys : {};
      if(latest.some(p=>p.id===user.uid) && latestMembers.includes(user.uid) && latestMemberKeys[user.uid]===true) return d;
      return ({
        ...d,
        households:{
          ...d.households,
          [homeKey]:{
            ...d.households[homeKey],
            profiles: latest.some(p=>p.id===user.uid) ? latest : [...latest,{ id:user.uid, name:(user?.displayName||user?.email?.split("@")[0]||"User"), emoji:"🧑", color:PCOLS[0] }],
            members: latestMembers.includes(user.uid) ? latestMembers : [...latestMembers, user.uid],
            memberKeys: { ...latestMemberKeys, [user.uid]: true }
          }
        }
      });
    });
  },[homeKey,user?.uid,currentHome]);


  if(FB_ON && !authReady) return e("div",{style:{background:G.bg,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12,color:G.text}},e("div",{style:{fontSize:34}},"🔐"),e("div",{className:"blink",style:{fontSize:13,color:G.muted}},"Loading account…"));
  if(FB_ON && authReady && !user) return e(AuthGate,{lang,setLang,onAuth:handleUserAuth});

  if(!data) return e("div",{style:{background:G.bg,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}},
    e("div",{style:{fontSize:52}},"🐱"),
    e("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:700}},"Pawsthma"),
